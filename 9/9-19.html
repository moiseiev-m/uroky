кає з початку \u003cb>всього\u003c/b> списку й знаходить двійку з індексом \u003cb>0\u003c/b> — у вже відсортованій частині."}, {"p": 2, "f": "swap", "k": "Помилка", "say": "Міняються \u003cb>a[0]\u003c/b> і \u003cb>a[1]\u003c/b> — список зіпсовано: \u003cb>[5, 2, 2]\u003c/b>."}, {"p": 2, "f": "min", "fix": true, "k": "Виправлення", "say": "\u003cb>a.index(m, first)\u003c/b> шукає, починаючи з індексу \u003cb>first\u003c/b>: тепер \u003cb>ind = 2\u003c/b>."}, {"p": 2, "f": "swap", "fix": true, "k": "Правильно", "say": "Міняються \u003cb>a[2]\u003c/b> і \u003cb>a[1]\u003c/b>: \u003cb>[2, 2, 5]\u003c/b> — відсортовано."}]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "items": [["Як змінити програми, щоб сортувати \u003cb>за спаданням\u003c/b>?", "Шукати найбільший: \u003cb class=\"mono\">a[j] &gt; maxi\u003c/b> або \u003cb class=\"mono\">max(a[first:])\u003c/b>."], ["Чи правильно сортують програми, якщо є \u003cb>рівні\u003c/b> числа?", "Перша — так. Коротша — лише з \u003cb class=\"mono\">a.index(m, first)\u003c/b>."], ["Чим відрізняються результати sort і sorted?", "sort змінює сам список; sorted дає новий, а старий зберігає."], ["Коли зручніше sort, а коли sorted?", "sort — старий порядок не потрібен; sorted — потрібні обидва."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді на запитання", "note": "", "items": [["Які ви знаєте способи сортування списку?", "\u003cb class=\"mono\">sort\u003c/b>, \u003cb class=\"mono\">sorted\u003c/b>, метод вибору; метод обміну — наступного уроку."], ["З якою метою сортують списки?", "Щоб швидше шукати, бачити найменші й найбільші значення, складати рейтинги."], ["Наведіть приклад використання функції sorted.", "\u003cb class=\"mono\">b = sorted(a, reverse = True)\u003c/b> — новий список за спаданням."], ["У чому суть методу вибору?", "Найменший у невідсортованій частині міняємо з її першим; n − 1 разів."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "a = [4, 1, 3]. Що виведе \u003cb class=\"mono\">print(sorted(a), a)\u003c/b>?", "a": ["[1, 3, 4] [1, 3, 4]", "[1, 3, 4] [4, 1, 3]", "[4, 3, 1] [4, 1, 3]", "None [4, 1, 3]"], "ok": 1, "exp": "sorted створює новий список, a не змінюється."}, {"q": "Який список упорядкований за незростанням, але \u003cb>не\u003c/b> за спаданням?", "a": ["[9, 7, 4, 2]", "[2, 7, 7, 9]", "[9, 7, 7, 2]", "[7, 9, 2, 7]"], "ok": 2, "exp": "Рівні сусіди 7 і 7 дозволені лише в незростаючому."}, {"q": "Як відсортувати сам список a за спаданням?", "a": ["a.sort()", "b = sorted(a)", "sorted(a, reverse = True)", "a.sort(reverse = True)"], "ok": 3, "exp": "Метод sort змінює сам список, reverse = True — за спаданням."}, {"q": "Метод вибору, список [6, 3, 9, 1]. Яким він стане після першого проходу?", "a": ["[1, 3, 9, 6]", "[1, 6, 3, 9]", "[3, 6, 9, 1]", "[1, 3, 6, 9]"], "ok": 0, "exp": "Найменший 1 міняється місцями з першим — 6."}, {"q": "Скільки проходів методу вибору потрібно для списку з 8 елементів?", "a": ["8", "7", "4", "64"], "ok": 1, "exp": "n − 1: останній елемент стає на місце сам."}]}, {"type": "home", "sec": "Фініш", "note": "", "items": [["📖 Підручник", "§ 3.3, с. 117–120", "Проаналізувати текст, відповісти на питання 1–4 на с. 125."], ["✍ Практична", "Сортування в ЄPython", "Три рівні: оцінки групи, пастка методу вибору, забіг."], ["💡 Готуємось", "Метод обміну", "Як поміняти місцями значення двох змінних?"]]}]};
