 сайт, пошта)."], ["3. Що таке режим рецензування?", "Режим, у якому Word показує всі правки для спільної роботи."], ["4. Навіщо закладки?", "Для швидкого переходу й внутрішніх гіперпосилань."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Що потрібно, щоб Word створив зміст автоматично?", "a": ["Оформити назви частин стилями заголовків", "Пронумерувати сторінки", "Зробити назви великими й жирними", "Увімкнути режим рецензування"], "ok": 0, "exp": "Зміст Word збирає зі стилів Заголовок 1, Заголовок 2…"}, {"q": "Де у Word вставляють зміст?", "a": ["Вставлення ⇒ Таблиця", "Посилання ⇒ Зміст ⇒ Зміст", "Рецензування ⇒ Відстеження", "Подання ⇒ Структура"], "ok": 1, "exp": "Кнопка Зміст — на вкладці Посилання."}, {"q": "Як перейти за гіперпосиланням у документі Word?", "a": ["Подвійний клік", "Права кнопка", "Ctrl + клік", "Клавіша Enter"], "ok": 2, "exp": "Без Ctrl клік лише ставить курсор у текст посилання."}, {"q": "Яке з посилань — внутрішнє?", "a": ["На сайт музею", "На файл на Google Диску", "На електронну скриньку", "На таблицю в цьому ж документі"], "ok": 3, "exp": "Внутрішнє веде до місця в тому самому документі."}, {"q": "Що відбувається з видаленим словом у режимі рецензування?", "a": ["Воно закреслюється", "Воно зникає", "Воно стає жирним", "Воно переноситься в кінець"], "ok": 0, "exp": "Слово зникне, лише коли автор прийме правку."}]}, {"type": "home", "sec": "Фініш", "note": "", "items": [["📖 Підручник", "§ 2.5 (с. 83–93)", "Запитання 1–5 на с. 91–92."], ["✍ Практична і тест", "Зміст, посилання, рецензування", "Два документи з е-додатка."], ["🔍 Готуємося", "Практична робота № 3", "Стилі, зміст, посилання, рецензування."]]}]};
