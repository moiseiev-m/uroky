", "head": ["Вираз", "Результат"], "rows": [["\u003cb class=\"mono\">'Іванна ' + 'Васильченко'\u003c/b>", "\u003cb class=\"mono\">'Іванна Васильченко'\u003c/b>"], ["\u003cb class=\"mono\">'9-А' * 2\u003c/b>", "\u003cb class=\"mono\">'9-А9-А'\u003c/b>"], ["\u003cb class=\"mono\">'9-А' * 3\u003c/b>", "\u003cb class=\"mono\">'9-А9-А9-А'\u003c/b>"], ["\u003cb class=\"mono\">'5' + '7'\u003c/b>", "\u003cb class=\"mono\">'57'\u003c/b> — не 12!"], ["\u003cb class=\"mono\">'-' * 20\u003c/b>", "20 рисок підряд"], ["\u003cb class=\"mono\">'Рік ' + 2026\u003c/b>", "помилка \u003cb class=\"mono\">TypeError\u003c/b>"]], "frag": true, "leftFirst": true, "foot": "Рядок і число одразу не додати: \u003cb class=\"mono\">'Рік ' + str(2026)\u003c/b>"}, {"type": "steps", "sec": "🔗 Операції", "title": "Зріз рядка", "note": "", "intro": "Зріз — частина рядка: \u003cb class=\"mono\">b = a[i:j:step]\u003c/b>", "steps": ["\u003cb class=\"mono\">i\u003c/b> — індекс \u003cb>початку\u003c/b>: символ з індексом i входить у зріз.", "\u003cb class=\"mono\">j\u003c/b> — індекс \u003cb>кінця\u003c/b>: символ з індексом j уже \u003cb>не входить\u003c/b>.", "\u003cb class=\"mono\">step\u003c/b> — \u003cb>крок\u003c/b>; від’ємний — справа наліво. Крок 1 можна не писати.", "Немає \u003cb class=\"mono\">i\u003c/b> — від початку рядка; немає \u003cb class=\"mono\">j\u003c/b> — до кінця."]}, {"type": "widget", "sec": "🔗 Операції", "title": "Зрізи крок за кроком", "note": "", "w": "zriz21", "s": "інформатика", "name": "a", "steps": [{"k": "Рядок", "say": "11 символів: індекси від 0 до 10, з кінця — від −11 до −1."}, {"z": "a[2:6]", "k": "Від 2 до 6", "say": "Від індексу 2 до 6, \u003cb>без\u003c/b> символу з індексом 6."}, {"z": "a[1:8:2]", "k": "Передбачте", "ask": true, "say": "Крок 2 — кожен другий символ. Який зріз вийде?"}, {"z": "a[1:8:2]", "k": "Крок 2", "say": "Індекси 1, 3, 5, 7 — символи н, о, м, т."}, {"z": "a[4:]", "k": "Без кінця", "say": "Немає \u003cb>j\u003c/b> — зріз до кінця рядка."}, {"z":
