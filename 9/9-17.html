 у функції \u003cb class=\"mono\">min\u003c/b>, щоб вона знаходила \u003cb>найбільше\u003c/b> значення?", "Знак \u003cb class=\"mono\">&lt;\u003c/b> на \u003cb class=\"mono\">&gt;\u003c/b>; змінну краще назвати \u003cb class=\"mono\">maximum\u003c/b>."], ["Чому цикл починається з 1, а не з 0?", "\u003cb class=\"mono\">a[0]\u003c/b> уже в \u003cb class=\"mono\">m\u003c/b> — порівнювати його з собою зайве."], ["Що буде, якщо список порожній?", "Помилка: елемента \u003cb class=\"mono\">a[0]\u003c/b> немає. Вбудована \u003cb class=\"mono\">min\u003c/b> теж дає помилку."]]}, {"type": "text", "sec": "🎯 Мін і макс", "title": "Задача 5. Температури місяця", "note": "", "img": "a917_temp", "body": [{"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "У списку — середні температури кожного дня місяця. Знайти \u003cb>різницю\u003c/b> між найбільшою і найменшою."}]}, {"k": "p", "text": "Можна так: \u003cb class=\"mono\">max(t) - min(t)\u003c/b>. Але тоді список переглядається \u003cb>двічі\u003c/b>.", "f": true}, {"k": "p", "text": "А як знайти обидва значення \u003cb>за один перегляд\u003c/b>?", "f": true}]}, {"type": "text", "sec": "🎯 Мін і макс", "title": "Функція minimax: один перегляд", "note": "", "body": [{"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb class=\"mono\">def minimax(a):\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠maximum = a[0]\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠minimum = a[0]\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠for i in range(1, len(a)):\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠if a[i] &gt; maximum:\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠maximum = a[i]\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠elif a[i] &lt; minimum:\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠ ⁠minimum = a[i]\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠rizn = maximum - minimum\u003c/b>\u003cbr>\u003cb class=\"mono\"> ⁠ ⁠ ⁠ ⁠return rizn\u003c/b>"}]}, {"k": "p", "
