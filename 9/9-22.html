ms": [{"k": "box", "tone": "pink", "blocks": [{"k": "p", "text": "\u003cb class=\"mono\">a.upper()\u003c/b>\u003cbr>результат загубився, \u003cb class=\"mono\">a\u003c/b> — той самий"}]}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "\u003cb class=\"mono\">b = a.upper()\u003c/b> або \u003cb class=\"mono\">a = a.upper()\u003c/b>\u003cbr>результат збережено"}]}], "f": true}]}, {"type": "widget", "sec": "🔍 Пошук", "title": "Шукаємо в рядку: count, find, startswith", "note": "", "w": "metod22", "s": "величина", "name": "a", "steps": [{"k": "Рядок", "say": "8 символів, індекси від 0 до 7. Шукатимемо в ньому методами."}, {"z": "a.count('и')", "k": "count — скільки разів", "say": "Літера \u003cb>и\u003c/b> трапляється двічі — номерки 1 і 2."}, {"z": "a.count('и', 0, 3)", "k": "Передбачте", "ask": true, "say": "Тепер шукаємо лише від індексу 0 до 3. Скільки буде?"}, {"z": "a.count('и', 0, 3)", "k": "Кінець не входить", "say": "Символ з індексом 3 уже \u003cb>не входить\u003c/b> — як у зрізі. Тому 0."}, {"z": "a.find('лич')", "k": "find — де саме", "say": "\u003cb>find\u003c/b> дає індекс, з якого підрядок входить \u003cb>уперше\u003c/b>."}, {"z": "a.find('мар')", "k": "Передбачте", "ask": true, "say": "А якщо такого підрядка в рядку немає?"}, {"z": "a.find('мар')", "k": "Не знайдено", "say": "Немає — результат \u003cb>-1\u003c/b>."}, {"z": "a.find('и', 4, 6)", "k": "Пошук у межах", "say": "Від індексу 4 до 6 перша \u003cb>и\u003c/b> — з індексом 5."}, {"z": "a.startswith('вел')", "k": "startswith — чи починається", "say": "Усі три символи на початку збіглися — \u003cb>True\u003c/b>."}, {"z": "a.startswith('лич', 3, 6)", "k": "Передбачте", "ask": true, "say": "Чи починається з «лич» частина рядка від 3 до 6?"}, {"z": "a.startswith('лич', 3, 6)", "k": "False!", "say": "З індексу 3 стоїть «ичи», а не «лич»."}, {"z": "a.startswith('лич', 2)", "k": "Правильно — з 2", "say": "«лич» починається з індексу \u003cb>2\u003c/b> — True."}]}, {"type": "reveal", "sec": "🔍 По =\"mono\">a\u003c/b> не змінюється. Треба \u003cb class=\"mono\">a = a.upper()\u003c/b>."], ["\u003cb class=\"mono\">'Київ'.lower() == 'київ'\u003c/b> — True.", "Так: \u003cb class=\"mono\">lower()\u003c/b> робить усі літери малими."], ["\u003cb class=\"mono\">' ⁠ ⁠кіт ⁠ ⁠'.strip()\u003c/b> дає \u003cb class=\"mono\">'кіт'\u003c/b>.", "Так: без аргументу \u003cb class=\"mono\">strip\u003c/b> прибирає пропуски з країв."], ["\u003cb class=\"mono\">'банан'.replace('ан', 'он')\u003c/b> дає \u003cb class=\"mono\">'бонан'\u003c/b>.", "Ні: замінюються всі входження — \u003cb class=\"mono\">'бонон'\u003c/b>."]]}, {"type": "widget", "sec": "🔄 Новий рядок", "title": "Новий рядок у циклі", "note": "", "w": "krok", "code": ["a = 'к іт'", "s = ''", "for k in a:", "    if k != ' ': s = s + k", "print(s, a.replace(' ', ''))"], "names": {"a": "рядок", "s": "новий рядок", "k": "символ"}, "steps": [{"line": 1, "k": "Задача", "say": "Прибрати з рядка пропуск. Змінити рядок не можна — \u003cb>створимо новий\u003c/b>.", "vars": {"a": "'к іт'"}}, {"line": 2, "k": "Порожній рядок", "say": "Новий рядок \u003cb>s\u003c/b> — спершу порожній.", "vars": {"a": "'к іт'", "s": "''"}}, {"line": 3, "k": "Передбачте", "ask": true, "say": "Що виведе програма?", "vars": {"a": "'к іт'", "s": "''"}}, {"line": 4, "k": "Перший символ", "say": "\u003cb>k = 'к'\u003c/b> — не пропуск, дописуємо в кінець \u003cb>s\u003c/b>.", "vars": {"a": "'к іт'", "s": "'к'", "k": "'к'"}}, {"line": 4, "k": "Пропуск", "say": "\u003cb>k = ' '\u003c/b> — умова хибна, \u003cb>s\u003c/b> не змінюється.", "vars": {"a": "'к іт'", "s": "'к'", "k": "' '"}}, {"line": 4, "k": "Далі", "say": "\u003cb>k = 'і'\u003c/b> — дописуємо: \u003cb>s = 'кі'\u003c/b>.", "vars": {"a": "'к іт'", "s": "'кі'", "k": "'і'"}}, {"line": 4, "k": "Останній символ", "say": "\u003cb>k = 'т'\u003c/b> — \u003cb>s = 'кіт'\u003c/b>. Символи скінчились.", "vars": {"a": "'к іт'", "s": "'кіт'", "k": "'т'"}}, {"line": 5, "k": "Результат", "say": "Обидва способи дають
