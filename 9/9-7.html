": "Google Cloud Vision"}, {"img": "a97_tess", "t": "Tesseract"}], "n": 2, "h": 110}]}, {"label": "Мовлення", "body": [{"k": "p", "text": "\u003cb>Системи розпізнавання мовлення\u003c/b> — перетворюють усне мовлення на текст: голосове введення, транскрибування."}, {"k": "grid", "items": [{"img": "a97_azure", "t": "Microsoft Azure Speech"}, {"img": "a97_transcr", "t": "Amazon Transcribe"}], "n": 2, "h": 110}]}]}, {"type": "cards", "sec": "🖥 Програми", "title": "Локальні й хмарні системи", "bit": "Хто вже редагував документ разом з однокласниками?", "note": "", "n": 2, "intro": "За типом доступу системи опрацювання текстів бувають:", "cards": [{"img": "a97_wordlogo", "t": "Локальні", "x": "Установлюються на комп’ютер і працюють без інтернету"}, {"img": "a97_m365", "t": "Хмарні", "x": "Доступні онлайн, зручні для спільної роботи: Google Документи, Microsoft 365"}]}, {"type": "text", "sec": "🖥 Програми", "title": "WYSIWYG — що бачиш, те й отримаєш", "note": "", "img": "a97_wys", "body": [{"k": "p", "text": "\u003cb>W\u003c/b>hat \u003cb>Y\u003c/b>ou \u003cb>S\u003c/b>ee \u003cb>I\u003c/b>s \u003cb>W\u003c/b>hat \u003cb>Y\u003c/b>ou \u003cb>G\u003c/b>et."}, {"k": "def", "text": "\u003cb>WYSIWYG\u003c/b> — технологія, за якої документ на екрані виглядає так само, як буде надрукований або збережений у файлі.", "f": true}, {"k": "p", "text": "Її підтримує більшість систем опрацювання текстів.", "small": true, "f": true}]}, {"type": "reveal", "sec": "🧩 Об’єкти", "title": "Пригадайте", "note": "", "img": "a97_q2", "items": [["З яких об’єктів складається текстовий документ?", "Символи, слова, речення, абзаци, сторінки, а ще малюнки, таблиці, діаграми."], ["Які операції виконують над об’єктами?", "Створення, редагування, форматування."]]}, {"type": "text", "sec": "🧩 Об’єкти", "title": "Об’єкти текстового документа", "note": "", "body": [{"k": "p", "text": "Основний об’єкт опрацювання — \u003cb>текстовий документ\u003c/b>. У ньому є інші об’єкти:"}, {"k": "chips", "items": ["символ", "слово", "речення", "абзац", "сторінка"], "f": true}, {"k": "chips", "items": ["малюнок", "таблиця", "діаграма", "схема"], "f": true}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "Кожен об’єкт має свої \u003cb>властивості\u003c/b>. Змінюючи їх, ми форматуємо документ."}], "f": true}]}, {"type": "table", "sec": "🧩 Об’єкти", "title": "Об’єкти та їх властивості", "note": "", "head": ["Об’єкт", "Властивості"], "rows": [["Символ", "шрифт, розмір, колір, накреслення, видозміна, зсув, інтервал між символами"], ["Абзац", "відступи зліва й справа, відступ першого рядка, вирівнювання, міжрядковий інтервал, відстань між абзацами"], ["Сторінка", "розмір аркуша, орієнтація, поля, нумерація, колонтитули"], ["Малюнок", "тип, розмір, кольори, положення, обтікання текстом"], ["Таблиця", "кількість рядків і стовпців, їх висота й ширина, заливка"]], "frag": true, "leftFirst": true}, {"type": "reveal", "sec": "🧩 Об’єкти", "title": "Чия це властивість?", "bit": "Хто перший назве об’єкт — той молодець!", "note": "", "compact": true, "items": [["Орієнтація", "сторінки"], ["Накреслення (жирний, курсив)", "символу"], ["Міжрядковий інтервал", "абзацу"], ["Обтікання текстом", "малюнка"], ["Кількість стовпців і заливка", "таблиці"]]}, {"type": "reveal", "sec": "📄 Формати", "title": "Пригадайте", "note": "", "img": "a97_q3", "items": [["Що таке формат файлу? Що він визначає?", "Спосіб запису даних у файлі. Від нього залежить, якими програмами файл можна відкрити."], ["Який стандартний формат файлів Word?", "DOCX."]]}, {"type": "text", "sec": "📄 Формати", "title": "Стандартний формат і конвертори", "note": "", "body": [{"k": "p", "text": "Кожна система опрацювання текстів уміє зберігати документ у кількох форматах."}, {"k": "def", "text": "\u003cb>Стандартний формат\u003c/b> — той, у якому програма зберігає документ за замовчуванням. У Word це \u003cb>DOCX\u003c/b>.", "f": true}, {"k": "def", "text": "\u003cb>Конвертори\u003c/b> — програми, які перетворюють файл з одного фор
