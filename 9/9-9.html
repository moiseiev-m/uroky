ової сторінки.", "Ні — на тій самій сторінці"], ["Скасувавши стовпці, ми автоматично видаляємо розриви розділів.", "Ні — розриви лишаються, їх видаляють самі"], ["Колонтитул видно в режимі Чернетка.", "Ні — лише в Розмітці сторінки й Режимі читання"]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "img": "a99_think", "items": [["Чим розрив сторінки відрізняється від розриву розділу?", "Розрив сторінки лише переносить текст, розрив розділу дає власні параметри."], ["Чи завжди стовпці покращують сприйняття тексту?", "Ні: газеті й буклету — так, широким таблицям — ні."], ["Яку інформацію варто розміщувати в колонтитулах?", "Назву, розділ, номер сторінки — те, що допомагає орієнтуватися."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді на запитання", "note": "", "two": true, "items": [["1. Що таке розділ документа? Для чого він?", "Частина з власними параметрами сторінки: полями, орієнтацією, стовпцями."], ["2. Які є види розривів розділів?", "Наступна сторінка, неперервно, парна, непарна сторінка."], ["3. Які властивості стовпців можна змінити?", "Кількість, ширину, проміжок, розділювач."], ["4. Як зробити різні колонтитули для різних частин?", "Поділити на розділи й вимкнути «Як у попередньому»."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Де у Word вставляють розрив розділу?", "a": ["Макет ⇒ Параметри сторінки ⇒ Розриви", "Основне ⇒ Абзац ⇒ Розриви", "Подання ⇒ Розриви", "Вставлення ⇒ Колонтитули"], "ok": 0, "exp": "Кнопка Розриви — у групі Параметри сторінки на вкладці Макет."}, {"q": "Який розрив почне новий розділ на тій самій сторінці?", "a": ["Наступна сторінка", "Неперервно", "Парна сторінка", "Непарна сторінка"], "ok": 1, "exp": "Неперервний розрив потрібен, щоб частина сторінки була в стовпцях."}, {"q": "Що стане з текстом над видаленим розривом розділу?", "a": ["Він зникне", "Він стане частиною наступного розділу з його форматуванням", "Він залишиться без змін", "Він перейде на нову сторінку"], "ok": 1, "exp": "Форматування береться з розділу, що йде після розриву."}, {"q": "Що з'являється на лінійці, коли курсор у тексті зі стовпцями?", "a": ["Позначки табуляції", "Номери сторінок", "Маркери меж стовпців", "Колонтитули"], "ok": 2, "exp": "Перетягуючи їх, змінюють ширину стовпців і проміжок."}, {"q": "Яку кнопку вимикають, щоб колонтитул розділу 2 відрізнявся від розділу 1?", "a": ["Закрити колонтитули", "Як у попередньому", "Інші для першої сторінки", "Дата й час"], "ok": 1, "exp": "Тоді колонтитул нового розділу не повторює попередній."}]}, {"type": "home", "sec": "Фініш", "note": "", "items": [["📖 Підручник", "§ 2.3 (с. 62–70)", "Запитання 1–6 на с. 69."], ["✍ Практична і тест", "Розділи, стовпці, колонтитули", "Документ ЮНЕСКО і права людини."], ["🔍 Готуємось", "Питання на с. 70", "Практична робота № 2."]]}]};
