<!DOCTYPE html>
<html lang="uk" data-theme="light" data-grade="6">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6 клас · Розділ 2</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
/* ===== Design tokens (board-first). Light theme is default: projectors wash out dark slides. ===== */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EFEBFF; --paper:#FFFFFF; --ink:#1E1B4B; --muted:#57547E;
  --vio:#6D4AFF; --vio-soft:#ECE7FF; --mint:#0C9B70; --mint-soft:#DBF6EC;
  --sun:#FFC228; --sun-soft:#FFF3CC; --pink:#E8336F; --pink-soft:#FFE2EC;
  --sky:#1F8EF1; --sky-soft:#DFF0FF; --line:#D6D0F2; --off:#E6E2F8; --doc:#F3F2F7;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  /* Спільні назви токенів дизайн-систем: уроки можуть писати var(--accent), var(--coral)…
     і виглядати правильно в будь-якій темі. Тема Swiss задає власні значення. */
  --accent:var(--vio); --on-accent:#FFFFFF; --accent-tint:var(--vio-soft);
  --coral:var(--pink); --mintb:var(--mint); --on-bright:#1E1B4B;
  --positive:var(--mint); --negative:var(--pink);
  --rule:var(--ink); --rule-soft:var(--line); --paper-alt:var(--doc);
  --sec:var(--vio); --on-sec:#FFFFFF; --grade:var(--vio); --on-grade:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13112A; --paper:#1E1B3D; --ink:#EEEBFF; --muted:#A9A5D3;
  --vio:#9C84FF; --vio-soft:#2E2760; --mint:#3FD9A6; --mint-soft:#163D33;
  --sun:#FFCF52; --sun-soft:#3D3420; --pink:#FF77A5; --pink-soft:#46213A;
  --sky:#5EB1FF; --sky-soft:#1B3355; --line:#3A3570; --off:#2C2858; --doc:#2A2750;
}}
:root[data-theme="dark"]{
  --bg:#13112A; --paper:#1E1B3D; --ink:#EEEBFF; --muted:#A9A5D3;
  --vio:#9C84FF; --vio-soft:#2E2760; --mint:#3FD9A6; --mint-soft:#163D33;
  --sun:#FFCF52; --sun-soft:#3D3420; --pink:#FF77A5; --pink-soft:#46213A;
  --sky:#5EB1FF; --sky-soft:#1B3355; --line:#3A3570; --off:#2C2858; --doc:#2A2750;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

/* ===== App bar ===== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;
  padding:.5rem clamp(.7rem,2.5vw,1.6rem);background:var(--bg);border-bottom:1px solid var(--line)}
.bar .ttl{font-family:var(--display);font-size:.95rem;font-weight:700;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.32rem .8rem;cursor:pointer;font-weight:700;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ===== Hub ===== */
.hub{max-width:1100px;margin:0 auto;padding:2rem clamp(1rem,4vw,2rem) 4rem}
.hub h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,5vw,3rem);line-height:1.1;margin:.5rem 0 .4rem;letter-spacing:-.02em}
.hub .lead{color:var(--muted);font-size:1.1rem;max-width:60ch;margin:0 0 1.6rem}
.grades{display:flex;gap:.5rem;margin-bottom:1.2rem;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.lcard{display:flex;flex-direction:column;gap:.5rem;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:22px;padding:1.2rem 1.3rem;cursor:pointer;min-height:190px}
.lcard:hover{border-color:var(--vio)}
.lcard .e{font-size:2.2rem;line-height:1}
.lcard .meta{font-weight:800;color:var(--vio);font-size:.92rem}
.lcard b{font-family:var(--display);font-size:1.05rem;line-height:1.3}
.lcard .cnt{margin-top:auto;color:var(--muted);font-size:.9rem}
.keys{margin-top:2.4rem;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1rem 1.3rem}
.keys h2{font-family:var(--display);font-size:1rem;margin:0 0 .5rem}
.keys ul{margin:0;padding-left:1.1rem;columns:2;column-gap:2rem}
@media (max-width:640px){.keys ul{columns:1}}
kbd{font-family:var(--mono);font-size:.85em;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 .35em;background:var(--bg)}

/* ===== Deck frame ===== */
#deck{padding:clamp(.5rem,1.8vw,1.2rem)}
.viewport{position:relative;width:100%;max-width:1280px;margin:0 auto;aspect-ratio:16/9;overflow:hidden;border-radius:20px;background:var(--paper);
  box-shadow:0 1px 0 var(--line),0 20px 44px -26px rgba(40,20,120,.5)}
.viewport:fullscreen{border-radius:0;max-width:none;aspect-ratio:auto;width:100vw;height:100vh;background:#000}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--paper)}
.pen{position:absolute;inset:0;z-index:5;pointer-events:none;touch-action:none}
.pen.on{pointer-events:auto;cursor:crosshair}
.blank{position:absolute;inset:0;z-index:6;background:#000;display:none}
.blank.on{display:block}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px auto 0;max-width:1280px;flex-wrap:wrap}
.nav button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.5rem 1.3rem;cursor:pointer;font-weight:800;font-size:1rem}
.nav .go{background:var(--vio);color:#fff;border-color:var(--vio)}
.nav .pos{font-family:var(--mono);min-width:7rem;text-align:center}
.pencol{display:flex;gap:6px}
.pencol button{width:30px;height:30px;padding:0;border-radius:50%}
.notes{max-width:1280px;margin:12px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 18px}
.notes h4{margin:0 0 4px;font-family:var(--display);font-size:.85rem;font-weight:700;color:var(--muted)}
.notes p{margin:0}
.overview{max-width:1280px;margin:12px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.overview button{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:.9rem}
.overview button.cur{border-color:var(--vio);background:var(--vio-soft)}
.overview span{font-family:var(--mono);color:var(--muted);margin-right:6px}

/* ===== Slide base (sizes tuned for reading from the back row) ===== */
.slide{position:absolute;inset:0;padding:78px 64px 40px;display:none;flex-direction:column}
.slide.on{display:flex}
.slide h2{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.12;margin:0 0 24px;letter-spacing:-.02em;max-width:1120px}
.slide h3{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 10px}
.slide p,.slide li{font-size:28px;line-height:1.38;margin:0 0 14px}
.slide ul,.slide ol{margin:0;padding-left:1.1em}
.slide li::marker{color:var(--vio)}
.small{font-size:21px!important;color:var(--muted)}
.mono{font-family:var(--mono)}
.top{position:absolute;top:22px;left:64px;right:64px;display:flex;align-items:center;gap:14px}
.top .sec{font-weight:800;font-size:17px;background:var(--vio-soft);color:var(--vio);border-radius:999px;padding:5px 14px;white-space:nowrap}
.top .track{flex:1;height:8px;border-radius:4px;background:var(--off);overflow:hidden}
.top .track i{display:block;height:100%;background:var(--vio);border-radius:4px}
.top .n{font:700 15px var(--mono);color:var(--muted)}
.top .stepdots{display:flex;gap:4px}
.top .stepdots b{width:8px;height:8px;border-radius:50%;background:var(--off)}
.top .stepdots b.in{background:var(--pink)}

/* fragments: revealed with → / Space / pointer remote */
.f{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.f.in{opacity:1;transform:none}

.split{display:grid;grid-template-columns:1fr;gap:36px;flex:1;min-height:0}
.split.has-img{grid-template-columns:1.25fr .75fr}
.split .ill{max-height:430px;object-fit:contain;justify-self:center;align-self:center;border-radius:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;min-height:0}
.box{background:var(--vio-soft);border-radius:20px;padding:20px 26px}
.box.mint{background:var(--mint-soft)} .box.sun{background:var(--sun-soft)} .box.pink{background:var(--pink-soft)} .box.sky{background:var(--sky-soft)}
.box p:last-child{margin-bottom:0}
.def{border-left:10px solid var(--vio);padding:8px 0 8px 24px;margin:0 0 20px}
.def p{font-size:30px}
.big{font:800 64px var(--mono);text-align:center;margin:8px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{border-radius:14px;padding:10px 18px;font-size:24px;font-weight:800;background:var(--sky-soft)}
.hl{background:var(--sun);color:#3A2A00;border-radius:6px;padding:0 6px}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 18px;font-size:22px;cursor:pointer;font-weight:800}
.btn.on,.btn.primary{background:var(--vio);color:#fff;border-color:var(--vio)}
.btn:disabled{opacity:.4;cursor:default}
.field{font:700 26px var(--mono);padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:150px}
table.t{border-collapse:collapse;width:100%;font-size:24px}
table.t th,table.t td{border:2px solid var(--line);padding:9px 14px;text-align:center}
table.t th{background:var(--vio-soft);font-weight:800;font-size:21px}
table.t td.l,table.t th.l{text-align:left}
tr.f{transform:none}

/* title */
.s-title{justify-content:center;background:radial-gradient(circle at 85% 20%,var(--vio-soft),transparent 45%),radial-gradient(circle at 8% 92%,var(--sun-soft),transparent 40%)}
.s-title .kicker{font-size:26px;color:var(--muted);font-weight:800;margin-bottom:12px}
.s-title h2{font-size:58px;max-width:720px}
.s-title .sub{font-size:26px;color:var(--muted);max-width:680px}
.stickers{position:absolute;right:70px;top:150px;display:grid;grid-template-columns:repeat(3,120px);gap:18px;transform:rotate(-4deg)}
.stickers div{width:120px;height:120px;border-radius:28px;background:#fff;box-shadow:0 10px 24px -12px rgba(40,20,120,.45);display:grid;place-items:center;padding:16px;font:800 30px var(--display);color:#3A2A00}
.stickers img{max-height:88px}

/* reveal list (question → answer) */
.rv{display:flex;flex-direction:column;gap:16px}
.rv .item{border:2px solid var(--line);border-radius:20px;padding:16px 22px;background:var(--paper)}
.rv .q{font-size:28px;font-weight:800}
.rv .a{font-size:25px;color:var(--vio);font-weight:700;margin-top:6px}
.rv.compact .item{padding:10px 18px;display:flex;justify-content:space-between;gap:20px;align-items:center}
.rv.compact .q{font-size:25px;font-weight:700}
.rv.compact .a{margin:0;white-space:nowrap}

/* steps */
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;position:relative;padding-left:56px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 20px var(--mono)}
.answer{margin-top:auto}

/* cards */
.cards{display:grid;gap:18px;grid-template-columns:repeat(var(--n,3),1fr)}
.card{border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;background:var(--vio-soft)}
.card .e{font-size:50px;line-height:1}
.card img{height:90px;object-fit:contain;align-self:flex-start;background:#fff;border-radius:18px;padding:8px}
.card b{font-size:25px;line-height:1.25}
.card span{font-size:21px;color:var(--muted)}
.card:nth-child(5n+2){background:var(--sky-soft)} .card:nth-child(5n+3){background:var(--sun-soft)} .card:nth-child(5n+4){background:var(--mint-soft)} .card:nth-child(5n+5){background:var(--pink-soft)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-size:19px;font-weight:800;cursor:pointer}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabpane{display:none;flex:1;min-height:0}
.tabpane.on{display:block}
.apps{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.app{width:180px;text-align:center;font-weight:800;font-size:20px}
.app .ic{width:150px;height:150px;border-radius:30px;background:#fff;display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 8px 20px -12px rgba(40,20,120,.5);padding:18px;font:800 34px var(--display);color:#333}
.app .ic img{max-height:114px;max-width:114px;object-fit:contain}

/* quiz (teacher-driven) */
.qprog{display:flex;gap:6px;margin-bottom:18px}
.qprog span{width:46px;height:9px;border-radius:5px;background:var(--off)}
.qprog span.cur{background:var(--vio)}
.qq{font-size:32px;font-weight:800;margin-bottom:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:16px 22px;font-size:26px;font-weight:700;cursor:pointer;text-align:left}
.opt .l{font-family:var(--mono);color:var(--vio);margin-right:10px}
.opt.pick{border-color:var(--sky);background:var(--sky-soft)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft)}
.opt.no{opacity:.45}
.qexp{font-size:24px;margin-top:18px;min-height:40px;color:var(--mint);font-weight:700}

/* screenshot tour */
.shot{display:grid;grid-template-columns:330px 1fr;gap:24px;flex:1;min-height:0}
.hs-side{display:flex;flex-direction:column;gap:7px;min-height:0}
.hs-btn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-size:18px;font-weight:800;cursor:pointer;text-align:left}
.hs-btn.on{border-color:var(--pink);background:var(--pink-soft)}
.hs-text{font-size:21px;line-height:1.38;margin-top:6px;background:var(--sun-soft);border-radius:14px;padding:12px 14px;min-height:64px}
.frame{position:relative;overflow:hidden;border-radius:14px;border:2px solid var(--line);background:#fff;align-self:start}
.inner{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.inner img{display:block;width:100%;height:auto;max-width:none}
.spot{position:absolute;border:3px solid var(--pink);border-radius:6px;box-shadow:0 0 0 3000px rgba(30,20,80,.3);pointer-events:none;opacity:0;transition:opacity .3s}
.spot.on{opacity:1}
.dd{position:absolute;background:#fff;border:1px solid #999;box-shadow:0 6px 18px rgba(0,0,0,.3);font:13px "Segoe UI",sans-serif;color:#222;display:none;z-index:2;white-space:nowrap}
.dd div{padding:3px 10px}
.dd div:first-child{background:#CCE4F7}

/* mock documents & windows used by demos */
.paper{background:#fff;color:#222;box-shadow:0 8px 24px -14px rgba(0,0,0,.5);position:relative;transition:all .25s}
.win{border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:#fff;height:100%;min-height:0}
.win .rib{height:44px;flex:none;background:#F3F3F3;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;padding:0 14px;font:14px "Segoe UI",sans-serif;color:#333}
.win .rib span{background:#e3e3e3;border-radius:4px;width:46px;height:20px}
.win .body{flex:1;min-height:0;overflow:auto;background:#E6E6E6;color:#222;position:relative}
.win .sb{height:26px;flex:none;background:#F0F0F0;border-top:1px solid #ddd;font:13px "Segoe UI",sans-serif;color:#555;display:flex;align-items:center;padding:0 12px;gap:12px}
.dpage{background:#fff;width:520px;margin:18px auto;padding:44px 56px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:var(--serif);color:#222;min-height:640px;position:relative}
.dpage h6{font:800 22px var(--serif);margin:12px 0 6px;color:#2B2A7A}
.dpage p{font-size:15px!important;line-height:1.5!important;margin:0 0 8px!important}
.dpage .hdr{position:absolute;top:14px;right:24px;font:12px var(--body);color:#999}
.pic{border-radius:6px;background:linear-gradient(#8EC5FF,#8EC5FF 55%,#5DBB63 55%)}
.longdoc{background:#fff;width:560px;margin:14px auto;padding:30px 44px;font-family:var(--serif);color:#222}
.longdoc h6{font:800 20px var(--serif);margin:8px 0 6px;color:#2B2A7A}
.longdoc p{font-size:16px!important;line-height:1.5!important;margin:0 0 8px!important}
.pane{min-height:0;overflow:auto;background:#E6E6E6;position:relative}
.divider{height:12px;flex:none;background:#BDBDBD;cursor:row-resize;border-top:1px solid #999;border-bottom:1px solid #999;touch-action:none}

/* small widget helpers */
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px;font-weight:700}
.ctrl label{min-width:160px}
.ctrl input[type=range]{flex:1;accent-color:var(--vio)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 12px;font-size:18px;font-weight:800;cursor:pointer;min-width:42px}
.seg button.on{background:var(--vio);color:#fff;border-color:var(--vio)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--vio)}
.prev{background:var(--doc);border-radius:18px;display:grid;place-items:center;overflow:hidden;position:relative}
.cell{width:66px;height:66px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;font:700 32px var(--mono);cursor:pointer;background:var(--paper)}
.cell.one{background:var(--sun);border-color:var(--sun);color:#3A2A00}
.place{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 15px var(--mono);color:var(--muted)}
.count{font:800 96px/1 var(--display);color:var(--vio)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--ink);display:inline-block}
.dash{width:50px;height:15px;border-radius:8px;background:var(--ink);display:inline-block}
.sig{display:inline-flex;gap:8px;align-items:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.bar,.nav,.notes,.overview{display:none!important}}

/* QR to the lesson test */
.qr{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#1E1B4B;text-align:center}
.qr .qrimg{width:290px;height:290px}
.qr .qrimg svg{width:100%;height:100%;display:block}
.qr b{font-size:22px} .qr span{font-size:17px;color:#57547E}

/* ===== Керування показом (07.10.2026): панель у показі, огляд слайдів, підказка, перехід за номером ===== */
.viewport.idle,.viewport.idle *{cursor:none!important}
.blank.white{background:#fff}
.hud{position:absolute;left:50%;bottom:12px;z-index:25;display:flex;align-items:center;gap:2px;padding:5px 6px;border-radius:14px;
  background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 10px 28px -12px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .2s,transform .2s;top:auto;height:auto;width:max-content;max-width:calc(100% - 16px);flex-wrap:nowrap;overflow-x:auto}
.hud.show,.hud.inking{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.hud button{width:38px;height:38px;border:0;background:none;color:inherit;border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0}
.hud button:hover{background:var(--off)}
.hud button.on{background:var(--ink);color:var(--paper)}
.hud svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hud .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.hud-pos{font:700 14px var(--mono);min-width:92px;text-align:center;white-space:nowrap}
.hud-pal{display:none;align-items:center;gap:3px}
.hud.inking .hud-pal{display:flex}
.hud-pal .c{width:24px;height:24px;border-radius:50%;margin:0 2px;border:2px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.hud-pal .c:hover{background:inherit}
.hud-pal .c.on{box-shadow:0 0 0 3px var(--ink)}
.ovl{position:absolute;inset:0;z-index:30;background:rgba(10,10,25,.55);display:flex;align-items:center;justify-content:center;padding:2%}
.ovl[hidden]{display:none!important}
.ovl .panel{background:var(--paper);color:var(--ink);border-radius:16px;width:min(1200px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.ovl .phead{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-bottom:1.5px solid var(--line)}
.ovl .phead b{font-family:var(--display);font-size:1.05rem}
.ovl .phead .small{font-size:.85rem!important;margin-right:auto}
.ovl .phead button{width:36px;height:36px;border:0;background:none;color:inherit;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.ovl .phead button:hover{background:var(--off)}
.ovl .phead svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.ovgrid{overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.thumb{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px}
.thumb:hover{border-color:var(--vio)}
.thumb.cur{border-color:var(--vio);box-shadow:0 0 0 3px var(--vio-soft)}
.tbox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.tbox .slide{display:flex!important;position:absolute;inset:auto;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(var(--tk,.17));pointer-events:none;background:var(--paper)}
.tbox .f{opacity:1!important;transform:none!important}
.tn{font-size:.82rem;line-height:1.25;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tn b{font-family:var(--mono);color:var(--muted);margin-right:4px}
.panel.help{width:min(640px,100%)}
.panel.help table{border-collapse:collapse;margin:8px 16px 16px;font-size:.95rem}
.panel.help td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.panel.help td:first-child{white-space:nowrap}
.goto{position:absolute;right:16px;top:16px;z-index:26;background:var(--ink);color:var(--paper);font:700 20px var(--mono);padding:8px 14px;border-radius:10px}
.goto[hidden]{display:none}

/* ===== Тема «Шкільні презентації» — ЄДИНИЙ файл стилів теми (07.10.2026). Підключається: build_section.py --theme shkilni ===== */

/* ===== «Шкільні презентації»: organic blob, один акцент класу + темне чорнило =====
   Тема класу: <html data-grade="5..9">. Світла тема за замовчуванням, темна — кнопкою ◐. */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --surface:#f5f5f3; --card:#ffffff; --line:#c3cbc8;
  --accent:#63e6be; --accent-deep:#20c997; --accent-soft:#d3f9e8;
  --ink:#0f2e2a; --ink-muted:#1f3b37; --on-accent:#0f2e2a; --accent-ink:#0a5c45;
  --shadow:0 12px 24px rgba(0,0,0,.10);
  --r-sm:10px; --r-lg:28px; --r-pill:999px;
  --display:"Montserrat","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"Montserrat","Arial Black",system-ui,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
:root[data-grade="5"]{--accent:#ffd43b;--accent-deep:#fab005;--accent-soft:#fff4c2;--ink:#2b1e2a;--ink-muted:#3a2c37;--on-accent:#2b1e2a;--accent-ink:#6b4700}
:root[data-grade="6"]{--accent:#63e6be;--accent-deep:#20c997;--accent-soft:#d3f9e8;--ink:#0f2e2a;--ink-muted:#1f3b37;--on-accent:#0f2e2a;--accent-ink:#0a5c45}
:root[data-grade="7"]{--accent:#ffa94d;--accent-deep:#fd7e14;--accent-soft:#ffe8cc;--ink:#2e1b12;--ink-muted:#3d2b21;--on-accent:#2e1b12;--accent-ink:#8a3a00}
:root[data-grade="8"]{--accent:#b197fc;--accent-deep:#9775fa;--accent-soft:#ede6ff;--ink:#221a3a;--ink-muted:#2f2848;--on-accent:#221a3a;--accent-ink:#4b2fb0}
:root[data-grade="9"]{--accent:#74c0fc;--accent-deep:#339af0;--accent-soft:#dceeff;--ink:#13233a;--ink-muted:#26354b;--on-accent:#13233a;--accent-ink:#0b4a82}
/* темна тема: акцент той самий, текст на акценті лишається темним */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#111a19; --card:#1b2826; --line:#33433f; --ink:#eef4f2; --ink-muted:#b3c3bf;
  --accent-soft:#1f3a34; --accent-ink:var(--accent); --shadow:0 12px 24px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{
  --surface:#111a19; --card:#1b2826; --line:#33433f; --ink:#eef4f2; --ink-muted:#b3c3bf;
  --accent-soft:#1f3a34; --accent-ink:var(--accent); --shadow:0 12px 24px rgba(0,0,0,.45)}
/* старі назви токенів (для віджетів) → нова палітра */
:root{--bg:var(--surface);--paper:var(--card);--muted:var(--ink-muted);
  --vio:var(--ink);--vio-soft:var(--accent-soft);--mint:var(--accent-deep);--mint-soft:var(--accent-soft);
  --sun:var(--accent);--sun-soft:var(--accent-soft);--pink:var(--ink);--pink-soft:var(--accent-soft);
  --sky:var(--ink);--sky-soft:var(--accent-soft);--off:var(--line);--doc:var(--surface)}

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100%;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== App bar ===== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;
  padding:.55rem clamp(.7rem,2.5vw,1.6rem);background:var(--surface);border-bottom:1px solid var(--line)}
.bar .ttl{font-family:var(--display);font-size:.9rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:.5rem}
.bar .ttl .dotc{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.85rem}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:.34rem .85rem;cursor:pointer;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem}
.pill:hover{border-color:var(--accent-deep)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ===== Hub ===== */
.hub{position:relative;max-width:1100px;margin:0 auto;padding:2.4rem clamp(1rem,4vw,2rem) 4rem;isolation:isolate}
.hub-blob{position:absolute;right:0;top:-10px;width:min(360px,48vw);z-index:-1;pointer-events:none}
.hub h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,3.2rem);line-height:.98;margin:.5rem 0 .8rem;text-transform:uppercase;letter-spacing:.01em;max-width:14ch}
.hub .lead{color:var(--ink-muted);font-size:1.1rem;max-width:56ch;margin:0 0 1.8rem}
.grades{display:flex;gap:.5rem;margin-bottom:1.4rem;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem}
.lcard{display:flex;flex-direction:column;gap:.55rem;text-align:left;border:2px solid var(--accent);background:var(--card);border-radius:var(--r-sm);padding:1.3rem 1.4rem;cursor:pointer;min-height:200px;box-shadow:var(--shadow);transition:transform .2s}
.lcard:hover{transform:translateY(-3px)}
.lcard .e{width:3rem;height:3rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:1.4rem}
.lcard .meta{font-weight:700;color:var(--ink-muted);font-size:.9rem}
.lcard b{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.3}
.lcard .cnt{margin-top:auto;color:var(--ink-muted);font-size:.9rem;font-weight:600}
.keys{margin-top:2.6rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:1.1rem 1.4rem}
.keys h2{font-family:var(--display);font-weight:800;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 .6rem}
.keys ul{margin:0;padding-left:1.1rem;columns:2;column-gap:2rem}
@media (max-width:640px){.keys ul{columns:1}}
kbd{font-family:var(--body);font-weight:700;font-size:.85em;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 .35em;background:var(--surface)}

/* ===== Deck frame ===== */
#deck{padding:clamp(.5rem,1.8vw,1.2rem)}
.viewport{position:relative;width:100%;max-width:1280px;margin:0 auto;aspect-ratio:16/9;overflow:hidden;border-radius:20px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.viewport:fullscreen{border-radius:0;border:0;max-width:none;aspect-ratio:auto;width:100vw;height:100vh;background:#000}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--surface)}
.pen{position:absolute;inset:0;z-index:5;pointer-events:none;touch-action:none}
.pen.on{pointer-events:auto;cursor:crosshair}
.blank{position:absolute;inset:0;z-index:6;background:#000;display:none}
.blank.on{display:block}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px auto 0;max-width:1280px;flex-wrap:wrap}
.nav button{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:.5rem 1.3rem;cursor:pointer;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;gap:.4rem}
.nav .go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nav .pos{font-family:var(--display);font-weight:700;min-width:7rem;text-align:center}
.pencol{display:flex;gap:6px;align-items:center}
.pencol button{width:30px;height:30px;padding:0;border-radius:50%}
.notes{max-width:1280px;margin:12px auto 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 18px}
.notes h4{margin:0 0 4px;font-family:var(--display);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted)}
.notes p{margin:0}
.overview{max-width:1280px;margin:12px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.overview button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;font-weight:700;font-size:.9rem}
.overview button.cur{border-color:var(--accent);background:var(--accent-soft)}
.overview span{font-family:var(--display);font-weight:800;color:var(--ink-muted);margin-right:6px}

/* ===== Slide base: сцена 1280×720 ===== */
.slide{position:absolute;inset:0;padding:92px 72px 56px;display:none;flex-direction:column;isolation:isolate;overflow:hidden}
.slide.on{display:flex}
.blob{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.blob .a{fill:var(--accent)} .blob .d{fill:var(--accent-deep)} .blob .s{fill:var(--accent-soft)}
.slide h2{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;margin:0 0 28px;text-transform:uppercase;letter-spacing:.01em;max-width:1080px}
.slide h3{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;margin:0 0 10px}
.slide p,.slide li{font-size:25px;line-height:1.42;margin:0 0 14px}
.slide ul,.slide ol{margin:0;padding-left:0}
.slide ul{list-style:none}
.slide ul>li{position:relative;padding-left:36px}
.slide ul>li::before{content:"";position:absolute;left:4px;top:.5em;width:16px;height:16px;border-radius:50%;background:var(--accent)}
.small{font-size:20px!important;color:var(--ink-muted)}
.mono{font-family:var(--display);font-weight:700}
b,strong{font-weight:800}

.top{position:absolute;top:28px;left:72px;right:72px;display:flex;align-items:center;gap:16px;z-index:2}
.top .sec{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.top .sec .dotc{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-size:17px}
.top .track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.top .track i{display:block;height:100%;background:var(--accent-deep);border-radius:3px}
.top .n{font:700 15px var(--display);color:var(--ink-muted)}
.top .stepdots{display:flex;gap:5px}
.top .stepdots b{width:9px;height:9px;border-radius:50%;background:var(--line)}
.top .stepdots b.in{background:var(--accent-deep)}

/* fragments: → / Пробіл / пульт */
.f{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.f.in{opacity:1;transform:none}

.split{display:grid;grid-template-columns:1fr;gap:44px;flex:1;min-height:0}
.split.has-img{grid-template-columns:1.25fr .75fr}
.split .ill{max-height:430px;object-fit:contain;justify-self:center;align-self:center;border-radius:var(--r-lg);background:var(--card);padding:14px;box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;min-height:0}
.box{background:var(--accent-soft);border-radius:var(--r-sm);padding:20px 26px}
.box.alt{background:var(--card);border:2px solid var(--accent);box-shadow:var(--shadow)}
.box p:last-child{margin-bottom:0}
.def{background:var(--card);border:2px solid var(--accent);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:20px 26px;margin:0 0 22px}
.def p{font-size:26px;margin:0}
.big{font:800 60px var(--display);text-align:center;margin:8px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{border-radius:var(--r-pill);padding:8px 18px;font-size:22px;font-weight:800;background:var(--accent-soft)}
.hl{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:0 6px}
.btn{border:2px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 18px;font-size:20px;cursor:pointer;font-weight:800;display:inline-flex;align-items:center;gap:8px}
.btn.on,.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.field{font:700 24px var(--display);padding:6px 12px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--card);color:var(--ink);width:150px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:22px;background:var(--card);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:10px 16px;text-align:center}
table.t th{background:var(--accent);color:var(--on-accent);font:700 20px var(--display)}
table.t td.l,table.t th.l{text-align:left}
tr.f{transform:none}
.yn{display:inline-block;border-radius:var(--r-pill);padding:2px 18px;font:800 20px var(--display);text-transform:uppercase;letter-spacing:.04em}
.yn.yes{background:var(--accent);color:var(--on-accent)}
.yn.no{border:2px solid var(--ink);color:var(--ink)}

/* ===== Титульний ===== */
.s-title{justify-content:center;padding-top:72px}
.s-title .top{display:none}
.s-title .co{position:absolute;left:72px;top:48px;font:800 15px var(--display);letter-spacing:.08em;text-transform:uppercase}
.s-title .txt{max-width:640px}
.s-title h2{font-size:64px;line-height:.95;margin:0 0 22px}
.s-title .lsub{font-size:28px;font-weight:700;margin:0 0 10px}
.s-title .sub{font-size:23px;color:var(--ink-muted);margin:0}
.s-title .date{display:inline-block;margin-top:30px;background:var(--ink);color:var(--surface);border-radius:var(--r-pill);padding:8px 24px;font:600 18px var(--body)}
.s-title .author{display:inline-block;margin:30px 0 0 18px;font:700 18px var(--body);color:var(--ink-muted)}
.stickers{position:absolute;right:96px;top:120px;width:440px;height:470px}
.stickers div{position:absolute;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;padding:20px;overflow:hidden}
.stickers div:nth-child(1){width:300px;height:300px;right:0;top:0}
.stickers div:nth-child(2){width:230px;height:230px;left:0;bottom:0}
.stickers img{max-height:100%;max-width:100%;object-fit:contain}

/* ===== Пригадайте / Правда-міф ===== */
.rv{display:flex;flex-direction:column;gap:13px}
.rv .item{border:2px solid var(--line);border-radius:var(--r-sm);padding:13px 22px;background:var(--card)}
.rv .q{font-size:25px;font-weight:800;line-height:1.35}
.rv .a{font-size:22px;font-weight:700;margin-top:10px;background:var(--accent-soft);border-radius:var(--r-sm);padding:8px 14px;display:flex;gap:10px;align-items:baseline}
.rv .a::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--accent-deep);transform:translateY(-1px)}
.rv.compact{gap:10px}
.rv.compact .item{padding:9px 18px;display:flex;justify-content:space-between;gap:20px;align-items:center}
.rv.compact .q{font-size:22px;font-weight:700}
.rv.compact .q{flex:1 1 50%}
.rv.compact .a{margin:0;background:none;padding:0;max-width:50%;text-align:right;flex:0 1 auto;white-space:normal;overflow-wrap:anywhere;color:var(--accent-ink);font-weight:800}
.rv.compact .a::before{display:none}

/* ===== Кроки 01. 02. ===== */
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;position:relative;padding-left:76px;min-height:44px}
.steps li::before{content:counter(s,decimal-leading-zero) ".";position:absolute;left:0;top:-2px;font:800 34px/1 var(--display);color:var(--ink)}
.answer{margin-top:auto}

/* ===== План уроку: кружечки з іконками ===== */
.cards{display:grid;gap:32px;grid-template-columns:repeat(var(--n,3),1fr);margin-top:30px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.card .e{width:120px;height:120px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:52px;margin-bottom:12px}
.card .num{font:800 20px var(--display);color:var(--ink-muted);letter-spacing:.06em}
.card img{height:110px;object-fit:contain;background:var(--card);border-radius:var(--r-lg);padding:10px;box-shadow:var(--shadow)}
.card b{font:700 24px/1.2 var(--display)}
.card span{font-size:20px;line-height:1.35;color:var(--ink-muted)}

/* ===== Сітка фото ===== */
.gg{display:grid;gap:26px;grid-template-columns:repeat(var(--n,3),1fr);margin-top:4px}
.gi{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gi .ph{background:var(--card);border-radius:var(--r-lg);width:100%;display:flex;align-items:center;justify-content:center;padding:14px;box-shadow:var(--shadow)}
.gi .ph img{max-height:100%;max-width:100%;object-fit:contain}
.gi b{font:700 21px/1.2 var(--display)}
.gi span{font-size:19px;line-height:1.3;color:var(--ink-muted)}
/* «нецифровий — цифровий» */
.vs{display:grid;grid-template-columns:220px 1fr 1fr;gap:12px 22px;align-items:center}
.vs .hd{font:800 16px var(--display);letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--ink-muted)}
.vs .hd.dg{color:var(--ink)}
.vs .rl{font:700 22px var(--display)}
.vs .c{display:flex;align-items:center;gap:16px;border-radius:var(--r-sm);padding:6px 16px;background:var(--card);border:2px solid var(--line)}
.vs .c.dg{border-color:var(--accent);box-shadow:var(--shadow)}
.vs .c img{height:84px;width:104px;object-fit:contain;border-radius:8px}
.vs .c span{font-size:22px;font-weight:700}

/* ===== Вкладки ===== */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 20px;font:700 18px var(--display);cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.tab.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tabpane{display:none;flex:1;min-height:0}
.tabpane.on{display:block}
.tabpane .vsx{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:stretch}
.tabpane .vsx>div{background:var(--card);border-radius:var(--r-lg);padding:22px;text-align:center;box-shadow:var(--shadow)}
.tabpane .vsx>div:first-child{border:2px solid var(--accent)}
.tabpane .vsx img{height:240px;object-fit:contain}
.apps{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.app{width:180px;text-align:center;font-weight:800;font-size:20px}
.app .ic{width:150px;height:150px;border-radius:30px;background:#fff;display:grid;place-items:center;margin:0 auto 10px;box-shadow:var(--shadow);padding:18px}

/* ===== Тест на дошці ===== */
.qprog{display:flex;gap:6px;margin-bottom:22px}
.qprog span{width:56px;height:8px;border-radius:4px;background:var(--line)}
.qprog span.cur{background:var(--accent-deep)}
.qq{font:700 30px/1.25 var(--display);margin-bottom:26px;max-width:1080px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:16px 20px;font-size:24px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;gap:16px;transition:opacity .25s}
.opt .l{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--accent);display:grid;place-items:center;font:800 20px var(--display)}
.opt.pick{border-color:var(--ink)}
.opt.ok{border-color:var(--accent);background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.opt.no{opacity:.4}
.qexp{font-size:22px;margin-top:22px;min-height:40px;font-weight:700;display:flex;gap:10px;align-items:center;color:var(--ink)}
.qexp .ic{color:var(--accent-deep);font-size:26px}

/* ===== Скріншот з туром ===== */
.shot{display:grid;grid-template-columns:320px 1fr;gap:28px;flex:1;min-height:0}
.hs-side{display:flex;flex-direction:column;gap:7px;min-height:0}
.hs-btn{border:2px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:4px 14px;font-size:17px;font-weight:800;cursor:pointer;text-align:left}
.hs-btn.on{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.hs-text{font-size:19px;line-height:1.35;margin-top:4px;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;min-height:64px}
.frame{position:relative;overflow:hidden;border-radius:var(--r-lg);background:#fff;align-self:start;box-shadow:var(--shadow)}
.inner{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.inner img{display:block;width:100%;height:auto;max-width:none}
.spot{position:absolute;border:4px solid var(--accent-deep);border-radius:8px;box-shadow:0 0 0 3000px rgba(15,25,23,.35);pointer-events:none;opacity:0;transition:opacity .3s}
.spot.on{opacity:1}
.dd{position:absolute;background:#fff;border:1px solid #999;box-shadow:0 6px 18px rgba(0,0,0,.3);font:13px "Segoe UI",sans-serif;color:#222;display:none;z-index:2;white-space:nowrap}
.dd div{padding:3px 10px}
.dd div:first-child{background:#CCE4F7}

/* ===== Домашнє завдання / фінал ===== */
.homegrid{display:grid;gap:28px;align-items:start}
.hw{background:var(--card);border:2px solid var(--accent);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:24px 26px;display:flex;flex-direction:column;gap:8px}
.hw .hd{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.hw .hd .dotc{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-size:24px}
.hw .hd .num{font:800 36px/1 var(--display)}
.hw h3{margin:0;font-size:22px}
.hw .main{font:800 30px/1.2 var(--display);margin:4px 0}
.slide .fin{font:800 52px/1 var(--display);text-transform:uppercase;margin:auto 0 0}
.qr{background:var(--card);border:2px solid var(--accent);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.qr .qrimg{width:270px;height:270px;background:#fff;border-radius:8px}
.qr .qrimg svg{width:100%;height:100%;display:block}
.qr b{font:700 20px var(--display);display:flex;align-items:center;gap:8px} .qr span{font-size:16px;color:var(--ink-muted)}

/* ===== Допоміжне для віджетів ===== */
.paper{background:#fff;color:#222;box-shadow:0 8px 24px -14px rgba(0,0,0,.5);position:relative;transition:all .25s}
.win{border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:#fff;height:100%;min-height:0}
.win .rib{height:44px;flex:none;background:#F3F3F3;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;padding:0 14px;font:14px "Segoe UI",sans-serif;color:#333}
.win .body{flex:1;min-height:0;overflow:auto;background:#E6E6E6;color:#222;position:relative}
.win .sb{height:26px;flex:none;background:#F0F0F0;border-top:1px solid #ddd;font:13px "Segoe UI",sans-serif;color:#555;display:flex;align-items:center;padding:0 12px;gap:12px}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px;font-weight:700}
.ctrl label{min-width:160px}
.ctrl input[type=range]{flex:1;accent-color:var(--accent-deep)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:4px 14px;font-size:18px;font-weight:800;cursor:pointer;min-width:42px}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.prev{background:var(--surface);border-radius:var(--r-lg);display:grid;place-items:center;overflow:hidden;position:relative}
.cell{width:66px;height:66px;border-radius:var(--r-sm);border:2px solid var(--line);display:grid;place-items:center;font:700 30px var(--display);cursor:pointer;background:var(--card)}
.cell.one{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.count{font:800 96px/1 var(--display);color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.bar,.nav,.notes,.overview{display:none!important}}


/* ===== Керування показом (07.10.2026) у стилі теми ===== */
:root{--pen1:#E8336F;--pen2:#1F6FD1;--pen3:var(--accent-deep);--pen4:var(--ink)}
.hud,.ovl .panel{border-radius:var(--r-lg);border:0;background:var(--card);box-shadow:var(--shadow)}
.hud{border-radius:var(--r-pill);padding:6px 10px}
.hud button{border-radius:var(--r-pill)}
.hud button.on{background:var(--accent);color:var(--on-accent)}
.thumb{border-radius:var(--r-sm);border:2px solid var(--line);background:var(--card)}
.thumb:hover,.thumb.cur{border-color:var(--accent-deep);box-shadow:0 0 0 3px var(--accent-soft)}
.tbox{border-radius:8px;background:var(--surface)}
.tbox .slide{background:var(--surface)}
.ovl .phead b{font-family:var(--display);text-transform:uppercase}
.goto{background:var(--ink);color:var(--surface);border-radius:var(--r-sm)}

/* Проєктор (07.10): другорядний текст на слайдах — жирніший, без блідо-сірого */
.stage .small,.stage .card span,.stage .gi span,.stage .s-title .sub,.stage .card .num,.stage .vs .hd,.stage .qr span{font-weight:600}
.stage .top .n{color:var(--ink)}

/* ===== Quiz на дошці: вибраний варіант (13.10.2026, на прохання вчителя) — заливка акцентом, товста рамка, позначка «Вибрано» ===== */
.slide .opt.pick{background:var(--accent-soft);border:4px solid var(--ink);box-shadow:var(--shadow);transform:translateY(-2px)}
.slide .opt.pick::after{content:"Вибрано";margin-left:auto;padding:4px 14px;border-radius:var(--r-pill);background:var(--ink);color:var(--accent);font:800 15px var(--display);letter-spacing:.06em;text-transform:uppercase}
.opt{transition:opacity .25s,background .15s,transform .15s}

/* ===== Lesson engine =====
   Lessons are data: lesson({id, grade, num, par, title, emoji, slides:[...]}).
   Every slide has a type (see T below). Anything with class "f" is a fragment,
   revealed one by one with Space / click / PageDown (→ ← switch slides).
   Widgets may return a stepper {count, step(i)} so Space/click drives them too. */
const LESSONS=[];
function lesson(d){LESSONS.push(d)}
const W={};               // widgets: W.name={html(d), mount(root,d,api)}
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const img=(k,cls,alt)=>'<img class="'+(cls||'')+'" src="'+(IMG[k]||'')+'" alt="'+(alt||'')+'">';
const fmt=(n,d=0)=>(+n).toLocaleString('uk-UA',{maximumFractionDigits:d}).replace(/\u202f|\u00a0/g,' ');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const H=d=>d.title?'<h2>'+d.title+'</h2>':'';

/* ===== Slide types ===== */
const T={
  title:d=>({cls:'s-title',html:'<div class="kicker">'+d.kicker+'</div><h2>'+d.title+'</h2>'+(d.sub?'<p class="sub">'+d.sub+'</p>':'')+
    (d.stickers?'<div class="stickers" aria-hidden="true">'+d.stickers.map(s=>'<div>'+(IMG[s]?img(s):s)+'</div>').join('')+'</div>':'')}),
  text:d=>({html:H(d)+'<div class="split'+(d.img?' has-img':'')+'"><div>'+d.body+'</div>'+(d.img?img(d.img,'ill'):'')+'</div>'}),
  reveal:d=>({html:H(d)+'<div class="split'+(d.img?' has-img':'')+'"><div class="rv'+(d.compact?' compact':'')+'">'+
    d.items.map(([q,a])=>'<div class="item"><div class="q">'+q+'</div><div class="a f">'+a+'</div></div>').join('')+'</div>'+(d.img?img(d.img,'ill'):'')+'</div>'}),
  steps:d=>({html:H(d)+(d.intro?'<p>'+d.intro+'</p>':'')+'<ol class="steps">'+d.steps.map(s=>'<li class="f">'+s+'</li>').join('')+'</ol>'+
    (d.answer?'<div class="box mint answer f"><p><b>Відповідь:</b> '+d.answer+'</p></div>':'')}),
  table:d=>({html:H(d)+(d.intro?'<p>'+d.intro+'</p>':'')+'<table class="t"><tr>'+d.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+
    d.rows.map(r=>'<tr'+(d.frag?' class="f"':'')+'>'+r.map((c,i)=>'<td'+(i===0&&d.leftFirst?' class="l"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</table>'+(d.foot?'<div style="margin-top:auto">'+d.foot+'</div>':'')}),
  cards:d=>({html:H(d)+(d.intro?'<p>'+d.intro+'</p>':'')+'<div class="cards" style="--n:'+(d.n||Math.min(d.cards.length,4))+'">'+
    d.cards.map(c=>'<div class="card'+(d.frag===false?'':' f')+'">'+(c.img?img(c.img):'<span class="e">'+(c.e||'')+'</span>')+'<b>'+c.t+'</b>'+(c.x?'<span>'+c.x+'</span>':'')+'</div>').join('')+'</div>'+(d.foot?'<div style="margin-top:auto">'+d.foot+'</div>':'')}),
  tabs:d=>({html:H(d)+'<div class="tabs">'+d.tabs.map((t,i)=>'<button class="tab" data-i="'+i+'">'+t.label+'</button>').join('')+'</div>'+
    d.tabs.map(t=>'<div class="tabpane">'+t.html+'</div>').join(''),
    mount(r,_,api){const tb=[...r.querySelectorAll('.tab')],pn=[...r.querySelectorAll('.tabpane')];
      const step=i=>{tb.forEach((t,k)=>t.classList.toggle('on',k===i));pn.forEach((p,k)=>p.classList.toggle('on',k===i))};
      tb.forEach((t,i)=>t.onclick=()=>api.setStep(i));return{count:tb.length-1,step}}}),
  quiz:d=>({html:H(d)+'<div class="qprog"></div><div class="qq"></div><div class="opts"></div><div class="qexp"></div>',
    mount(r){const P=r.querySelector('.qprog'),Q=r.querySelector('.qq'),O=r.querySelector('.opts'),E=r.querySelector('.qexp');
      const step=i=>{const qi=Math.floor(i/2),show=i%2===1,q=d.qs[qi];
        P.innerHTML=d.qs.map((_,k)=>'<span class="'+(k<=qi?'cur':'')+'"></span>').join('');
        Q.textContent=(qi+1)+'. '+q[0];O.innerHTML='';
        q[1].forEach((o,k)=>{const b=el('button','opt','<span class="l">'+'АБВГ'[k]+'</span>'+o);if(show)b.classList.add(k===q[2]?'ok':'no');b.onclick=()=>{if(!show)b.classList.toggle('pick')};O.append(b)});
        E.textContent=show?'✓ '+(q[3]||q[1][q[2]]):'Варіанти відповідей — голосуйте!';E.style.color=show?'var(--mint)':'var(--muted)'};
      return{count:d.qs.length*2-1,step}}}),
  shot:d=>({html:H(d)+'<div class="shot"></div>',mount:(r,_,api)=>shotMount(r.querySelector('.shot'),d,api)}),
  widget:d=>{const w=W[d.w];return{html:H(d)+(d.intro?'<p>'+d.intro+'</p>':'')+'<div class="wbox" style="flex:1;min-height:0;display:flex;flex-direction:column">'+w.html(d)+'</div>',mount:(r,_,api)=>w.mount(r.querySelector('.wbox'),d,api)}},
  home:d=>{const qr=(typeof QR!=='undefined'&&QR[d.lessonId])||'';const n=d.items.length;
    return{html:'<h2>Домашнє завдання</h2><div class="cols" style="align-items:start;flex:none;grid-template-columns:repeat('+n+',1fr)'+(qr?' 330px':d.img?' 260px':'')+'">'+
    d.items.map((it,i)=>'<div class="box '+['pink','mint','sky'][i%3]+'"><h3>'+it[0]+'</h3><p style="font-size:30px;font-weight:800">'+it[1]+'</p>'+(it[2]?'<p class="small">'+it[2]+'</p>':'')+'</div>').join('')+
    (qr?'<div class="qr"><div class="qrimg">'+qr+'</div><b>📝 Тест до уроку</b><span>Скануйте камерою телефона</span></div>':d.img?img(d.img):'')+
    '</div><p style="font-family:var(--display);font-weight:800;font-size:40px;margin:auto 0 0">Успіхів у навчанні!</p>'}}
};

/* ===== Screenshot tour: → walks hotspots, lupa zooms in ===== */
function shotMount(box,d,api){
  const side=el('div','hs-side'),txt=el('div','hs-text',d.intro||'Пробіл або клік — далі, або оберіть пункт списку.');
  const btns=d.spots.map((s,i)=>{const b=el('button','hs-btn',s.l);b.onclick=()=>api.setStep(i+1);side.append(b);return b});
  const lupa=el('button','btn on',typeof SHOT_LUPA!=='undefined'?SHOT_LUPA:'🔍 Лупа');lupa.style.cssText='font-size:17px;margin-top:6px;align-self:start;padding:6px 14px';side.append(txt,lupa);
  const frame=el('div','frame'),inner=el('div','inner'),im=el('img'),spot=el('div','spot');inner.append(im,spot);frame.append(inner);box.append(side,frame);
  let dd=null,cur=0,zoom=true;const MW=d.w||790,MH=d.h||520;
  function layout(){const ar=(im.naturalHeight/im.naturalWidth)||.58;let w=MW,h=w*ar;if(h>MH){h=MH;w=h/ar}frame.style.width=w+'px';frame.style.height=h+'px';inner.style.width=w+'px';return[w,h]}
  function show(){const s=cur?d.spots[cur-1]:null;const [w,h]=layout();if(dd)dd.style.display='none';
    btns.forEach((b,k)=>b.classList.toggle('on',k===cur-1));txt.innerHTML=s?s.t:(d.intro||'Пробіл або клік — далі, або оберіть пункт списку.');
    if(s&&s.r){const [x,y,rw,rh]=s.r;spot.style.cssText='left:'+x+'%;top:'+y+'%;width:'+rw+'%;height:'+rh+'%';spot.classList.add('on');
      let k=1,tx=0,ty=0;if(zoom){k=Math.max(1,Math.min(3,Math.min(.5/(rw/100),.5/(rh/100))));const cx=(x+rw/2)/100*w,cy=(y+rh/2)/100*h;tx=Math.min(0,Math.max(w-k*w,w/2-k*cx));ty=Math.min(0,Math.max(h-k*h,h/2-k*cy))}
      inner.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';spot.style.borderWidth=(3/k)+'px'}
    else{spot.classList.remove('on');inner.style.transform='none'}
    if(s&&s.dd){if(!dd){dd=el('div','dd',s.dd.map(t=>'<div>'+t+'</div>').join(''));inner.append(dd)}dd.style.left=(s.r[0]+18)+'%';dd.style.top=(s.r[1]+s.r[3])+'%';dd.style.display='block'}}
  function step(i){cur=i;const key=(cur?d.spots[cur-1].img:null)||d.img;if(im.dataset.k!==key){im.dataset.k=key;im.onload=show;im.src=IMG[key]}else show()}
  lupa.onclick=()=>{zoom=!zoom;lupa.classList.toggle('on',zoom);show()};
  return{count:d.spots.length,step}}

   '</div>'+
   '<div class="notes" id="notes" hidden><h4>Нотатки вчителя</h4><p id="noteText"></p></div></main>';
  const stage=$('stage');S=[];INK={};
  L.slides.forEach((d,i)=>{d.lessonId=L.id;const r=T[d.type](d);const s=el('section','slide '+(r.cls||''));s.innerHTML=r.html;
    const top=el('div','top','<span class="sec">'+(d.sec||'')+'</span><span class="track"><i style="width:'+((i+1)/L.slides.length*100)+'%"></i></span><span class="stepdots"></span><span class="n">'+(i+1)+'/'+L.slides.length+'</span>');top.setAttribute('aria-hidden','true');s.prepend(top);stage.append(s);
    s.querySelectorAll('img[data-img]').forEach(m=>m.src=IMG[m.dataset.img]);
    const api={setStep:k=>{if(cur===i){S[i].i=k;applyStep(i)}}};
    let st=r.mount?r.mount(s,d,api):null;
    if(!st){const fr=[...s.querySelectorAll('.f')];st={count:fr.length,step:k=>fr.forEach((f,j)=>f.classList.toggle('in',j<k))}}
    S.push({el:s,count:st.count,step:st.step,i:0,d,inited:false})});
  $('homeBtn').onclick=()=>location.hash='#';
  $('lsel').onchange=e=>{e.target.blur();location.hash='#/'+e.target.value};
  $('notesBtn').onclick=()=>toggle('notes');$('gridBtn').onclick=()=>openOv();$('penBtn').onclick=()=>pen(!penOn);$('helpBtn').onclick=()=>showHelp(true);
  $('vp').querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();ACT[b.dataset.a]()});
  $('hpal').querySelectorAll('[data-c]').forEach(b=>b.onclick=e=>{e.stopPropagation();penTool.c=+b.dataset.c;penTool.marker=false;pen(true)});
  $('vp').addEventListener('click',slideClick);

  bindHud();new ResizeObserver(fit).observe($('vp'));document.addEventListener('fullscreenchange',()=>{fit();hudShow()});initPen();bindTheme();fit()}

const ACT={prevSlide:()=>prevSlide(),stepBack:()=>stepBack(),stepFwd:()=>stepFwd(),nextSlide:()=>nextSlide(),
  pen:()=>pen(!penOn),marker:()=>{penTool.marker=!penTool.marker;pen(true)},undo:()=>undoPen(),clear:()=>clearPen(),
  ov:()=>openOv(),ovClose:()=>closeOv(),blank:()=>blank('black'),help:()=>showHelp(true),helpClose:()=>showHelp(false),fs:()=>fullscreen()};

function toggle(id,force){const e=$(id),on=force!==undefined?force:e.hidden;e.hidden=!on;const b={notes:'notesBtn'}[id];if(b)$(b).setAttribute('aria-pressed',on)}
function applyStep(i){const s=S[i];s.step(s.i);s.inited=true;const dots=s.el.querySelector('.stepdots');dots.innerHTML=s.count>0?Array.from({length:s.count},(_,k)=>'<b class="'+(k<s.i?'in':'')+'"></b>').join(''):'';if(i===cur)updPos()}
function updPos(){const s=S[cur];if(!s)return;const t=(cur+1)+' / '+S.length;
  $('hpos').textContent=t+(s.count?' · '+s.i+'/'+s.count:'')}
function go(i,stepAt,replace){cur=i;S.forEach((s,k)=>s.el.classList.toggle('on',k===i));const s=S[i];s.i=stepAt==='end'?s.count:(stepAt||0);applyStep(i);
  $('noteText').textContent=s.d.note||'—';redrawPen();if(!$('ovl').hidden)markOv();
  const h='#/'+L.id+'/'+(i+1);if(location.hash!==h)history.replaceState(null,'',h)}
/* Кроки (анімація): пробіл, клік, PgDn / PgUp. Слайди: стрілки. */
function stepFwd(){const s=S[cur];if(s.i<s.count){s.i++;applyStep(cur)}else if(cur<S.length-1)go(cur+1,0)}
function stepBack(){const s=S[cur];if(s.i>0){s.i--;applyStep(cur)}else if(cur>0)go(cur-1,'end')}
function nextSlide(){if(cur<S.length-1)go(cur+1,0)}
function prevSlide(){if(cur>0)go(cur-1,'end')}
const fwd=stepFwd,back=stepBack;   // старі назви (qa.py, відео)
let FX={k:1,x:0,y:0};
function fit(){const vp=$('vp');if(!vp)return;const w=vp.clientWidth,h=vp.clientHeight;const k=Math.min(w/1280,h/720);FX={k,x:(w-1280*k)/2,y:(h-720*k)/2};
  $('stage').style.transform='translate('+FX.x+'px,'+FX.y+'px) scale('+k+')';const c=$('pen');c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;c.style.width=w+'px';c.style.height=h+'px';redrawPen()}
function fullscreen(on){const vp=$('vp');const want=on===undefined?!document.fullscreenElement:on;
  if(!want&&document.fullscreenElement)document.exitFullscreen();else if(want&&!document.fullscreenElement&&vp.requestFullscreen)vp.requestFullscreen().catch(()=>{})}
function blank(kind){const b=$('blank');const on=!(b.classList.contains('on')&&b.dataset.k===kind);b.dataset.k=kind;b.classList.toggle('on',on);b.classList.toggle('white',on&&kind==='white')}

/* Клік по слайду = наступний крок (кнопки, вкладки, поля, віджети й скріншоти працюють як раніше) */
const NOCLICK='button,a,input,select,textarea,label,summary,[contenteditable],.wbox,.shot,.tabs,.opts,.opt,.cell,.seg,.sw,.frame,.qr,.hud,.ovl,.goto';
function slideClick(e){if(penOn||e.button!==0)return;const t=e.target;
  if(t.closest('#blank')){$('blank').classList.remove('on','white');return}
  if(t.closest(NOCLICK))return;if(String(getSelection&&getSelection()||''))return;stepFwd()}

/* Панель керування всередині показу: видно й на весь екран; ховається, коли мишка не рухається */
let hudT=0;
function hudShow(){const h=$('hud');if(!h)return;h.classList.add('show');$('vp').classList.remove('idle');clearTimeout(hudT);
  hudT=setTimeout(()=>{if(!penOn&&!h.matches(':hover')){h.classList.remove('show');if(document.fullscreenElement)$('vp').classList.add('idle')}},2500)}
function bindHud(){const vp=$('vp');vp.addEventListener('mousemove',hudShow);vp.addEventListener('mouseleave',()=>{if(!penOn)$('hud').classList.remove('show')})}

/* Огляд усіх слайдів — у вікні поверх показу */
function openOv(){const g=$('ovg');g.innerHTML='';
  S.forEach((s,i)=>{if(!s.inited){try{s.step(0)}catch(e){}s.inited=true}
    const b=el('button','thumb');const box=el('div','tbox');const c=s.el.cloneNode(true);c.classList.add('on');c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));c.removeAttribute('id');
    box.append(c);b.append(box,el('span','tn','<b>'+(i+1)+'</b> '+String(s.d.title||s.d.kicker||(s.d.type==='home'?'Домашнє завдання':'')).replace(/<[^>]+>/g,' ')));
    b.onclick=e=>{e.stopPropagation();closeOv();go(i,0)};g.append(b)});
  $('ovl').hidden=false;const t=g.querySelector('.tbox');if(t)g.style.setProperty('--tk',t.clientWidth/1280);markOv(true)}
function markOv(scroll){[...$('ovg').children].forEach((c,k)=>c.classList.toggle('cur',k===cur));const c=$('ovg').children[cur];if(scroll&&c)c.scrollIntoView({block:'center'})}
function closeOv(){$('ovl').hidden=true;$('ovg').innerHTML=''}
function showHelp(on){$('help').hidden=!on}

/* Олівець: малюнок зберігається окремо для кожного слайда в координатах сцени 1280×720 */
let penOn=false,INK={},drawing=null;const penTool={c:0,marker:false};
const PENC=['--pink','--sky','--mint','--ink'],PENF=['#E8336F','#1F8EF1','#0C9B70','#1E1B4B'];
const penColor=i=>{const cs=getComputedStyle(document.documentElement);return cs.getPropertyValue('--pen'+(i+1)).trim()||cs.getPropertyValue(PENC[i]).trim()||PENF[i]};
function pen(on){penOn=on;$('pen').classList.toggle('on',on);$('penBtn').setAttribute('aria-pressed',on);
  const h=$('hud');h.classList.toggle('inking',on);h.querySelector('[data-a="pen"]').classList.toggle('on',on);h.querySelector('[data-a="marker"]').classList.toggle('on',on&&penTool.marker);
  $('hpal').querySelectorAll('[data-c]').forEach((b,k)=>{b.style.background=penColor(k);b.classList.toggle('on',k===penTool.c)});hudShow()}
function drawStroke(x,s){const r=devicePixelRatio,P=p=>[(p[0]*FX.k+FX.x)*r,(p[1]*FX.k+FX.y)*r];
  x.globalAlpha=s.a;x.strokeStyle=s.c;x.lineWidth=s.w*FX.k*r;x.lineCap='round';x.lineJoin='round';x.beginPath();
  const a=P(s.pts[0]);x.moveTo(a[0],a[1]);if(s.pts.length===1)x.lineTo(a[0]+.1,a[1]);s.pts.forEach(p=>{const q=P(p);x.lineTo(q[0],q[1])});x.stroke();x.globalAlpha=1}
function redrawPen(){const c=$('pen');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);(INK[cur]||[]).forEach(s=>drawStroke(x,s))}
function clearPen(){INK[cur]=[];redrawPen()}
function undoPen(){(INK[cur]||[]).pop();redrawPen()}
function initPen(){const c=$('pen');let raf=0;
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left-FX.x)/FX.k,(e.clientY-r.top-FX.y)/FX.k]};
  c.onpointerdown=e=>{if(!penOn)return;e.preventDefault();c.setPointerCapture(e.pointerId);
    drawing={c:penColor(penTool.c),a:penTool.marker?.35:1,w:penTool.marker?22:4,pts:[pt(e)]};(INK[cur]=INK[cur]||[]).push(drawing);redrawPen()};
  c.onpointermove=e=>{if(!drawing)return;drawing.pts.push(pt(e));if(!raf)raf=requestAnimationFrame(()=>{raf=0;redrawPen()})};
  c.onpointerup=c.onpointercancel=()=>{drawing=null}}

function bindTheme(){$('themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){};if(L)pen(penOn)}}
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}

/* Перехід на слайд за номером: цифри + Enter */
let gotoBuf='',gotoT=0;
function gotoKey(d){gotoBuf=(gotoBuf+d).slice(-3);const g=$('goto');g.hidden=false;g.textContent='→ слайд '+gotoBuf;clearTimeout(gotoT);gotoT=setTimeout(()=>{gotoBuf='';g.hidden=true},2500)}
function gotoDo(){const n=+gotoBuf;gotoBuf='';$('goto').hidden=true;if(n>=1&&n<=S.length)go(n-1,0)}

document.addEventListener('keydown',e=>{if(!L)return;const k=e.key,a=document.activeElement,tag=(a&&a.tagName)||'';
  const typing=/INPUT|TEXTAREA/.test(tag)||(a&&a.isContentEditable);
  if(e.ctrlKey&&(k==='z'||k==='я')){if(!typing){e.preventDefault();undoPen()}return}
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  // пульт (PgDn/PgUp) гортає завжди, навіть коли курсор у полі віджета
  if(k==='PageDown'||k==='PageUp'){e.preventDefault();if(typing||tag==='SELECT')a.blur();k==='PageDown'?stepFwd():stepBack();return}
  if(typing){if(k==='Escape')a.blur();return}
  if(tag==='SELECT'){if(['ArrowLeft','ArrowRight','Escape',' '].includes(k)){e.preventDefault();a.blur()}else return}
  if(/^[0-9]$/.test(k)){gotoKey(k);return}
  if(k==='Enter'){if(gotoBuf){e.preventDefault();gotoDo()}else if(tag!=='BUTTON'&&tag!=='A'){e.preventDefault();stepFwd()}return}
  if(k==='Escape'){if(!$('help').hidden)showHelp(false);else if(!$('ovl').hidden)closeOv();else if($('blank').classList.contains('on'))$('blank').classList.remove('on','white');else if(penOn)pen(false);return}
  if(k==='ArrowRight'){e.preventDefault();nextSlide()}
  else if(k==='ArrowLeft'){e.preventDefault();prevSlide()}
  else if(k===' '){e.preventDefault();e.shiftKey?stepBack():stepFwd()}
  else if(k==='Backspace'){e.preventDefault();stepBack()}
  else if(k==='F5'){e.preventDefault();if(!e.shiftKey)go(0,0);fullscreen(true)}
  else if(k==='f'||k==='а'){fullscreen()}
  else if(k==='p'||k==='з'){pen(!penOn)}
  else if(k==='c'||k==='с'){clearPen()}
  else if(k==='z'||k==='я'){undoPen()}
  else if(k==='b'||k==='и'||k==='.'||k==='ю'){blank('black')}
  else if(k==='w'||k==='ц'||k===','||k==='б'){blank('white')}
  else if(k==='n'||k==='т'){toggle('notes')}
  else if(k==='g'||k==='п'){$('ovl').hidden?openOv():closeOv()}
  else if(k==='?'||k==='h'||k==='р'){showHelp($('help').hidden)}
  else if(k==='Home'){e.preventDefault();go(0,0)}else if(k==='End'){e.preventDefault();go(S.length-1,0)}});
// пробіл не «натискає» кнопку, на якій лишився фокус після кліку мишкою
document.addEventListener('keyup',e=>{if(L&&e.key===' '&&/BUTTON|A/.test((document.activeElement||{}).tagName||''))e.preventDefault()});
document.addEventListener('pointerup',e=>{if(!L)return;const b=e.target.closest&&e.target.closest('#deck button,.bar button');if(b)setTimeout(()=>b.blur(),0)});

/* API для вікна вчителя, перевірок і відео */
window.deck={get state(){return{lesson:L&&L.id,slide:cur,step:S[cur]?S[cur].i:0,steps:S[cur]?S[cur].count:0,total:S.length}},
  go:(i,k)=>go(i,k),next:()=>stepFwd(),prev:()=>stepBack(),nextSlide:()=>nextSlide(),prevSlide:()=>prevSlide()};
