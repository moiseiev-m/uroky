: "", "body": [{"k": "cols", "items": [{"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "\u003cb>ВНУТРІШНЯ ПАМ’ЯТЬ\u003c/b>"}, {"k": "list", "items": ["\u003cb>Оперативна\u003c/b> пам’ять", "\u003cb>Постійна\u003c/b> пам’ять", "\u003cb>Кеш-пам’ять\u003c/b>"]}], "f": true}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb>ЗОВНІШНЯ ПАМ’ЯТЬ\u003c/b>"}, {"k": "list", "items": ["Пам’ять на \u003cb>магнітних дисках\u003c/b>", "\u003cb>Флеш-пам’ять\u003c/b>", "Інші (оптичні диски тощо)"]}], "f": true}]}]}, {"type": "text", "sec": "🧠 Внутрішня", "title": "Внутрішня пам’ять і материнська плата", "note": "", "img": "a810_mb2", "body": [{"k": "p", "text": "\u003cb>Внутрішня пам’ять\u003c/b> забезпечує роботу процесора. Як і процесор, вона розміщується на материнській платі."}, {"k": "def", "text": "\u003cb>Материнська\u003c/b> (англ. \u003cb class=\"mono\">motherboard\u003c/b>), або \u003cb>системна плата\u003c/b> — основна складова ПК, яка забезпечує передавання даних між пристроями комп’ютера.", "f": true}]}, {"type": "shot", "sec": "🧠 Внутрішня", "title": "Що розміщено на материнській платі", "note": "", "img": "a810_mb", "intro": "Пробіл або клік — далі: роздивимося плату з лупою.", "spots": [{"l": "1. Роз’єми введення й виведення", "r": [36, 2, 62, 12], "t": "Сюди під’єднують клавіатуру, мишу, монітор, колонки, мережу й флешки."}, {"l": "2. Процесор", "r": [50, 39, 30, 23], "t": "Процесор встановлюють у це гніздо — сокет — і притискають важелем."}, {"l": "3. Оперативна пам’ять", "r": [35, 71, 60, 17], "t": "Планки з мікросхемами вставляють у довгі роз’єми — слоти. Тут їх чотири."}, {"l": "4. Постійна пам’ять", "r": [9, 91, 10, 9], "t": "Дві крихітні мікросхеми — основна й запасна — зберігають програми запуску."}]}, {"type": "text", "sec": "🧠 Внутрішня", "title": "Оперативна пам’ять", "note": "", "img": "a810_ram", "body": [{"k": "def", "text": "\u003cb>Оперативна пам’ять\u003c/b> — основна пам’ять комп’ютера: у ній розміщуються програми й дані, х мікросхемах називають \u003cb>флеш-пам’яттю\u003c/b>:", "cards": [{"img": "a810_ssd", "t": "SSD-накопичувач", "x": "Твердотілий пристрій (англ. Solid-State Drive) — основний диск ноутбуків і багатьох ПК."}, {"img": "a810_flash", "t": "USB-флешнакопичувач", "x": "«Флешка» — для перенесення даних між комп’ютерами."}, {"img": "a810_msd", "t": "Флешкарта", "x": "Карта пам’яті для смартфонів, фото- і відеокамер."}]}, {"type": "text", "sec": "🗄 Зовнішня", "title": "SSD-накопичувачі", "note": "", "img": "a810_ssd2", "body": [{"k": "p", "text": "\u003cb>SSD-накопичувач\u003c/b> має те саме призначення, що й жорсткий диск (НЖМД), — основна зовнішня пам’ять."}, {"k": "list", "items": ["Ставлять у \u003cb>ноутбуки\u003c/b> й \u003cb>планшети\u003c/b>, а тепер і в настільні ПК — як \u003cb>системний\u003c/b> диск.", "Порівняно з НЖМД: \u003cb>швидший\u003c/b> обмін даними, але \u003cb>дорожчий\u003c/b> за тієї самої ємності."]}]}, {"type": "shot", "sec": "🗄 Зовнішня", "title": "Будова накопичувача на жорстких дисках", "note": "", "img": "a810_hdd", "intro": "Пробіл або клік — далі: роздивимося жорсткий диск усередині.", "spots": [{"l": "1. Поверхня жорсткого диска", "r": [40, 8, 42, 52], "t": "Металевий диск, покритий шаром магнітної речовини. Дисків може бути кілька."}, {"l": "2. Вісь обертання", "r": [50, 23, 16, 18], "t": "Двигун обертає диски зі швидкістю тисячі обертів за хвилину."}, {"l": "3. Електромагнітна головка", "r": [42, 38, 24, 16], "t": "На кінці важеля: записує дані, намагнічуючи ділянки диска, і зчитує їх."}, {"l": "4. Роз’єми", "r": [6, 70, 50, 24], "t": "Через них диск під’єднують до материнської плати й живлення."}]}, {"type": "table", "sec": "🗄 Зовнішня", "title": "Властивості жорстких дисків", "bit": "15 000 обертів за хвилину!", "note": "", "head": ["Властивість НЖМД", "Настільні ПК", "Ноутбуки"], "rows": [["Ємність", "2–28 ТБ", "0,5–5 ТБ"], ["Діаметр дисків", "3,5 дюйма", "2,5 дюйма"], ["Швидкість обертання", "5400–15 000 об/хв", "5400–7200 об/хв"]], "frag": true, "leftFirst": true}, {"type": "text", "sec": "🗄 Зовнішня", "title": "Два диски в одному комп’ютері", "note": "", "body": [{"k": "p", "text": "Щоб прискорити роботу, багато ПК мають \u003cb>два\u003c/b> пристрої зовнішньої пам’яті:"}, {"k": "cols", "items": [{"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "\u003cb>Швидкий SSD\u003c/b> — для операційної системи і програм, які використовують найчастіше."}], "f": true}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb>Повільніший HDD\u003c/b> — для потрібної ємності: фото, відео, ігри, архіви."}], "f": true}], "f": true}]}, {"type": "text", "sec": "🗄 Зовнішня", "title": "Зовнішні накопичувачі", "note": "", "img": "a810_ext", "body": [{"k": "p", "text": "\u003cb>Зовнішні накопичувачі\u003c/b> на жорстких дисках або SSD використовують для:"}, {"k": "list", "items": ["резервних копій даних;", "зберігання великих обсягів конфіденційних даних;", "перенесення великих обсягів даних без мережі."]}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Їх під’єднують до комп’ютера через \u003cb>USB-роз’єм\u003c/b>, а не всередині корпусу."}], "f": true}]}, {"type": "tabs", "sec": "🗄 Зовнішня", "title": "Флешки і флешкарти", "note": "", "tabs": [{"label": "USB-флешнакопичувачі", "body": [{"k": "cols", "items": [{"k": "list", "items": ["Для \u003cb>обміну даними\u003c/b> між комп’ютерами.", "Роз’єми: \u003cb>USB Type-A\u003c/b>, \u003cb>USB Type-C\u003c/b>, \u003cb>Micro-USB\u003c/b>.", "Ємність: здебільшого \u003cb>4–128 ГБ\u003c/b>, буває до \u003cb>2 ТБ\u003c/b>."], "fs": 24}, {"k": "img", "img": "a810_flash", "h": 220}]}]}, {"label": "Флешкарти", "body": [{"k": "cols", "items": [{"k": "list", "items": ["Пам’ять для \u003cb>смартфонів\u003c/b>, фото- і відеокамер.", "Під’єднують у \u003cb>слот\u003c/b> свого типу.", "Найпопулярніші — \u003cb>microSD\u003c/b>: від \u003cb>4 ГБ\u003c/b> до \u003cb>1 ТБ\u003c/b>."], "fs": 24}, {"k": "img", "img": "a810_cards", "h": 220}]}]}]}, {"type": "widget", "sec": "🗄 Зовнішня", "title": "Чому Windows показує менше, ніж на коробці?", "note": "", "w": "disk", "intro": "Пробіл або клік — наступний пристрій."}, {"type": "table", "sec": "🗄 Зовнішня", "title": "Порівняємо пристрої зовнішньої пам’яті", "note": "", "head": ["Пристрій", "Ємність", "Де використовують"], "rows": [["Жорсткий диск (НЖМД, HDD)", "0,5–28 ТБ", "Настільні ПК, ноутбуки, зовнішні диски"], ["SSD-накопичувач", "0,5–4 ТБ у домашніх ПК", "Ноутбуки, планшети, системний диск ПК"], ["USB-флешка", "4–128 ГБ, до 2 ТБ", "Обмін даними між комп’ютерами"], ["Флешкарта microSD", "4 ГБ – 1 ТБ", "Смартфони, камери"]], "frag": true, "leftFirst": true}, {"type": "text", "sec": "💡 Цікаво", "title": "Цікаві факти: перший жорсткий диск", "note": "", "img": "a810_ibm", "body": [{"k": "p", "text": "У \u003cb>1956 році\u003c/b> корпорація IBM почала продавати \u003cb>IBM 350 Disk File\u003c/b> — один з перших накопичувачів на жорстких дисках."}, {"k": "list", "items": ["Обсяг — \u003cb>5 МБ\u003c/b> (як одне фото з телефона).", "\u003cb>52\u003c/b> диски діаметром \u003cb>24 дюйми\u003c/b> (61 см), 1200 об/хв.", "Маса — \u003cb>понад тонну\u003c/b>."]}]}, {"type": "text", "sec": "💡 Цікаво", "title": "Любомир Романків", "note": "", "img": "a810_rom_man", "body": [{"k": "p", "text": "\u003cb>Любомир Романків\u003c/b> (1931–2024) — американський учений українського походження, народився в \u003cb>Жовкві\u003c/b> на Львівщині."}, {"k": "p", "text": "У корпорації IBM він розробив технологію виготовлення \u003cb>головок записування й зчитування\u003c/b> для магнітних дисків.", "f": true}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "Завдяки цьому жорсткі диски стали дешевшими й \u003cb>уміщаються в корпус ПК\u003c/b>. Він — співавтор понад \u003cb>60 патентів\u003c/b>."}], "f": true}]}, {"type": "table", "sec": "💡 Цікаво", "title": "Для тих, хто хоче знати більше: оптичні диски", "note": "", "head": ["Лише зчитування", "Запис", "Запис і перезапис", "Ємність"], "rows": [["CD-ROM", "CD-R", "CD-RW", "640–800 МБ"], ["DVD-ROM", "DVD-R, DVD+R", "DVD-RW, DVD+RW", "до 9,4 ГБ"], ["BD-ROM", "BD-R", "BD-RE", "до 100 ГБ"]], "frag": true, "leftFirst": true, "intro": "Для зчитування й запису даних на оптичних дисках використовують \u003cb>промінь лазера\u003c/b>."}, {"type": "reveal", "sec": "Обговорюємо", "title": "Правда чи міф?", "bit": "Подумайте, перш ніж голосувати!", "note": "", "compact": true, "items": [["Після вимкнення дані з оперативної пам’яті зникають.", "Так — роботу треба зберігати"], ["Постійна пам’ять зберігає програми запуску ПК.", "Так — і не втрачає їх"], ["У SSD-накопичувачі обертаються диски.", "Ні — у ньому лише мікросхеми"], ["Зовнішня пам’ять завжди розміщена поза корпусом.", "Ні — HDD і SSD стоять усередині"]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді на запитання", "note": "", "two": true, "items": [["1. На які види поділяють пам’ять? Яка її основна властивість?", "Внутрішня і зовнішня. Ємність: байти, КБ, МБ, ГБ, ТБ."], ["2. Для чого оперативна і постійна пам’ять? Де вони?", "Оперативна — для програм і даних процесора, постійна — для запуску ПК. На материнській платі."], ["3. Для чого кеш-пам’ять?", "Прискорює обмін даними між оперативною пам’яттю і процесором."], ["4. Які пристрої належать до зовнішньої пам’яті?", "Жорсткі диски, SSD, USB-флешки, флешкарти."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "items": [["Чи можна залишити в ПК лише оперативну або лише постійну пам’ять?", "Ні: без постійної ПК не запуститься, а без оперативної процесору ніде працювати з даними."], ["На що схожа робота кеш-пам’яті?", "На пенал на парті: потрібне під рукою, не треба йти до шафи."], ["Які пристрої будуть головними через 5 років?", "Імовірно, SSD у ПК і флеш-пам’ять у мобільних пристроях."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Яка основна властивість усіх видів пам’яті?", "a": ["Тактова частота", "Ємність", "Розрядність", "Кількість ядер"], "ok": 1, "exp": "Ємність вимірюють у байтах, кілобайтах, мегабайтах, гігабайтах, терабайтах."}, {"q": "Що відбувається з даними в оперативній пам’яті після вимкнення комп’ютера?", "a": ["Переносяться на флешку", "Зберігаються назавжди", "Зникають", "Копіюються в постійну пам’ять"], "ok": 2, "exp": "Оперативна пам’ять зберігає дані лише поки є живлення."}, {"q": "Де зберігаються програми для початку роботи комп’ютера?", "a": ["У постійній пам’яті", "У кеш-пам’яті", "На флешкарті", "На оптичному диску"], "ok": 0, "exp": "Після ввімкнення вони копіюються з постійної пам’яті в оперативну."}, {"q": "Який пристрій зовнішньої пам’яті НЕ має рухомих частин?", "a": ["Жорсткий диск", "Привід DVD", "Накопичувач на магнітній стрічці", "SSD-накопичувач"], "ok": 3, "exp": "SSD складається з мікросхем флеш-пам’яті."}, {"q": "Для чого здебільшого використовують флешкарти microSD?", "a": ["Як пам’ять смартфонів і камер", "Як кеш-пам’ять процесора", "Як оперативну пам’ять ПК", "Для запуску комп’ютера"], "ok": 0, "exp": "Флешкарти — пам’ять смартфонів, фото- і відеокамер."}]}, {"type": "home", "sec": "Фініш", "note": "", "items": [["📖 Підручник", "§ 3.1 (с. 53–60)", "Запитання 5–7 на с. 59."], ["✍ Практична і тест", "Пам’ять мого комп’ютера", "Таблиці у Word: пам’ять ПК і порівняння пристроїв."]]}]};
