 Схожа модель \u003cb>HSL\u003c/b>: третій компонент — світлість (Lightness), близькість до білого.", "small": true, "f": true}]}, {"type": "widget", "sec": "🎨 Кольори", "title": "Колесо відтінків: модель HSV", "note": "", "w": "hsv83", "intro": "Повзунки можна рухати. Пробіл або клік — далі."}, {"type": "table", "sec": "🎨 Кольори", "title": "Один колір — три коди", "note": "", "head": ["Колір", "RGB", "CMYK", "HSV"], "rows": [["Білий", "255, 255, 255", "0, 0, 0, 0", "0°, 0, 100"], ["Чорний", "0, 0, 0", "0, 0, 0, 100", "0°, 0, 0"], ["Сірий", "122, 122, 122", "0, 0, 0, 52", "0°, 0, 48"], ["Жовтий", "255, 255, 0", "0, 0, 100, 0", "60°, 100, 100"], ["Рожевий", "255, 128, 192", "0, 50, 25, 0", "330°, 50, 100"], ["Смарагдовий", "80, 200, 120", "60, 0, 40, 22", "140°, 60, 78"]], "frag": true, "leftFirst": true}, {"type": "shot", "sec": "🎨 Кольори", "title": "Де побачити код кольору", "note": "", "img": "a83_word", "intro": "Word, Excel: Колір шрифту чи заливки → Інші кольори… Пробіл або клік — далі.", "spots": [{"l": "1. Спектр", "r": [19, 11, 18, 7], "t": "У вікні \u003cb>Кольори\u003c/b> відкриваємо вкладку \u003cb>Спектр\u003c/b>."}, {"l": "2. Вибір кольору", "r": [5, 25, 63, 34], "t": "Клацаємо потрібний колір, праворуч — повзунок \u003cb>яскравості\u003c/b>."}, {"l": "3. Колірна модель", "r": [4, 60, 64, 7], "t": "Список \u003cb>Колірна модель\u003c/b>: \u003cb>RGB\u003c/b> або \u003cb>HSL\u003c/b>."}, {"l": "4. Код кольору", "r": [4, 67, 51, 21], "t": "Три числа моделі RGB: \u003cb>Червоний\u003c/b>, \u003cb>Зелений\u003c/b>, \u003cb>Синій\u003c/b> — від 0 до 255."}, {"l": "5. Новий колір", "r": [77, 70, 16, 22], "t": "Тут видно новий колір поруч із поточним."}]}, {"type": "reveal", "sec": "🎬 Мультимедіа", "title": "Пригадайте", "note": "", "img": "a83_q2", "items": [["Які дані називають мультимедійними?", "Дані, що поєднують текст, звук, зображення, відео й анімацію."], ["Як утворюються рухомі зображення?", "Окремі кадри швидко змінюють один одного."], ["Що ви знаєте про звук і його властивості?", "Звук — це хвилі. Буває високий і низький, гучний і тихий."]]}, {"type": "text", "sec": "🎬 Мультимедіа", "title": "Кодування відео й анімації", "note": "", "img": "a83_video", "body": [{"k": "p", "text": "Відео й анімація — це набір окремих \u003cb>кадрів\u003c/b>, які змінюються з певною швидкістю."}, {"k": "list", "items": ["кодують зображення \u003cb>кожного кадру\u003c/b>;", "для плавного руху — \u003cb>24 і більше\u003c/b> кадрів за секунду;", "усі закодовані кадри зберігаються в \u003cb>одному файлі\u003c/b>."]}]}, {"type": "widget", "sec": "🎬 Мультимедіа", "title": "Скільки чисел в 1 секунді відео", "note": "", "w": "kadr83", "intro": "Пробіл або клік — далі."}, {"type": "text", "sec": "💬 Звук", "title": "Звук і його властивості", "bit": "Писк комара — висока частота!", "note": "", "body": [{"k": "p", "text": "Звук — це \u003cb>хвилі\u003c/b>, що поширюються в пружному середовищі: газі, рідині, твердому тілі."}, {"k": "cols", "items": [{"k": "p", "text": "\u003cb>Висота тону\u003c/b> — залежить від \u003cb>частоти\u003c/b> коливань: більша частота — вищий звук."}, {"k": "p", "text": "\u003cb>Гучність\u003c/b> — залежить від \u003cb>амплітуди\u003c/b> хвилі: більша амплітуда — гучніший звук."}], "f": true}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Кодування звуку — це кодування \u003cb>числами\u003c/b> значень цих властивостей."}], "f": true}]}, {"type": "widget", "sec": "💬 Звук", "title": "Як звук стає числами", "note": "", "w": "zvuk83", "intro": "Пробіл або клік — далі."}, {"type": "text", "sec": "💬 Звук", "title": "Частота і крок дискретизації", "note": "", "body": [{"k": "def", "text": "\u003cb>Частота дискретизації\u003c/b> — кількість вимірювань значень звукового сигналу за одну секунду; \u003cb>крок дискретизації\u003c/b> — інтервал часу між вимірюваннями."}, {"k": "img", "img": "a83_hvylia", "h": 200}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Голос — \u003cb>8 000\u003c/b> вимірювань за секунду, якісна музика — \u003cb>не менше 44 000\u003c/b>."}], "f": true}]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "items": [["У растровому й векторному редакторах створили однакові зображення світлофора. Код якого довший? Чому?", "Растрового: кодують колір кожного пікселя. У векторному — лише прямокутник і три круги."], ["Як довжина коду звуку залежить від частоти дискретизації?", "Що більша частота дискретизації, то більше вимірювань — і тим довший код."], ["Чому для друку використовують модель CMYK, а не RGB?", "Принтер не світить, а наносить фарби: блакитну, пурпурну, жовту й чорну."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Правда чи міф?", "note": "", "items": [["У моделі RGB кожну складову задають числом від 0 до 100.", "Міф. Від 0 до 255. Від 0 до 100 % — у CMYK."], ["Якщо R = G = B, колір білий, чорний або сірий.", "Правда."], ["Відтінок у моделі HSV задають у градусах.", "Правда. Від 0° до 360° — місце на колі кольорів."], ["Відео — це один великий малюнок.", "Міф. Це набір кадрів, і кожен закодовано окремо."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді", "note": "", "items": [["У чому полягає кодування растрового, векторного і рухомого зображення?", "Растрового — код кольору кожного пікселя; векторного — опис властивостей примітивів; рухомого — кодування кожного кадру."], ["Які властивості звуку використовують для його кодування?", "Висоту тону (частоту) і гучність (амплітуду)."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Що кодують для кожного пікселя растрового зображення?", "a": ["Колір", "Радіус", "Товщину лінії", "Стиль заливки"], "ok": 0, "exp": "Растрове зображення — це коди кольорів усіх пікселів."}, {"q": "Яку колірну модель використовують для зображень на екрані?", "a": ["CMYK", "RGB", "HSL", "ASCII"], "ok": 1, "exp": "Екран змішує червоне, зелене й синє світло."}, {"q": "Який колір має код RGB (255,
