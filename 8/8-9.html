": "внутрішня і зовнішня пам’ять"}, {"img": "a89_mon", "t": "Пристрої виведення", "x": "монітор, принтер, колонки, навушники"}], "n": 4, "h": 150}]}, {"type": "cards", "sec": "Процеси", "title": "Які процеси реалізують складові ПК", "bit": "Кожна група пристроїв відповідає за свій процес.", "note": "", "n": 3, "intro": "Кожна група пристроїв комп’ютера відповідає за один із трьох основних інформаційних процесів:", "cards": [{"img": "a89_p_send", "t": "Передавання даних", "x": "Пристрої введення подають вхідні дані до пам’яті, а пристрої виведення передають результати користувачу."}, {"img": "a89_p_store", "t": "Зберігання даних", "x": "Внутрішня пам’ять зберігає дані під час роботи, а зовнішня пам’ять — тривалий час."}, {"img": "a89_p_proc", "t": "Опрацювання даних", "x": "Процесор виконує команди програм і перетворює вхідні дані на готові результати."}]}, {"type": "steps", "sec": "Процеси", "title": "Схема реалізації інформаційних процесів у ПК", "note": "", "intro": "Простежимо шлях даних у комп’ютері:", "steps": ["\u003cb>Вхідні дані\u003c/b> надходять через \u003cb>пристрої введення даних\u003c/b> (передавання).", "З пристроїв введення дані потрапляють у \u003cb>внутрішню пам’ять\u003c/b> (зберігання).", "\u003cb>Внутрішня пам’ять\u003c/b> обмінюється даними з \u003cb>процесором\u003c/b> і \u003cb>зовнішньою пам’яттю\u003c/b>.", "Готові \u003cb>результати\u003c/b> з внутрішньої пам’яті подаються на \u003cb>пристрої виведення даних\u003c/b>."], "answer": "Внутрішня пам’ять — центральний вузол обміну даними між усіма пристроями."}, {"type": "tabs", "sec": "Процеси", "title": "Роль пристроїв у схемі обміну даними", "note": "", "tabs": [{"label": "1. Введення даних", "body": [{"k": "cols", "items": [{"k": "list", "items": ["\u003cb>Клавіатура\u003c/b> та \u003cb>миша\u003c/b> — текстові дані й команди керування.", "\u003cb>Сканер\u003c/b> і \u003cb>вебкамера\u003c/b> — графічні та відеодані.", "\u003cb>Мікрофон\u003c/b> — звукові повідомлення."], "fs": 24}, {"k": "img", "img": "a89_scan", "h": 190, "head": "Передавання вхідних даних у внутрішню пам’ять"}]}]}, {"label": "2. Пам’ять і процесор", "body": [{"k": "cols", "items": [{"k": "list", "items": ["\u003cb>Внутрішня пам’ять\u003c/b> тимчасово тримає активні програми та дані.", "\u003cb>Процесор\u003c/b> бере дані з внутрішньої пам’яті, опрацьовує їх і повертає результат.", "\u003cb>Зовнішня пам’ять\u003c/b> (SSD, HDD, флешка) зберігає файли після вимкнення ПК."], "fs": 24}, {"k": "img", "img": "a89_ram", "h": 190, "head": "Двосторонній обмін між пам’яттю та процесором"}]}]}, {"label": "3. Виведення результатів", "body": [{"k": "cols", "items": [{"k": "list", "items": ["\u003cb>Монітор\u003c/b> (екран) — відображення графічних, текстових і відеорезультатів.", "\u003cb>Принтер\u003c/b> — друк документів і зображень на папері.", "\u003cb>Колонки та навушники\u003c/b> — відтворення звукових даних."], "fs": 24}, {"k": "img", "img": "a89_prn", "h": 190, "head": "Передавання результатів користувачу"}]}]}]}, {"type": "text", "sec": "Процеси", "title": "Програмне керування та архітектура ПК", "note": "", "img": "a89_arch", "body": [{"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "Усі операції в комп’ютері, пов’язані з реалізацією інформаційних процесів, можливі \u003cb>тільки під керуванням відповідних програм\u003c/b>."}]}, {"k": "def", "text": "\u003cb>Архітектура комп’ютера\u003c/b> — це загальний опис будови комп’ютера та принципів взаємодії його складових.", "f": true}, {"k": "p", "text": "Саме узгоджена робота апаратного забезпечення (пристроїв) і програмного забезпечення робить комп’ютер універсальним виконавцем.", "small": true, "f": true}]}, {"type": "reveal", "sec": "Пристрої", "title": "Пригадайте", "note": "", "img": "a89_qcpu", "items": [["Який пристрій виконує опрацювання даних?", "Центральний процесор — головна мікросхема ПК."], ["Де зазвичай розміщується процесор?", "У системному блоці на материнській платі."], ["Які властивості процесора ви вже чули?", "Тактова частота та кількість ядер."]]}, {"type": "text", "sec": "Пристрої", "title": "Процесор — основна складова комп’ютера", "note": "", "img": "a89_ryzen", "body": [{"k": "def", "text": "\u003cb>Процесор\u003c/b> — це основна складова комп’ютера, пристрій, який забезпечує виконання комп’ютерних програм і виконує опрацювання даних."}, {"k": "p", "text": "Сучасний процесор — це мікросхема, що містить мільярди електронних елементів.", "f": true}, {"k": "chips", "items": ["виконання програм", "обчислення", "логічні операції"], "f": true}]}, {"type": "shot", "sec": "Пристрої", "title": "Зовнішній вигляд сучасного процесора", "note": "", "img": "a89_ryzen", "intro": "Пробіл або клік — далі, щоб роздивитися елементи корпусу процесора з лупою.", "spots": [{"l": "1. Кришка-теплорозподільник", "r": [21, 10, 57, 76], "t": "Металева кришка захищає кристал мікросхеми й відводить тепло до кулера."}, {"l": "2. Маркування серії", "r": [30, 33, 38, 23], "t": "На кришці зазначено виробника (AMD) та лінійку процесора (Ryzen)."}, {"l": "3. Підкладка мікросхеми", "r": [19, 22, 6, 56], "t": "Зелена багатошарова плата під кришкою з дрібними контактними елементами."}, {"l": "4. Ключі-вирізи підкладки", "r": [40, 5, 12, 9], "t": "Півкруглі вирізи на краях підкладки (вгорі й унизу) дозволяють установити процесор у сокет лише в одному правильному положенні."}]}, {"type": "text", "sec": "Пристрої", "title": "Система охолодження процесора", "note": "", "img": "a89_cooler", "body": [{"k": "p", "text": "Під час виконання мільярдів операцій за секунду процесор сильно нагрівається."}, {"k": "def", "text": "\u003cb>Кулер\u003c/b> — це пристрій системи охолодження (радіатор із вентилятором), який встановлюють безпосередньо над процесором.", "f": true}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb>Цікаво знати:\u003c/b> процесор часто називають \u003cb>CPU\u003c/b> (від англ. \u003cb class=\"mono\">Central Processing Unit\u003c/b> — модуль центрального процесора), а \u003cb>кулер\u003c/b> походить від англ. \u003cb class=\"mono\">cooler\u003c/b> — охолоджувач."}], "f": true}]}, {"type": "cards", "sec": "Пристрої", "title": "Внутрішні складові процесора", "bit": "Порівняння: керування — диригент, АЛП — музиканти.", "note": "", "n": 3, "intro": "До складу сучасного процесора входять три основні функціональні частини:", "cards": [{"img": "a89_struct", "t": "Пристрій керування", "x": "Забезпечує виконання команд комп’ютерної програми та узгоджує роботу складових."}, {"img": "a89_chip", "t": "Арифметично-логічний пристрій", "x": "Безпосередньо здійснює всі арифметичні обчислення та логічні операції над даними."}, {"img": "a89_ram", "t": "Кеш-пам’ять", "x": "Надшвидка складова внутрішньої пам’яті всередині процесора для часто вживаних даних."}], "foot": "Наявність кеш-пам’яті суттєво зменшує час очікування даних."}, {"type": "cards", "sec": "Властивості", "title": "Основні характеристики процесора", "bit": "Що вищі ці показники, то швидше працює комп’ютер!", "note": "", "n": 4, "intro": "Швидкість опрацювання даних процесором визначають чотири головні властивості:", "cards": [{"e": "⏱", "t": "Тактова частота", "x": "Визначає кількість елементарних операцій (тактів) за секунду, вимірюється в ГГц."}, {"e": "🧩", "t": "Кількість ядер", "x": "Кількість обчислювальних блоків у одному чипі, які можуть працювати паралельно."}, {"e": "📏", "t": "Розрядність", "x": "Кількість бітів даних, які процесор здатний опрацювати за один такт (64 біти)."}, {"e": "🚀", "t": "Обсяг кеш-пам’яті", "x": "Ємність швидкої внутрішньої пам’яті процесора, вимірюється в мегабайтах (МБ)."}]}, {"type": "tabs", "sec": "Властивості", "title": "Що означає кожна характеристика", "note": "", "tabs": [{"label": "Тактова частота", "body": [{"k": "def", "text": "\u003cb>Тактова частота\u003c/b> — це частота керуючих сигналів, які узгоджують роботу пристроїв процесора."}, {"k": "p", "text": "Вимірюється в \u003cb>гігагерцах (ГГц)\u003c/b>. Сучасні процесори працюють на частоті понад \u003cb>3–4 ГГц\u003c/b> (тобто понад 3–4 мільярди тактів за секунду).", "f": true}]}, {"label": "Кількість ядер", "body": [{"k": "def", "text": "\u003cb>Кількість ядер\u003c/b> — це кількість однакових за структурою процесорів, які об’єднано в один пристрій."}, {"k": "p", "text": "Багатоядерний процесор може одночасно виконувати кілька потоків команд (наприклад, \u003cb>8\u003c/b>, \u003cb>16\u003c/b> або \u003cb>24 ядра\u003c/b>).", "f": true}]}, {"label": "Розрядність", "body": [{"k": "def", "text": "\u003cb>Розрядність\u003c/b> — це кількість двійкових розрядів у коді даних, які може одночасно опрацьовувати процесор."}, {"k": "p", "text": "Вимірюється в \u003cb>бітах\u003c/b>. Сучасні процесори настільних ПК, ноутбуків і планшетів є \u003cb>64-розрядними (64 біти)\u003c/b>.", "f": true}]}]}, {"type": "table", "sec": "Властивості", "title": "Приклади значень властивостей процесора", "note": "", "head": ["Властивість процесора", "Одиниця", "Настільний ПК", "Планшетний ПК"], "rows": [["Тактова частота", "ГГц", "4,3 ГГц", "4,3 ГГц"], ["Кількість ядер", "ядер", "64 (типово 4–24)", "24 (типово 8–10)"], ["Розрядність", "біти", "64 біти", "64 біти"]], "frag": true, "leftFirst": true, "intro": "Порівняємо показники процесорів для настільного і планшетного комп’ютерів:", "foot": "У дужках зазначено типову кількість ядер у масових домашніх пристроях."}, {"type": "steps", "sec": "Властивості", "title": "Розшифрування стислого опису процесора", "note": "", "intro": "У прайс-листах і характеристиках ПК властивості процесора записують одним рядком. Розберемо приклад:", "steps": ["Запис: \u003cb>\u003cb class=\"mono\">Intel Core i9-14900KF 24C 3.2GHz 36MB LGA1700\u003c/b>\u003c/b>", "\u003cb>\u003cb class=\"mono\">Intel\u003c/b>\u003c/b> — виробник процесора; \u003cb>\u003cb class=\"mono\">Core i9-14900KF\u003c/b>\u003c/b> — тип (лінійка та модель).", "\u003cb>\u003cb class=\"mono\">24C\u003c/b>\u003c/b> (від англ. \u003cb class=\"mono\">Cores\u003c/b>) — кількість ядер: \u003cb>24 ена безпосередньо всередині процесора.", "Так — це швидка пам’ять процесора"], ["Будь-який процесор підійде до будь-якої материнської плати.", "Ні — мають збігатися сокети"]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді на запитання", "note": "", "two": true, "items": [["1. Як реалізуються інформаційні процеси у ПК?", "Через пристрої введення, внутрішню й зовнішню пам’ять, процесор і пристрої виведення."], ["2. Яке призначення і будова процесора?", "Виконує програми й опрацьовує дані; містить пристрій керування, АЛП і кеш-пам’ять."], ["3. Яка пам’ять входить до складу процесора?", "Кеш-пам’ять — надшвидка складова внутрішньої пам’яті."], ["4. Які властивості визначають швидкодію процесора?", "Тактова частота (ГГц), кількість ядер, розрядність (64 біти) та обсяг кеш-пам’яті (МБ)."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "img": "a89_soft", "items": [["Чому ПК є універсальним пристроєм?", "Змінюючи програми, на ньому опрацьовують дані різних видів."], ["Як кількість ядер впливає на швидкодію?", "Ядра паралельно виконують кілька потоків команд."], ["Навіщо звіряти сокет процесора і плати?", "Бо процесор стане лише у відповідний йому роз’єм."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Як називають загальний опис будови комп’ютера та принципів взаємодії його складових?", "a": ["Архітектура комп’ютера", "Тактова частота комп’ютера", "Розрядність системи", "Маркування процесора"], "ok": 0, "exp": "Архітектура комп’ютера визначає його загальну будову та принципи взаємодії пристроїв."}, {"q": "Яка складова процесора безпосередньо виконує арифметичні та логічні операції над даними?", "a": ["Пристрій керування", "Арифметично-логічний пристрій", "Кеш-пам’ять", "Кулер"], "ok": 1, "exp": "Арифметично-логічний пристрій (АЛП) здійснює обчислення та логічні операції."}, {"q": "У яких одиницях вимірюють тактову частоту сучасних процесорів?", "a": ["У мегабайтах (МБ)", "У бітах", "У гігагерцах (ГГц)", "У ядрах"], "ok": 2, "exp": "Тактова частота процесора вимірюється в гігагерцах (ГГц)."}, {"q": "Що означає позначення 24C у записі Intel Core i9-14900KF 24C 3.2GHz 36MB LGA1700?", "a": ["Обсяг кеш-пам’яті 24 МБ", "Кількість ядер — 24", "Розрядність 24 біти", "Модель кулера"], "ok": 1, "exp": "24C (від англ. Cores — ядра) означає, що процесор містить 24 ядра."}, {"q": "Що таке LGA1700 у характеристиках процесора?", "a": ["Кількість операцій за секунду", "Обсяг внутрішньої пам’яті", "Сокет (роз’єм для встановлення на системну плату)", "Тактова частота у мегагерцах"], "ok": 2, "exp": "LGA1700 — це сокет (гніздо) на материнській платі, куди встановлюється процесор."}]}, {"type": "home", "sec": "Фініш", "note": "", "items": [["📖 Підручник", "§ 3.1 (с. 51–53)", "Запитання 1–4 на с. 59."], ["✍ Практична і тест", "Таблиці у Word", "Дослідити характеристики ПК і порівняти 4 процесори."]]}]};
