const LESSON={"id": "8-6", "grade": 8, "num": 6, "par": "§ 2.1", "emoji": "🗂", "title": "Архівування та стиснення даних. Види стиснення даних", "section": "8-r2", "slides": [{"type": "title", "sec": "Старт", "title": "Архівування та стиснення даних", "note": "", "kicker": "Урок 6 · § 2.1 (с. 30–33)", "sub": "Види стиснення даних", "stickers": ["a86_t1", "a86_t2", "🗂"]}, {"type": "cards", "sec": "Старт", "title": "План уроку", "bit": "Сьогодні вчимося робити файли меншими!", "note": "", "n": 4, "intro": "Про що дізнаємося сьогодні на уроці:", "cards": [{"img": "a86_why", "t": "Навіщо стискати", "x": "Що таке стиснення даних"}, {"img": "a86_tel", "t": "Частіше — коротше", "x": "Від Морзе до алгоритмів"}, {"img": "a86_media", "t": "Два види стиснення", "x": "Без втрат і з втратою"}, {"img": "a86_arch", "t": "Архіви", "x": "Навіщо копіювати дані"}]}, {"type": "reveal", "sec": "Старт", "title": "Пригадайте", "note": "", "img": "a86_rem", "items": [["Як кодують текстові дані?", "Кожен символ має код з таблиці. У Windows-1251 символ — 1 байт = 8 бітів."], ["Як кодують малюнки?", "Растровий малюнок — пікселі, колір кожного пікселя — двійковий код."], ["Як кодують звук і відео?", "Звук вимірюють тисячі разів за секунду, відео — кадри й звук. Усе — числа."]]}, {"type": "cards", "sec": "📄 Стиснення", "title": "Навіщо стискати дані", "bit": "Менший файл — швидша доставка!", "note": "", "n": 3, "intro": "Носії даних усе більші, але файли ростуть ще швидше. Стискають, щоб:", "cards": [{"e": "🌐", "t": "Передавати мережею", "x": "менший файл швидше надіслати й завантажити"}, {"e": "📱", "t": "Працювати з телефона", "x": "менше пам'яті й мобільного інтернету"}, {"e": "🗄", "t": "Зберігати", "x": "на диск чи флешку вміститься більше"}]}, {"type": "text", "sec": "📄 Стиснення", "title": "Що таке стиснення даних", "note": "", "body": [{"k": "def", "text": "\u003cb>Стиснення даних\u003c/b> — процес кодування даних, який здійснюють, щоб \u003cb>зменшити розміри файлів\u003c/b>."}, {"k": "p", "text": "Стиснення закладено в багато типів файлів:", "f": true}, {"k": "grid", "items": [{"img": "a86_pic", "t": "малюнки: JPEG, PNG, TIFF"}, {"img": "a86_snd", "t": "звук: MP3, WMA"}, {"img": "a86_vid", "t": "відео: MP4, WMV, MOV, WebM"}], "n": 3, "h": 110}]}, {"type": "text", "sec": "📄 Стиснення", "title": "Азбука Морзе: частіше — коротше", "note": "", "img": "a86_tel", "body": [{"k": "p", "text": "Одне з перших застосувань стиснення — \u003cb>азбука Морзе\u003c/b> для телеграфу."}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "Що частіше літера трапляється в англійських текстах, то коротший її код: \u003cb>e\u003c/b> — одна крапка, \u003cb>t\u003c/b> — одне тире."}], "f": true}, {"k": "p", "text": "Рідкісні \u003cb>b, h, j, p, q, v, x, y, z\u003c/b> мають по 4 сигнали.", "f": true}]}, {"type": "widget", "sec": "📄 Стиснення", "title": "HELLO WORLD: ASCII чи азбука Морзе", "note": "", "w": "hello"}, {"type": "table", "sec": "🔍 Види", "title": "Два види стиснення", "bit": "Фото пробачить втрату, текст — ні!", "note": "", "head": ["Ознака", "Без втрат", "З частковою втратою"], "rows": [["Після відновлення", "дані точно як були", "дрібниці втрачено назавжди"], ["Що стискають", "тексти, числа, програми", "фото, звук, відео"], ["Приклади", "ZIP, PNG, GIF", "JPEG, MP3, MP4"]], "frag": true, "foot": "Текст з втратою стискати не можна — зміниться зміст."}, {"type": "widget", "sec": "🔍 Види", "title": "Стискаємо фото і текст", "note": "", "w": "lossy", "intro": "Пробіл або клік — сильніше стиснення."}, {"type": "reveal", "sec": "🔍 Види", "title": "Поміркуйте", "note": "", "img": "a86_warn", "items": [["Чому фото можна стискати з втратою, а текст — ні?", "Око не помітить трохи інший відтінок, а змінена цифра в ціні псує зміст."], ["Де ви помічали стиснення з втратою?", "Розмиті фото в месенджері, «квадрати» у відео при слабкому інтернеті."], ["Чому програму не можна стискати з втратою?", "Змінений біт — і програма не запуститься або працюватиме з помилками."]]}, {"type": "text", "sec": "🧩 Алгоритми", "title": "Коди різної довжини", "note": "", "body": [{"k": "p", "text": "Алгоритми \u003cb>Хаффмана\u003c/b> і \u003cb>Шеннона — Фано\u003c/b> дають частим символам короткі коди, а рідкісним — довші."}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Речення зі 106 символів у Windows-1251 займає \u003cb>106 Б\u003c/b>. З кодами різної довжини — \u003cb>≈ 48 Б\u003c/b>, більш ніж удвічі менше."}], "f": true}, {"k": "p", "text": "Що довший текст, то краще він стискається.", "f": true}]}, {"type": "widget", "sec": "🧩 Алгоритми", "title": "Стискаємо фразу «ОКО ЗА ОКО»", "note": "", "w": "chast6", "intro": "Частіше — коротше. Пробіл або клік — далі."}, {"type": "text", "sec": "🧩 Алгоритми", "title": "Стиснення повторів: RLE", "note": "", "body": [{"k": "p", "text": "\u003cb>RLE\u003c/b> (англ. Run-length encoding — кодування довжин серій) замінює ряд однакових даних описом: \u003cb>код і кількість повторів\u003c/b>."}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "48 білих пікселів підряд — це не 48 бітів, а \u003cb>0 48\u003c/b>: 1 біт на колір і по 4 біти на кожну цифру, разом \u003cb>9 бітів\u003c/b>."}], "f": true}, {"k": "p", "text": "Найкраще RLE стискає малюнки з великими одноколірними ділянками.", "f": true}]}, {"type": "widget", "sec": "🧩 Алгоритми", "title": "RLE: кодуємо малюнок рядок за рядком", "note": "", "w": "rle6", "intro": "Білий — 0, чорний — 1. Пробіл або клік — наступний рядок."}, {"type": "steps", "sec": "🧩 Алгоритми", "title": "Задача: рядок пікселів у RLE", "note": "", "intro": "Рядок з 20 пікселів: 6 білих, 8 чорних, 6 білих. Білий — 0, чорний — 1.", "steps": ["Без стиснення: 20 пікселів × 1 біт = \u003cb>20 бітів\u003c/b>.", "Код RLE: \u003cb>0 6 1 8 0 6\u003c/b>.", "Бітів: 3 коди кольору × 1 + 3 цифри × 4 = \u003cb>15 бітів\u003c/b>."], "answer": "15 бітів замість 20. А рядок «чорний, білий, чорний…» RLE тільки збільшить."}, {"type": "reveal", "sec": "🗄 Архіви", "title": "Поміркуйте", "note": "", "img": "a86_arch", "items": [["Які операції виконують працівники архіву?", "Приймають, упорядковують і зберігають документи, шукають і видають їх."], ["Навіщо?", "Щоб важливі документи не загубилися і їх можна було швидко знайти."], ["Як удосконалити їхню роботу?", "Зберігати документи в цифровому вигляді, з копіями на кількох носіях і в хмарі."]]}, {"type": "cards", "sec": "🗄 Архіви", "title": "Чому втрата даних небезпечна", "bit": "Важливе завжди має копію!", "note": "", "n": 4, "cards": [{"img": "a86_bank", "t": "Банк", "x": "зникли дані про вклади — крах банку"}, {"img": "a86_trip", "t": "Вокзал, аеропорт", "x": "немає даних про квитки — перебої з перевезеннями"}, {"img": "a86_sci", "t": "Наука", "x": "знищені результати дослідів — роки роботи марно"}, {"img": "a86_cont", "t": "Ваш телефон", "x": "зник список контактів — чимало незручностей"}]}, {"type": "text", "sec": "🗄 Архіви", "title": "Куди копіюють важливі дані", "note": "", "body": [{"k": "p", "text": "Жоден носій не гарантує збереження даних. Тому найважливіші дані \u003cb>дублюють\u003c/b>:"}, {"k": "grid", "items": [{"img": "a86_hdd", "t": "на інші носії даних"}, {"img": "a86_net", "t": "на диски в мережі, у хмару"}], "n": 2, "h": 150}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "Як Windows робить резервні копії сама — на наступному уроці."}], "f": true}]}, {"type": "text", "sec": "🗄 Архіви", "title": "Архів і архівування", "note": "", "img": "a86_pack", "body": [{"k": "p", "text": "Файли й папки копії зручно \u003cb>пакувати в один файл\u003c/b>."}, {"k": "def", "text": "\u003cb>Архів\u003c/b> — така копія даних, а файл, у який її запаковано, — \u003cb>архівний файл\u003c/b>.", "f": true}, {"k": "def", "text": "\u003cb>Архівування\u003c/b> — створення копій даних програмами, які можуть стискати дані.", "f": true}]}, {"type": "shot", "sec": "🗄 Архіви", "title": "ZIP-архів засобами Windows", "note": "", "img": "a86_ctx", "intro": "Контекстне меню виділених файлів у Windows 11. Пробіл або клік — далі.", "spots": [{"l": "1. Стиснути до…", "img": "a86_sub", "r": [1.9, 55.3, 96.2, 6.4], "t": "Підменю: \u003cb>ZIP-файл\u003c/b> — архів з’явиться в тій самій папці."}, {"l": "2. Як над папкою", "r": [0.5, 0.5, 66, 13], "t": "ZIP-архів можна копіювати, перейменовувати, видаляти, як звичайну папку."}, {"l": "3. Старе меню", "r": [1.9, 91.5, 96.2, 7.5], "t": "Тут — меню, як у Windows 10: \u003cb>Надіслати\u003c/b> → \u003cb>Стиснута ZIP-папка\u003c/b>."}]}, {"type": "steps", "sec": "🗄 Архіви", "title": "Створюємо ZIP-архів у Провіднику", "note": "", "steps": ["Відкрийте папку з файлами, які треба заархівувати.", "Виділіть файли й папки.", "Контекстне меню → \u003cb>Стиснути до…\u003c/b> → \u003cb>ZIP-файл\u003c/b>.", "Введіть ім’я архіву або залиште запропоноване, натисніть \u003cb>Enter\u003c/b>."], "answer": "Windows відкриває ZIP як звичайну папку: можна копіювати, переміщувати, видаляти файли."}, {"type": "reveal", "sec": "Обговорюємо", "title": "Правда чи міф?", "note": "", "items": [["Файл, стиснений з частковою втратою, можна відновити без змін.", "Ні, відкинуті дані втрачено назавжди."], ["Документ Word .docx — теж ZIP-архів.", "Так, усередині — текст, стилі й картинки окремими файлами, стиснені без втрат."], ["Що менший файл, то сильніше він стиснеться.", "Ні, через таблицю кодів дуже малий файл може навіть збільшитися."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "compact": true, "items": [["Чим пов’язані й чим відрізняються архівування і стиснення?", "Стиснення зменшує файл, архівування пакує копії в один файл, часто стискаючи."], ["Навіщо робити резервні копії своїх файлів?", "Щоб не втратити фото й контакти, якщо пристрій зламається чи загубиться."], ["Чому JPEG у ZIP майже не зменшується, а BMP — у десятки разів?", "JPEG уже стиснене, а в BMP — довгі ряди однакових пікселів."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді", "note": "", "items": [["Д
