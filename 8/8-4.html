u003cb>тире\u003c/b>."}, {"k": "p", "text": "З 1844 року нею передавали повідомлення \u003cb>телеграфом\u003c/b>.", "f": true}, {"k": "p", "text": "Азбуку запропонував американський художник \u003cb>Семюель Морзе\u003c/b> (1791–1872).", "small": true, "f": true}]}, {"type": "widget", "sec": "💡 Двійкове", "title": "Слово «парта» азбукою Морзе", "note": "", "w": "morse", "intro": "Складіть слово «парта» кнопками літер. Скільки сигналів вийшло?"}, {"type": "text", "sec": "💡 Двійкове", "title": "Двійкове кодування", "note": "", "img": "a84_comp", "body": [{"k": "def", "text": "\u003cb>Двійкове кодування\u003c/b> — кодування повідомлень з використанням сигналів лише \u003cb>двох видів\u003c/b>. Результат — \u003cb>двійковий код\u003c/b>."}, {"k": "p", "text": "У комп’ютері всі повідомлення кодуються електричними сигналами двох видів. Один умовно позначають \u003cb>0\u003c/b>, другий — \u003cb>1\u003c/b>.", "f": true}]}, {"type": "text", "sec": "📏 Біт і байт", "title": "Біт", "note": "", "img": "a84_cifra", "body": [{"k": "def", "text": "\u003cb>Біт\u003c/b> (англ. binary digit — двійкова цифра) — цифра \u003cb>0\u003c/b> або \u003cb>1\u003c/b> у двійковому коді повідомлення."}, {"k": "p", "text": "Поряд із числом біт позначають маленькою літерою \u003cb>б\u003c/b>: 20 біт — \u003cb>20 б\u003c/b>.", "f": true}]}, {"type": "table", "sec": "📏 Біт і байт", "title": "Чому коди мають бути однакової довжини", "note": "", "head": ["Літера", "Код Морзе", "Сигналів"], "rows": [["т", "—", "1"], ["а", "•  —", "2"], ["п", "•  —  —  •", "4"]], "frag": true, "intro": "В азбуці Морзе коди літер різної довжини:", "foot": "Між літерами телеграфіст робить паузи. Комп’ютеру простіше, коли коди \u003cb>всіх\u003c/b> символів \u003cb>однакової довжини\u003c/b>."}, {"type": "table", "sec": "📏 Біт і байт", "title": "Що можна закодувати 1, 2 і 3 бітами", "bit": "Кожен новий біт подвоює кількість кодів!", "note": "", "head": ["Бітів", "Коди", "Що можна закодувати"], "rows": [["1", "0, 1 — \u003cb>2\u003c/b> коди", "хибне — 0, істинне — 1; вимкнено — 0, увімкнено — 1"], ["2", "00, 01, 10, 11 — \u003cb>4\u003c/b> коди", "сторони горизонту: 00 — північ, 01 — схід, 10 — південь, 11 — захід"], ["3", "000 … 111 — \u003cb>8\u003c/b> кодів", "номер рядка шахівниці; 8 кольорів"]], "frag": true}, {"type": "widget", "sec": "📏 Біт і байт", "title": "Скільки кодів дають біти", "note": "", "w": "bitsN", "intro": "Пробіл або клік — додаємо ще один біт."}, {"type": "text", "sec": "📏 Біт і байт", "title": "Байт", "note": "", "body": [{"k": "img", "img": "a84_bajt", "h": 110}, {"k": "def", "text": "\u003cb>Байт\u003c/b> — послідовність із \u003cb>8 бітів\u003c/b>. Позначають великою літерою \u003cb>Б\u003c/b>.", "f": true}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "\u003cb>1 Б = 8 б\u003c/b>"}], "f": true}, {"k": "p", "text": "8 бітів дають 2⁸ = \u003cb>256\u003c/b> кодів — досить для українських і англійських літер, цифр і знаків. Стільки кодів у таблицях \u003cb>Windows-1251\u003c/b> і \u003cb>КОІ-8U\u003c/b>.", "f": true}]}, {"type": "reveal", "sec": "📏 Біт і байт", "title": "Поміркуйте", "note": "", "img": "a84_dumka", "items": [["Для чого вимірювати обсяг даних?", "Щоб знати, чи вміститься файл на флешку чи в повідомлення і скільки часу його передавати."], ["Робота яких пристроїв залежить від обсягу даних?", "Носіїв даних (флешка, диск), мережі, процесора: великий файл довше зберігати, передавати й опрацьовувати."]]}, {"type": "text", "sec": "📏 Біт і байт", "title": "Довжина двійкового коду", "note": "", "img": "a84_obsiag", "body": [{"k": "def", "text": "\u003cb>Обсяг даних\u003c/b>, або \u003cb>довжина двійкового коду\u003c/b> повідомлення, — кількість бітів у його двійковому коді. Вимірюють також у \u003cb>байтах\u003c/b>."}, {"k": "p", "text": "Знаючи довжину коду, можна розрахувати:", "f": true}, {"k": "list", "items": ["скільки повідомлень уміститься на носії даних;", "який обсяг даних передати мережею;", "скільки часу триватиме опрацювання."]}]}, {"type": "widget", "sec": "📄 Текст", "title": "Кожен символ — один байт", "note": "", "w": "textenc", "intro": "У таблиці Windows-1251 код символу — число від 0 до 255, тобто один байт. Введіть свій текст."}, {"type": "steps", "sec": "📄 Текст", "title": "Задача: довжина коду повідомлення", "note": "", "intro": "Повідомлення «Інформатика – цікавий предмет!». Яка довжина його двійкового коду в Windows-1251?", "steps": ["Лічимо \u003cb>всі\u003c/b> символи: літери, пропуски, тире і знак оклику — \u003cb>30\u003c/b>.", "У Windows-1251 кожен символ займає \u003cb>1 байт\u003c/b>."], "answer": "30 символів → \u003cb>30 Б\u003c/b> = 30 · 8 = \u003cb>240 б\u003c/b>"}, {"type": "text", "sec": "📄 Текст", "title": "Блокнот: ANSI і клавіша Enter", "note": "", "img": "a84_enter", "body": [{"k": "p", "text": "Блокнот, що зберігає текст у кодуванні \u003cb>ANSI\u003c/b>, кодує кожен символ за таблицею Windows-1251. Розмір файлу в байтах дорівнює \u003cb>кількості символів\u003c/b>."}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Кожне натискання \u003cb>Enter\u003c/b> — це \u003cb>2 символи\u003c/b>: перехід на новий рядок і на початок рядка."}], "f": true}]}, {"type": "text", "sec": "📄 Текст", "title": "Юнікод: коди різної довжини", "note": "", "img": "a84_unikod", "body": [{"k": "p", "text": "У таблиці \u003cb>Юнікод\u003c/b> (кодування \u003cb>UTF-8\u003c/b>) довжина коду символів різна — від \u003cb>1 до 4 байтів\u003c/b>:"}, {"k": "list", "items": ["латинські літери, цифри, пропуск — \u003cb>1 Б\u003c/b>;", "українські літери — \u003cb>2 Б\u003c/b>;", "емодзі — \u003cb>4 Б\u003c/b>."]}, {"k": "p", "text": "Тому український текст в UTF-8 займає майже вдвічі більше, ніж в ANSI.", "small": true, "f": true}]}, {"type": "table", "sec": "📐 Числа", "title": "Десяткова і двійкова системи числення", "bit": "Основу пишуть маленьким числом унизу праворуч.", "note": "", "head": ["Ознака", "Десяткова", "Двійкова"], "rows": [["Цифри", "від 0 до 9", "лише 0 і 1"], ["Основа", "10", "2"], ["Розряди справа наліво", "1, 10, 100, 1000…", "1, 2, 4, 8, 16…"], ["Запис з основою", "5328₁₀", "1011₂"]], "frag": true, "leftFirst": true, "intro": "Щоб закодувати число, його переводять у \u003cb>двійкову систему числення\u003c/b>."}, {"type": "steps", "sec": "📐 Числа", "title": "Як прочитати двійкове число", "note": "", "intro": "Цифри числа показують, скільки в ньому одиниць, двійок, четвірок, вісімок…", "steps": ["Як у десятковій: 5328₁₀ = 5 · 1000 + 3 · 100 + 2 · 10 + 8", "Підпишемо розряди 1011₂ справа наліво: \u003cb>1, 2, 4, 8\u003c/b>", "1011₂ = 1 · 8 + 0 · 4 + 1 · 2 + 1 · 1"], "answer": "1011₂ = 8 + 2 + 1 = \u003cb>11₁₀\u003c/b>"}, {"type": "steps", "sec": "📐 Числа", "title": "Задача: число 13 у двійковій системі", "note": "", "intro": "Подамо 13 сумою степенів двійки: 8, 4, 2, 1.", "steps": ["Найбільший степінь, що вміщується в 13, — \u003cb>8\u003c/b>. Залишок: 13 − 8 = 5.", "У 5 вміщується \u003cb>4\u003c/b>. Залишок: 5 − 4 = 1.", "\u003cb>2\u003c/b> не вміщується в 1 — цифра 0. Лишається \u003cb>1\u003c/b> — цифра 1."], "answer": "13 = 1 · 8 + 1 · 4 + 0 · 2 + 1 · 1 = \u003cb>1101₂\u003c/b>"}, {"type": "widget", "sec": "📐 Числа", "title": "Число в одному байті", "note": "", "w": "byte", "intro": "Двійковий запис доповнюють зліва нулями до 8 цифр — виходить байт числа."}, {"type": "cards", "sec": "🖼 Малюнки", "title": "Малюнки, звук і відео — теж двійковий код", "bit": "Фото, пісня і фільм — усе це нулі й одиниці!", "note": "", "n": 3, "intro": "Для опрацювання комп’ютером їх також кодують двійковими кодами:", "cards": [{"img": "a84_malunok", "t": "Малюнок", "x": "коди кольорів пікселів"}, {"img": "a84_zvuk", "t": "Звук", "x": "числові значення властивостей звуку"}, {"img": "a84_video", "t": "Відео", "x": "кадри-малюнки і звук"}]}, {"type": "text", "sec": "🖼 Малюнки", "title": "Глибина кольору", "note": "", "body": [{"k": "def", "text": "\u003cb>Глибина кольору\u003c/b> — кількість бітів, вибраних для кодування кольору одного пікселя."}, {"k": "p", "text": "У Paint її вибирають під час збереження у форматі \u003cb>BMP\u003c/b> — у списку \u003cb>Тип файлу\u003c/b>:", "f": true}, {"k": "img", "img": "a84_paint", "h": 230}]}, {"type": "table", "sec": "🖼 Малюнки", "title": "Глибина кольору в Paint", "note": "", "head": ["Тип файлу BMP", "Бітів на піксель", "Кольорів"], "rows": [["Монохромний рисунок", "1", "2¹ = 2"], ["16-колірний рисунок", "4", "2⁴ = 16"], ["256-колірний рисунок", "8", "2⁸ = 256"], ["24-розрядний рисунок", "24 = 3 Б (по 1 Б на R, G, B)", "2²⁴ — понад 16 млн"]], "frag": true}, {"type": "widget", "sec": "🖼 Малюнки", "title": "Скільки байтів у файлі BMP", "note": "", "w": "bmp", "intro": "Змінюйте ширину й висоту малюнка — розмір файлу перераховується."}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "items": [["Скільки бітів потрібно, щоб кожен із 30 учнів класу мав свій код?", "5 бітів: 2⁴ = 16 — замало, 2⁵ = 32 — досить."], ["Той самий український текст зберегли в ANSI і в UTF-8. Який файл більший? Чому?", "В UTF-8: українські літери там займають по 2 байти, а в ANSI — по 1."], ["Малюнок 10 × 10 пікселів. Скільки байтів займуть коди кольорів при глибині 24 біти? А 8 бітів?", "100 пікселів · 3 Б = 300 Б; при 8 бітах — 100 Б."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді", "note": "", "items": [["У чому полягає двійкове кодування повідомлень?", "Кодують сигналами лише двох видів: 0 і 1."], ["Що таке біт? Чому дорівнює 1 байт?", "Біт — цифра 0 або 1 у двійковому коді. 1 Б = 8 б."], ["Як обчислити довжину коду повідомлення в таблиці Windows-1251?", "Порахувати всі символи з пропусками: кожен — 1 байт."], ["Як кодують число і малюнок?", "Число — у двійковій системі; малюнок — коди кольорів пікселів."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Скільки різних кодів можна скласти з 3 бітів?", "a": ["3", "6", "8", "9"], "ok": 2, "exp": "2³ = 8: від 000 до 111."}, {"q": "1 ба
