іл або клік — далі.", "spots": [{"l": "1. Як часто", "r": [21, 27.6, 57.5, 4.2], "t": "\u003cb>Зберегти копії файлів\u003c/b> — від \u003cb>кожних 10 хвилин\u003c/b> до \u003cb>щодня\u003c/b>."}, {"l": "2. Як довго", "r": [21, 32.8, 57.5, 4.2], "t": "\u003cb>Залишати збережені версії\u003c/b> — від \u003cb>1 місяця\u003c/b> до \u003cb>Завжди\u003c/b> або \u003cb>Доки не знадобиться простір\u003c/b>."}, {"l": "3. Виключити", "img": "a87_excl", "r": [20.6, 27.8, 58.6, 42], "t": "\u003cb>Виключити папки\u003c/b> → \u003cb>Додати\u003c/b> — папки, копії яких не потрібні."}, {"l": "4. Зберегти", "r": [55.3, 94.4, 11.7, 3.8], "t": "\u003cb>Зберегти зміни\u003c/b> — інакше налаштування не запам’ятаються."}]}, {"type": "table", "sec": "🗂 Банк файлів", "title": "Як додати чи прибрати папку", "note": "", "head": ["Що зробити", "Windows 11", "Windows 10"], "rows": [["Додати папку, наприклад Foto з диска D:", "контекстне меню папки → \u003cb>Включити до бібліотеки\u003c/b> → \u003cb>Документи\u003c/b>", "\u003cb>Інші параметри\u003c/b> → \u003cb>Додати папку\u003c/b>"], ["Прибрати папку, наприклад Різне з Документів", "\u003cb>Виключити папки\u003c/b> → \u003cb>Додати\u003c/b> → папка → \u003cb>Зберегти зміни\u003c/b>", "вибрати папку в списку → \u003cb>Видалити\u003c/b>"]], "frag": true, "foot": "У Windows 11 команда «Включити до бібліотеки» — у меню \u003cb>Показати додаткові параметри\u003c/b>."}, {"type": "widget", "sec": "🗂 Банк файлів", "title": "Відновлюємо файл з копії", "note": "", "w": "versions"}, {"type": "steps", "sec": "🗂 Банк файлів", "title": "Як відновити файли", "note": "", "steps": ["\u003cb>Банк файлів\u003c/b> → \u003cb>Відновити особисті файли\u003c/b>.", "Кнопками \u003cb>Попередня версія\u003c/b> і \u003cb>Наступна версія\u003c/b> виберіть дату й час копії.", "Виділіть потрібні папки й файли.", "Зелена кнопка — \u003cb>Відновити в початковому розташуванні\u003c/b>."], "answer": "Якщо такий файл уже є, Windows спитає, замінити його чи пропустити."}, {"typ  "def", "text": "\u003cb>Контрольна точка відновлення\u003c/b> — копія (архів) \u003cb>системних налаштувань\u003c/b> на момент створення."}, {"k": "p", "text": "Windows створює точки \u003cb>сама\u003c/b> — перед інсталяцією драйверів, оновленням системи.", "f": true}, {"k": "p", "text": "Створіть точку \u003cb>й самі\u003c/b> — перед інсталяцією сумнівних програм, наданням керування комп’ютером ззовні, зміною налаштувань.", "f": true}, {"k": "box", "tone": "pink", "blocks": [{"k": "p", "text": "Файлів користувача точка \u003cb>не містить\u003c/b>."}], "f": true}]}, {"type": "widget", "sec": "🔄 Точки", "title": "Що повертає контрольна точка?", "note": "", "w": "rpoint"}, {"type": "shot", "sec": "🔄 Точки", "title": "Вкладка Захист системи", "note": "", "img": "a87_sp", "intro": "Вікно Властивості системи. Пробіл або клік — далі.", "spots": [{"l": "1. Як відкрити", "img": "a87_rc", "r": [21.5, 40, 22, 5], "t": "\u003cb>Панель керування\u003c/b> → \u003cb>Відновлення\u003c/b> → \u003cb>Настроїти відновлення системи\u003c/b>."}, {"l": "2. Диски", "r": [7.6, 53.1, 85.4, 16.6], "t": "Стовпець \u003cb>Захист\u003c/b>: увімкнуто чи вимкнуто для кожного диска. Тут вимкнуто, тож кнопки неактивні."}, {"l": "3. Увімкнути", "img": "a87_spc", "r": [4.6, 20.9, 40.1, 11.7], "t": "\u003cb>Настроїти…\u003c/b> → \u003cb>Увімкнути захист системи\u003c/b>. Вимкнете — усі точки видаляться."}, {"l": "4. Місце", "img": "a87_spc", "r": [3.2, 63.9, 93.3, 14.7], "t": "\u003cb>Максимальне використання\u003c/b> — місце на диску для точок. Забракне — старі точки видаляються."}, {"l": "5. Видалити", "img": "a87_spc", "r": [78.8, 79.8, 19, 7], "t": "\u003cb>Видалити\u003c/b> — стерти всі точки цього диска."}, {"l": "6. Створити", "r": [67.8, 82.3, 25.2, 4.4], "t": "\u003cb>Створити…\u003c/b> — нова точка вручну."}]}, {"type": "steps", "sec": "🔄 Точки", "title": "Створюємо контрольну точку", "note": "", "steps": ["\u003cb>Захист системи\u003c/b> → \u003cb>Створити…\u003c/b>", "Введіть опис, наприк ows попереджає про це."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "items": [["Навіщо користувач створює резервні копії своїх файлів?", "Щоб відновити їх після поломки диска, вірусу чи помилкового видалення."], ["Чи є у вас потреба робити копії своїх файлів?", "Так: фото, проєкти, домашні роботи не відновиш, якщо загубиться телефон."], ["Як перевірити, чи увімкнено захист системи для диска C:?", "На вкладці Захист системи — стовпець «Захист» біля диска C:"]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді", "note": "", "compact": true, "items": [["Які засоби резервного копіювання має Windows?", "Банк файлів, Служба Windows для резервного копіювання, контрольні точки."], ["Як створити контрольну точку відновлення?", "Захист системи → Створити… → опис → Створити."], ["Як уключити до копії папку Foto з диска D:?", "Включити її до бібліотеки (у Windows 10 — Додати папку)."], ["Як виключити з копії папку Різне з Документів?", "Виключити папки → Додати → Різне → Зберегти зміни."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Де у Windows 11 вмикають Банк файлів?", "a": ["Панель керування → Банк файлів", "Провідник → Вигляд", "Paint → Файл → Властивості", "Пуск → Калькулятор"], "ok": 0, "exp": "У Windows 11 Банк файлів — лише в Панелі керування."}, {"q": "Куди Банк файлів записує копії?", "a": ["у Кошик", "на флешку, зовнішній диск чи мережеву папку", "в оперативну пам’ять", "в архів ZIP на диску C:"], "ok": 1, "exp": "Лише на інший диск — щоб копія не пропала разом з оригіналом."}, {"q": "Як часто Банк файлів зберігає копії за замовчуванням?", "a": ["кожні 10 хвилин", "щогодини", "щодня", "раз на місяць"], "ok": 1, "exp": "Щогодини; можна змінити від 10 хвилин до щодня."}, {"q": "Що містить контрольна точка відновлення?", "a": ["копії фото й документів", "системні налаштування на момент створення", "усі завантажені фільми", "листування в месенджерах"],
