, "Пошук, словники, тести, відеоуроки, доповнена реальність, вимірювання датчиками."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "До якого виду ПК належить планшет?", "a": ["Стаціонарні", "Мобільні", "Вбудовані", "Сервери"], "ok": 1, "exp": "Планшет — мобільний (портативний) персональний комп’ютер."}, {"q": "Який комп’ютер рахує прогноз погоди на тижні вперед?", "a": ["Ноутбук", "Смартфон", "Суперкомп’ютер", "Вбудований"], "ok": 2, "exp": "Для великих обсягів складних обчислень — суперкомп’ютери."}, {"q": "У чому вимірюють продуктивність суперкомп’ютерів?", "a": ["У гігабайтах", "У флопсах", "У дюймах", "У пікселях"], "ok": 1, "exp": "FLOPS — кількість операцій з дробовими числами за секунду."}, {"q": "Що робить сервер?", "a": ["Надає послуги користувачам мережі", "Керує пральною машиною", "Друкує документи", "Лише грає музику"], "ok": 0, "exp": "Пошта, сайти, зберігання даних, захист мережі."}, {"q": "Де працює вбудований комп’ютер?", "a": ["У шафі серверної", "У холодильнику", "На столі в офісі", "У залі суперкомп’ютера"], "ok": 1, "exp": "Вбудовані комп’ютери керують побутовою технікою, авто, роботами."}]}, {"type": "home", "sec": "Фініш", "note": "", "items": [["📖 Підручник", "§ 3.4 (с. 79–85)", "Запитання 1–4 і 6 на с. 89."], ["✍ Практична і тест", "Види й застосування комп’ютерів", "Схема і таблиці у Word."]]}]};
