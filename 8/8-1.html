": "a81_write", "t": "Зберігання", "x": "Усну мову записують літерами"}, {"img": "a81_phone", "t": "Передавання", "x": "Голос у телефоні стає радіохвилями"}, {"img": "a81_math", "t": "Опрацювання", "x": "Числа — цифрами, дії — знаками"}, {"img": "a81_secret", "t": "Захист", "x": "Літери замінюють іншими знаками"}]}, {"type": "text", "sec": "📝 Кодування", "title": "Кодування повідомлення", "note": "", "img": "a81_bin", "body": [{"k": "def", "text": "\u003cb>Кодування\u003c/b> — заміна однієї послідовності сигналів, якою подано повідомлення, іншою послідовністю сигналів."}, {"k": "p", "text": "\u003cb>Код\u003c/b> (лат. codex — книга) — система умовних сигналів для передавання, опрацювання та зберігання повідомлень.", "f": true}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Змінюється \u003cb>спосіб подання\u003c/b>, а \u003cb>зміст\u003c/b> — ні."}], "f": true}]}, {"type": "table", "sec": "📝 Кодування", "title": "Що і чим кодують", "bit": "Код — це домовленість!", "note": "", "head": ["Повідомлення", "Код"], "rows": [["звуки мови", "літери"], ["мелодія", "ноти"], ["правила руху на дорозі", "дорожні знаки"], ["речовина в хімії", "формула: H₂O — вода"], ["товар у магазині", "штрихкод"]], "frag": true, "leftFirst": true}, {"type": "text", "sec": "📝 Кодування", "title": "Кодування для цифрових пристроїв", "note": "", "img": "a81_devices", "body": [{"k": "p", "text": "Щоб повідомлення опрацював \u003cb>цифровий пристрій\u003c/b>, дані подають у придатному для нього вигляді."}, {"k": "p", "text": "Текст, числа, малюнки й звук комп’ютер кодує \u003cb>двійковим кодом\u003c/b> — нулями й одиницями.", "f": true}, {"k": "p", "text": "Як саме — дізнаємося на наступних уроках розділу.", "small": true, "f": true}]}, {"type": "shot", "sec": "📝 Кодування", "title": "Штрихкод товару", "note": "", "img": "a81_barcode", "intro": "Пробіл або клік — далі по позначках.", "spots": [{"l": "1. Код країни", "r": [1, 63, 23, 36], "t": "482 — Україна: тут зареєстровано виробника."}, {"l": "2. Код виробника", "r": [25, 63, 25, 36], "t": "Номер підприємства, що випускає товар."}, {"l": "3. Код товару", "r": [55, 63, 29, 36], "t": "Номер самого товару в цього виробника."}, {"l": "4. Контрольна цифра", "r": [84, 63, 16, 36], "t": "За нею каса перевіряє, чи правильно прочитано код."}, {"l": "5. Смуги", "r": [7, 1, 88, 61], "t": "Ті самі цифри, закодовані товщиною ліній і відстанню між ними."}]}, {"type": "text", "sec": "📝 Кодування", "title": "Два коди в одному штрихкоді", "note": "", "img": "a81_scan", "body": [{"k": "p", "text": "\u003cb>Цифри\u003c/b> під штрихкодом прочитає людина, коли вибирає товар."}, {"k": "p", "text": "\u003cb>Смуги\u003c/b> прочитає сканер на касі й передасть код комп’ютеру.", "f": true}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "Те саме повідомлення закодовано \u003cb>двома способами\u003c/b>: для людини і для пристрою."}], "f": true}]}, {"type": "cards", "sec": "📝 Кодування", "title": "Коди навколо нас", "bit": "А який код знаєте ви?", "note": "", "n": 4, "cards": [{"e": "📖", "t": "Шрифт Брайля", "x": "опуклі крапки, які читають пальцями"}, {"e": "💬", "t": "Азбука Морзе", "x": "короткі й довгі сигнали"}, {"e": "📱", "t": "QR-код", "x": "квадратики, які читає камера"}, {"e": "🎨", "t": "Вишивка", "x": "візерунки зі своїм значенням"}]}, {"type": "text", "sec": "🧩 Шифри", "title": "Набір сигналів і правила", "note": "", "img": "a81_caesar", "body": [{"k": "p", "text": "Для кодування визначають \u003cb>набір сигналів\u003c/b> і \u003cb>правила\u003c/b> заміни."}, {"k": "p", "text": "\u003cb>Шифр Цезаря\u003c/b>: кожну літеру замінюють тією, що стоїть в абетці на кілька позицій \u003cb>праворуч\u003c/b>.", "f": true}, {"k": "p", "text": "Ним листувався зі своїми полководцями римський державний діяч Гай Юлій Цезар (100–44 рр. до н. е.).", "small": true, "f": true}]}, {"type": "widget", "sec": "🧩 Шифри", "title": "Шифр Цезаря: кодуємо «привіт»", "note": "", "w": "cezar81", "word": "привіт", "shift": 4}, {"type": "text", "sec": "🧩 Шифри", "title": "Диск для шифрування", "note": "", "img": "a81_disk", "body": [{"k": "p", "text": "Щоб шифрувати швидше, придумали \u003cb>диск\u003c/b>: два кола з абеткою, внутрішнє можна повертати."}, {"k": "p", "text": "Повернули на кілька позицій — і під кожною літерою видно, якою її замінити.", "f": true}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "Кількість позицій — \u003cb>зсув\u003c/b>. Хто не знає зсуву, той не прочитає шифр."}], "f": true}]}, {"type": "reveal", "sec": "🧩 Шифри", "title": "Поміркуйте", "note": "", "items": [["Чи можна шифрувати й розшифровувати за одним і тим самим правилом?", "Здебільшого ні: у шифрі Цезаря зсув той самий, але в протилежний бік — ліворуч."], ["Що буде, якщо відкрити фото в програмі Блокнот? Чому?", "Побачимо незрозумілі символи: Блокнот не вміє декодувати зображення."]]}, {"type": "text", "sec": "🔄 Декодування", "title": "Декодування повідомлення", "note": "", "img": "a81_read", "body": [{"k": "def", "text": "\u003cb>Декодування\u003c/b> — отримання початкового повідомлення із закодованого."}, {"k": "p", "text": "Правило декодування утворюють з правила кодування. Ми декодуємо, коли:", "f": true}, {"k": "list", "items": ["читаємо вголос надрукований текст;", "граємо мелодію за нотами;", "розшифровуємо таємне повідомлення."]}]}, {"type": "steps", "sec": "🔄 Декодування", "title": "Задача: декодуйте «зтдфкн зисб»", "note": "", "intro": "Повідомлення закодовано шифром Цезаря зі зсувом 4 праворуч.", "steps": ["Декодуємо: кожну літеру зсуваємо на \u003cb>4 позиції ліворуч\u003c/b>.", "з → д, т → о, д → б, ф → р, к → и, н → й", "з → д, и → е, с → н, б → ь"], "answer": "\u003cb>добрий день\u003c/b>"}, {"type": "text", "sec": "🔄 Декодування", "title": "Квадрат Полібія", "bit": "Спершу стовпець, потім рядок!", "note": "", "body": [{"k": "p", "text": "Один з найдавніших шифрів придумав грецький історик \u003cb>Полібій\u003c/b> (II ст. до н. е.)."}, {"k": "p", "text": "Літери абетки розміщують у таблиці 6 × 6. Кожну літеру замінюють \u003cb>двома цифрами\u003c/b>: номером \u003cb>стовпця\u003c/b> і номером \u003cb>рядка\u003c/b>.", "f": true}, {"k": "chips", "items": ["А → 11", "Б → 21", "Е → 12"], "f": true}]}, {"type": "widget", "sec": "🔄 Декодування", "title": "Квадрат Полібія: чиє це ім’я?", "note": "", "w": "polib81", "code": "24 14 43 13 21 13 62", "done": "Ім’я автора шифру — ПОЛІБІЙ."}, {"type": "text", "sec": "🔄 Декодування", "title": "Файли — теж закодовані повідомлення", "note": "", "img": "a81_files", "body": [{"k": "p", "text": "Текст, малюнки й звук комп’ютер зберігає у \u003cb>файлах\u003c/b>. Для даних кожного типу — свій \u003cb>алгоритм\u003c/b> кодування."}, {"k": "chips", "items": ["DOCX", "TXT", "BMP", "JPG", "MP3"], "f": true}, {"k": "p", "text": "Від алгоритму залежить \u003cb>формат\u003c/b> файлу.", "f": true}]}, {"type": "text", "sec": "🔄 Декодування", "title": "Не та програма — не той результат", "note": "", "img": "a81_nodata", "body": [{"k": "p", "text": "Файл відкрили у \u003cb>відповідній\u003c/b> програмі — вона декодує дані, і ми бачимо текст, малюнок, чуємо звук."}, {"k": "p", "text": "У \u003cb>невідповідній\u003c/b> програмі — незрозумілі символи: у ній немає потрібного алгоритму декодування.", "f": true}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "Кодування і декодування — приклади \u003cb>опрацювання даних\u003c/b>."}], "f": true}]}, {"type": "text", "sec": "🔒 Ключі", "title": "Шифрування і ключ", "note": "", "img": "a81_lock", "body": [{"k": "def", "text": "\u003cb>Шифрування\u003c/b> — кодування, після якого прочитати повідомлення можуть лише ті, хто знає правило декодування."}, {"k": "p", "text": "\u003cb>Криптографічний ключ\u003c/b> — дані, як правило числа, про які домовились відправник і отримувач.", "f": true}, {"k": "p", "text": "У шифрі Цезаря ключ — величина зсуву.", "small": true, "f": true}]}, {"type": "table", "sec": "🔒 Ключі", "title": "Симетричне й асиметричне шифрування", "note": "", "head": ["Ознака", "Симетричне", "Асиметричне"], "rows": [["Ключі", "один, спільний", "два: відкритий і закритий"], ["Хто зашифрує", "той, хто знає ключ", "будь-хто — відкритим ключем"], ["Хто розшифрує", "той, хто знає ключ", "лише власник закритого ключа"], ["Приклад", "шифр Цезаря", "RSA"]], "frag": true, "leftFirst": true}, {"type": "text", "sec": "🔒 Ключі", "title": "Алгоритм RSA", "note": "", "img": "a81_rsa", "body": [{"k": "p", "text": "\u003cb>RSA\u003c/b> запропонували у 1977 році Р. Рівест, А. Шамір і Л. Адлеман. Назва — перші літери їхніх прізвищ."}, {"k": "p", "text": "Беруть два різні прості числа, у кожному понад \u003cb>100 цифр\u003c/b>, і множать. Добуток — частина відкритого ключа.", "f": true}, {"k": "p", "text": "Захищає \u003cb>електронні підписи\u003c/b>, мобільний зв’язок, покупки в інтернеті.", "f": true}]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "items": [["Наведіть приклади кодування з вашого життя.", "Пароль на телефоні, номер у журналі, умовні знаки на карті, смайлики в повідомленнях."], ["Які повідомлення кодують кольорами? А графічними позначеннями?", "Сигнали світлофора, кольори на карті; дорожні знаки, значки догляду на одязі."], ["Як кодують положення кораблів у грі «Морський бій»?", "Літерою стовпця і числом рядка, наприклад Б4. Суперник декодує клітинку на своєму полі."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді", "note": "", "items": [["У чому полягає кодування повідомлень?", "Одну послідовність сигналів замінюють іншою; зміст не змінюється."], ["З якою метою кодують повідомлення?", "Щоб зберігати, передавати, опрацьовувати й захищати."], ["Що треба визначити для кодування?", "Набір сигналів і правила заміни."], ["Що таке декодування? Що означає формат файлу?", "Відновлення початкового повідомлення. Формат — за яким алгоритмом закодовано дані."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "note": "", "qs": [{"q": "Що НЕ змінюєть
