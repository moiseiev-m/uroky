дають кілька точок."}, {"k": "p", "text": "Названа на честь французького інженера \u003cb>П’єра Безьє\u003c/b> (1910–1999).", "f": true}, {"k": "p", "text": "Він креслив такими кривими кузови автомобілів \u003cb>Рено\u003c/b>. Тепер ними будують шрифти, логотипи, значки.", "small": true, "f": true}]}, {"type": "widget", "sec": "📐 Крива Безьє", "title": "З чого складається крива Безьє", "note": "", "w": "bez6", "intro": "Пробіл або клік — далі."}, {"type": "cards", "sec": "🎯 Типи точок", "title": "Три типи точок перегинання", "note": "", "n": 3, "cards": [{"img": "a614_kut", "t": "Кутова", "x": "дуги сходяться кутом; кожен відрізок змінюють окремо"}, {"img": "a614_glad", "t": "Гладка", "x": "плавний перехід; відрізки на одній прямій, довжини різні"}, {"img": "a614_sym", "t": "Симетрична", "x": "відрізки однакові; змінюєш один — дзеркально змінюється другий"}]}, {"type": "widget", "sec": "🎯 Типи точок", "title": "Тягнемо маркер: що робить другий?", "note": "", "w": "toch6", "intro": "Пробіл або клік — далі."}, {"type": "steps", "sec": "🖥 Krita", "title": "Як намалювати криву Безьє", "bit": "Подвійне клацання — крива готова!", "note": "", "steps": ["Вибрати інструмент \u003cb>Малювання кривої Безьє\u003c/b>.", "Задати колір, \u003cb>Розмір\u003c/b> і \u003cb>Непрозорість\u003c/b> на панелі \u003cb>Пензлі та ін.\u003c/b>", "Клацнути \u003cb>початкову\u003c/b> точку кривої.", "Клацати \u003cb>наступні\u003c/b> точки перегинання.", "Завершити \u003cb>подвійним клацанням\u003c/b>."]}, {"type": "shot", "sec": "✍ Редагування", "title": "Редагуємо криву в Krita", "note": "", "img": "a614_win", "intro": "П’ять важливих місць. Пробіл або клік — далі.", "spots": [{"l": "1. Інструмент редагування форм", "r": [0.2, 20.4, 2.1, 3.8], "t": "Вибрати ним криву і клацнути потрібну точку."}, {"l": "2. Вибрана точка", "r": [34.2, 18.1, 7.0, 12.8], "t": "Стає блакитною, з’являються відрізки з маркерами."}, {"l": "3. Тип точки", "r": [79.7, 24.3, 7.3, 4.2], "t": "Кнопки: кутова, гладка, симетрична точка."}, {"l": "4. Вставити, вилучити точку", "r": [79.7, 28.7, 4.8, 4.2], "t": "Додати точку на кривій або прибрати зайву."}, {"l": "5. Інші кнопки", "r": [89.9, 24.2, 10.0, 8.8], "t": "Розірвати криву, з’єднати точки — для тих, хто хоче знати більше."}]}, {"type": "text", "sec": "✍ Редагування", "title": "Тип точки — двома способами", "note": "", "img": "a614_lam", "body": [{"k": "p", "text": "Після малювання більшість точок — \u003cb>кутові\u003c/b>: крива схожа на \u003cb>ламану\u003c/b>."}, {"k": "grid", "items": [{"e": "sliders", "t": "Кнопки на панелі", "x": "Параметри інструмента ⇒ Змінити форму"}, {"e": "list", "t": "Контекстне меню", "x": "праве клацання по точці"}], "n": 2, "h": 130}, {"k": "p", "text": "Спершу вибрати точку \u003cb>Інструментом редагування форм\u003c/b>.", "small": true, "f": true}]}, {"type": "text", "sec": "✍ Редагування", "title": "Як це в Krita: з ламаної — хвиля", "note": "", "body": [{"k": "img", "img": "a614_bez", "h": 520, "head": "Клацаннями — ламана ⇒ \u003cb>Редагування форм\u003c/b> ⇒ \u003cb>Гладка точка\u003c/b> ⇒ маркер ⇒ \u003cb>Симетрична точка\u003c/b> ⇒ хвиля"}]}, {"type": "text", "sec": "✍ Редагування", "title": "Фігуру — у криву Безьє", "note": "", "img": "a614_kontur", "body": [{"k": "p", "text": "Криву Безьє можна зробити з \u003cb>овалу\u003c/b>, \u003cb>прямокутника\u003c/b>, \u003cb>відрізка\u003c/b>, \u003cb>ламаної\u003c/b>, \u003cb>многокутника\u003c/b>, \u003cb>довільного контуру\u003c/b>."}, {"k": "list", "items": ["Вибрати фігуру \u003cb>Інструментом редагування форм\u003c/b>.", "Праве клацання ⇒ \u003cb>У контур\u003c/b>.", "Тепер точки фігури тягнемо, як у кривої."]}]}, {"type": "text", "sec": "📄 SVG", "title": "Зберегти у форматі SVG", "note": "", "body": [{"k": "def", "text": "\u003cb>SVG\u003c/b> — формат векторних зображень: у файлі — опис фігур, а не пікселі."}, {"k": "img", "img": "a614_shar", "h": 250}, {"k": "p", "text": "Векторний шар — поточний ⇒ \u003cb>Шар\u003c/b> ⇒ \u003cb>Імпортування/Експортування\u003c/b> ⇒ \u003cb>Зберегти векторний шар як SVG\u003c/b> ⇒ ім’я, папка ⇒ \u003cb>Зберегти\u003c/b>.", "small": true, "f": true}]}, {"type": "text", "sec": "📄 SVG", "title": "Відкрити файл SVG у Krita", "note": "", "body": [{"k": "list", "items": ["\u003cb>Файл\u003c/b> ⇒ \u003cb>Відкрити\u003c/b>.", "Вибрати файл SVG ⇒ \u003cb>Відкрити\u003c/b>.", "Вікно \u003cb>Імпортувати SVG\u003c/b>: роздільність (за замовчуванням \u003cb>100\u003c/b> точок на дюйм) ⇒ \u003cb>ОК\u003c/b>."]}, {"k": "img", "img": "a614_imp", "h": 150}]}, {"type": "table", "sec": "🌐 Онлайн", "title": "Немає Krita? Криві в Photopea", "bit": "Ручка в Photopea — та сама крива Безьє!", "note": "", "head": ["Що робимо", "Krita", "Photopea"], "rows": [["Малювати криву", "Малювання кривої Безьє", "Ручка, режим Форма"], ["Кутова точка", "кнопка Кутова точка", "просто клацнути"], ["Гладка точка", "кнопка Гладка точка", "протягнути мишею"], ["Закінчити криву", "подвійне клацання", "Enter"], ["Тягнути маркери", "Редагування форм", "Виділення Вузла"], ["Зберегти SVG", "Шар ⇒ … як SVG", "Експортувати як ⇒ SVG"]], "frag": true, "leftFirst": true}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді", "note": "", "items": [["Із чого складається крива Безьє?", "З вузлів і дуг; дуги задають відрізки з маркерами."], ["Як установити тип точки?", "Вибрати точку Інструментом редагування форм ⇒ кнопка або контекстне меню."], ["Чим редагують векторні об’єкти в Krita?", "Позначення й редагування форм, Параметри інструмента, меню Зміни."], ["Як зберегти векторне зображення у SVG?", "Шар ⇒ Імпортування/Експортування ⇒ Зберегти векторний шар як SVG."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "bit": "Спершу обговоріть у парах!", "note": "", "items": [["Коли потрібна кутова точка, а коли гладка?", "Кутова — гострий кут (дах, кінчик листка); гладка — плавний вигин (хвиля)."], ["Навіщо команди «Зробити точкою прямої» і «Зробити точкою кривої»?", "Що
