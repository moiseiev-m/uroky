нка. Плівки лежать стосом, і разом ми бачимо весь малюнок."}, {"k": "grid", "items": [{"e": "image", "t": "Шар малювання", "x": "растровий: пензель, гумка"}, {"e": "palette", "t": "Векторний шар", "x": "фігури, які можна змінювати"}, {"e": "doc", "t": "Тло", "x": "нижній шар, колір паперу"}], "n": 3, "h": 120}, {"k": "p", "text": "На малюнку може бути і растровий, і векторний шар. Шари зберігає формат \u003cb class=\"mono\">.kra\u003c/b>.", "small": true, "f": true}]}, {"type": "steps", "sec": "🎨 Векторний шар", "title": "Як створити векторне зображення", "bit": "Спершу векторний шар — потім фігури!", "note": "", "steps": ["\u003cb>Файл ⇒ Створити\u003c/b> або кнопка \u003cb>Нове зображення\u003c/b>, потім \u003cb>Створити\u003c/b>.", "Панель \u003cb>Шари\u003c/b>: список біля кнопки \u003cb>+\u003c/b> ⇒ \u003cb>Додати векторний шар\u003c/b>.", "Намалювати у векторному шарі фігури інструментами.", "Редагувати: пересунути, змінити розмір, повернути, копіювати.", "Форматувати: колір і товщина контуру, заповнення, тінь."]}, {"type": "text", "sec": "🎨 Векторний шар", "title": "Як це в Krita: векторний шар", "note": "", "body": [{"k": "img", "img": "a613_shar", "h": 520, "head": "\u003cb>+\u003c/b> ⇒ \u003cb>Додати векторний шар\u003c/b> ⇒ Прямокутник, Еліпс ⇒ пересуваємо і збільшуємо"}]}, {"type": "shot", "sec": "✍ Інструменти", "title": "Векторний шар у вікні Krita", "note": "", "img": "a613_win", "intro": "Шість важливих місць. Пробіл або клік — далі.", "spots": [{"l": "1. Векторний шар", "r": [74.9, 42.4, 25.1, 9.1], "t": "У списку шарів має особливий значок."}, {"l": "2. Позначення і редагування форм", "r": [0.1, 14.6, 2.6, 6.8], "t": "Вибрати фігуру, змінити її форму."}, {"l": "3. Каліграфія", "r": [2.4, 18.3, 2.6, 3.4], "t": "Лінія змінної товщини, як пером."}, {"l": "4. Крива Безьє", "r": [0.1, 35.8, 2.6, 3.4], "t": "Плавна крива з точок — наступного уроку."}, {"l": "5. Пензлі та ін.", "r": [16.6, 7.7, 71, 4.6], "t": "Колір, набір пензлів, Непрозорість, Розмір."}
