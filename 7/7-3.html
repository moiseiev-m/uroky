ів."}]}, {"type": "reveal", "sec": "🧩 Розсилання", "title": "Поміркуйте", "note": "", "img": "a73_think2", "items": [["Для чого надсилати однаковий лист кільком адресатам?", "Оголошення класу, запрошення на свято, розклад гуртка — один лист замість тридцяти."], ["Як швидко вибрати в полі Кому всіх однокласників?", "Об’єднати їх у групу контактів."]]}, {"type": "text", "sec": "🧩 Розсилання", "title": "Список розсилання", "note": "", "img": "a73_group", "body": [{"k": "def", "text": "\u003cb>Список розсилання\u003c/b> (група контактів) — контакти під однією назвою, щоб швидко надсилати їм однаковий лист."}, {"k": "list", "items": ["назва групи — це \u003cb>мітка\u003c/b>;", "один контакт може бути в \u003cb>кількох\u003c/b> групах."]}]}, {"type": "shot", "sec": "🧩 Розсилання", "title": "Група контактів: створюємо і пишемо всім", "note": "", "img": "a73_mitka", "intro": "Новий лист → посилання \u003cb>Кому\u003c/b> → вікно \u003cb>Вибрати контакти\u003c/b>.", "spots": [{"l": "1. Позначте контакти", "r": [0, 55, 100, 32], "t": "Тих, хто буде в групі."}, {"l": "2. Керувати мітками", "r": [29, 13, 17, 7], "t": "Кнопка над списком."}, {"l": "3. Створити мітку", "r": [29, 28, 31, 9], "t": "Команда в меню."}, {"l": "4. Назва групи", "img": "a73_mitkaim", "r": [22, 33, 56, 34], "t": "Введіть назву → \u003cb>Зберегти\u003c/b>."}, {"l": "5. Лист групі", "img": "a73_hrupa", "r": [59, 13, 16, 7], "t": "Кнопка \u003cb>Мої контакти\u003c/b> → назва групи."}, {"l": "6. Вибрати всі → Додати", "img": "a73_hrupa", "r": [0, 13, 18, 7], "t": "Позначено всіх у групі. Потім \u003cb>Додати\u003c/b>."}, {"l": "7. Готово!", "img": "a73_komuhr", "r": [1, 10, 74, 9], "t": "У полі \u003cb>Кому\u003c/b> — адреси всієї групи."}]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "compact": true, "items": [["Чим схожі й чим різні паперовий та електронний лист?", "Схожі: адреса, вкладення. Різні: швидкість, ціна, одразу багатьом."], ["Для чого заповнювати поле Тема?", "Одержувач одразу бачить, про що лист, і легко його знайде."], ["У чому зручність ланцюжків листів?", "Уся переписка на одну тему — разом і по черзі."], ["Навіщо адресна книга й списки розсилання?", "Не пам’ятати адрес і писати групі одним листом."]]}, {"type": "quiz", "sec": "✅ Перевіряємо", "title": "Перевіримо себе", "note": "", "qs": [{"q": "Що стоїть в адресі скриньки між логіном і назвою сервера?", "a": ["@", "крапка", "#", "/"], "ok": 0}, {"q": "У якій папці копії листів, які ви відправили?", "a": ["Вхідні", "Надіслані", "Чернетки", "Спам"], "ok": 1}, {"q": "Ви відповіли на лист з темою «Екскурсія». Яка тема відповіді?", "a": ["Fwd: Екскурсія", "Екскурсія", "Re: Екскурсія", "тему треба набрати"], "ok": 2}, {"q": "Що не вийде вкласти до листа Gmail?", "a": ["фото .jpg", "презентацію .pptx", "програму .exe", "документ .docx"], "ok": 2}, {"q": "Як називають групу контактів для однакових листів?", "a": ["список розсилання", "чернетка", "ланцюжок листів", "спам"], "ok": 0}]}, {"type": "home", "sec": "Фініш", "note": "", "items": [["📖 Прочитати", "§ 1.3–1.4", "с. 22–33"], ["✍ Відповісти", "запитання 1–5", "с. 29, усно"], ["💡 Придумати", "тему для листа", "завдання 4, с. 29"]]}]};
