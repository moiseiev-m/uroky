003c/b> — 12 символів і більше;", "великі й малі літери, цифри, знаки;", "без імені, дати народження, клички, \u003cb class=\"mono\">123456\u003c/b>, \u003cb class=\"mono\">qwerty\u003c/b>;", "для кожного сайту — \u003cb>свій\u003c/b>."]}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "Легко запам’ятати: фраза з кількох слів, цифри й знака."}], "f": true}]}, {"type": "widget", "sec": "🔒 Пароль", "title": "Скільки варіантів перебрати?", "note": "", "w": "parol74", "speed": "Уявімо комп’ютер, що перевіряє \u003cb>мільярд\u003c/b> паролів за секунду.", "rows": [{"p": "482915", "x": "6 цифр", "v": "1 мільйон варіантів", "t": "0,001 секунди", "w": 25}, {"p": "sonechko", "x": "8 малих літер", "v": "209 мільярдів", "t": "3,5 хвилини", "w": 47}, {"p": "olia2013", "x": "ім’я та рік", "v": "у списках популярних паролів", "t": "за мить", "w": 2, "bad": true}, {"p": "S0n#chk8", "x": "8 символів, усі види", "v": "6 квадрильйонів", "t": "70 днів", "w": 66}, {"p": "Kv1t-Sonce#7", "x": "12 символів, усі види", "v": "476 секстильйонів", "t": "15 мільйонів років", "w": 99, "good": true}], "steps": [{"k": "Як думаєте?", "ask": true, "show": 0, "say": "Шахрай перебирає всі можливі паролі по черзі. Від чого залежить, як довго він підбиратиме ваш?"}, {"k": "6 цифр", "show": 1, "hl": 0, "say": "Лише цифри: 10 варіантів на кожне місце — мільйон паролів. Підбере за тисячну частку секунди."}, {"k": "8 малих літер", "show": 2, "hl": 1, "say": "26 латинських літер на кожне місце — уже 209 мільярдів. Але й це — кілька хвилин."}, {"k": "Пастка: ім’я та рік", "show": 3, "hl": 2, "say": "Символів теж 8, але шахраї \u003cb>спершу\u003c/b> пробують імена, дати, слова й популярні паролі. Такий — за мить."}, {"k": "8 символів, усі види", "show": 4, "hl": 3, "say": "Великі й малі літери, цифри, знаки — 94 варіанти на місце. Вже 70 днів."}, {"k": "12 символів, усі види", "show": 5, "hl": 4, "say": "Ще 4 символи — і \u003cb>15 мільйонів років\u003c/b>. Довжина важить найбільше!"}]}, {"type": "reveal", "sec": "🔒 Пароль", "title": "Правда чи міф?", "role": "tf", "note": "", "compact": true, "items": [["Пароль \u003cb class=\"mono\">olia2013\u003c/b> надійний: у ньому 8 символів.", "Міф. Ім’я та рік народження шахраї перевіряють першими."], ["Пароль можна сказати найкращому другові.", "Міф. Пароль знаєте лише ви, а вдома — батьки."], ["Довга фраза з кількох слів — хороший пароль.", "Правда. Довжина важить найбільше. Додайте цифру й знак."], ["Один пароль на всіх сайтах — зручно й безпечно.", "Міф. Зламають одну гру — відкриють і пошту."]]}, {"type": "steps", "sec": "🔒 Пароль", "title": "Двоетапна перевірка", "note": "", "intro": "Другий замок на акаунт: крім пароля — \u003cb>ваш телефон\u003c/b>.", "steps": ["Ви вводите адресу й пароль.", "Google питає на вашому телефоні: «Це ви намагаєтеся ввійти?» — або надсилає код в SMS.", "Ви підтверджуєте — і входите.", "Шахрай знає пароль, але телефона не має — вхід не вдасться."], "answer": "Код з SMS — нікому, навіть «службі підтримки»!"}, {"type": "shot", "sec": "🖥 Практична", "title": "Шукаємо анімоване зображення", "note": "", "img": "a74_zobr", "intro": "Для Практичної роботи № 1: \u003cb>Зображення\u003c/b> → \u003cb>Інструменти\u003c/b>.", "spots": [{"l": "1. Зображення", "r": [13, 25, 12, 9], "t": "Фільтр результатів — лише картинки."}, {"l": "2. Інструменти", "r": [81, 25, 14.5, 9], "t": "Відкриває списки умов пошуку."}, {"l": "3. Розмір → Середні", "r": [65.5, 36.5, 30, 7], "t": "Не піктограми й не величезні."}, {"l": "4. Тип → GIF", "r": [65.5, 58.5, 30, 7.5], "t": "GIF — анімовані зображення."}, {"l": "5. Будь-коли → За минулий місяць", "r": [65.5, 66, 30, 7.5], "t": "Розміщені в Інтернеті за останній місяць."}]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "note": "", "items": [["Дотримання яких правил захистить ваші особисті дані?", "Приватне — не незнайомим, пароль — нікому, вийти з акаунта, змінювати пароль."], ["Які правила захистять комп’ютер від шкідливих п
