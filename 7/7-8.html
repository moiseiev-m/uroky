матика: \u003cb class=\"mono\">2x + 3 = 7\u003c/b>", "поштовий індекс, ноти, дорожні знаки"]}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "У кожної — свій алфавіт, словник і правила запису."}], "f": true}]}, {"type": "reveal", "sec": "🔄 Транслятори", "title": "Пригадайте", "note": "", "img": "a78_tr", "items": [["Що ви робите, коли трапляється незнайоме іноземне слово?", "Шукаємо в словнику або в онлайн-перекладачі."], ["Хто такий синхронний перекладач?", "Людина, що перекладає мову одразу, під час промови."], ["Як ця професія звучить англійською?", "Interpreter — інтерпретатор."]]}, {"type": "text", "sec": "🔄 Транслятори", "title": "Перші мови програмування", "note": "", "img": "a78_loom", "body": [{"k": "p", "text": "\u003cb>XIX ст.\u003c/b> — «програмовані» ткацькі верстати й піаніно-програвачі."}, {"k": "p", "text": "\u003cb>1940-ві\u003c/b> — перші комп’ютери. Команди — лише числа з 0 і 1:", "f": true}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb class=\"mono\">00 0010 0011 0100\u003c/b>\u003cbr>код операції · адреси двох комірок з даними · адреса комірки з результатом"}], "f": true}]}, {"type": "text", "sec": "🔄 Транслятори", "title": "Мови низького і високого рівня", "note": "", "body": [{"k": "cols", "items": [{"k": "box", "tone": "pink", "blocks": [{"k": "p", "text": "\u003cb>Низького рівня\u003c/b>: команди — числа. Для кожного процесора свої коди. Писати важко й довго."}], "f": true}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "\u003cb>Високого рівня\u003c/b> (з 1950-х): команди — слова, схожі на людські. Наприклад, \u003cb>Fortran\u003c/b>."}], "f": true}]}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb class=\"mono\">read a\u003c/b>\u003cbr>\u003cb class=\"mono\">read b\u003c/b>\u003cbr>\u003cb class=\"mono\">x = a + b\u003c/b>\u003cbr>\u003cb class=\"mono\">write x\u003c/b>"}], "f": true}]}, {"type": "text", "sec": "🔄 Транслятори", "title": "Транслятор — програма-перекладач", "
