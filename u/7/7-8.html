: "box", "tone": "sun", "blocks": [{"k": "p", "text": "\u003cb>Текстовий\u003c/b>: лише вікно введення-виведення. Команди й результати — числа та текст. Приклади — Linux, FAR."}], "f": true}]}, {"k": "grid", "items": [{"img": "a78_win", "t": "Windows", "x": "графічний інтерфейс"}, {"img": "a78_far", "t": "FAR", "x": "текстовий інтерфейс"}], "n": 2, "h": 200}]}, {"type": "widget", "sec": "🖥 Програми", "title": "Одне завдання — два інтерфейси", "w": "ui78", "intro": "Пробіл або клік — далі."}, {"type": "reveal", "sec": "💻 Мови", "title": "Поміркуйте", "img": "a78_q", "items": [["Що таке система команд виконавця?", "Усі команди, які виконавець уміє виконувати."], ["Чи довільні команди може виконувати виконавець?", "Ні, лише команди зі своєї системи команд."], ["Чи повинен виконавець розуміти команди?", "Так, інакше він не зможе їх виконати."]]}, {"type": "text", "sec": "💻 Мови", "title": "Навіщо потрібні мови програмування", "body": [{"k": "p", "text": "Алгоритми для людей записують \u003cb>мовою спілкування\u003c/b>, жестами, позначками, сигналами."}, {"k": "box", "tone": "pink", "blocks": [{"k": "p", "text": "Мова людей складна й неоднозначна: \u003cb>ключ\u003c/b> від дверей чи журавлиний? \u003cb>Коса\u003c/b> для трави чи зачіска?"}], "f": true}, {"k": "def", "text": "\u003cb>Мова програмування\u003c/b> — мова для запису алгоритмів, призначених для виконання комп’ютером.", "f": true}, {"k": "p", "text": "За 80 років створено приблизно \u003cb>3000\u003c/b> мов програмування.", "f": true}]}, {"type": "text", "sec": "💻 Мови", "title": "Універсальні та спеціальні мови", "body": [{"k": "cols", "items": [{"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "\u003cb>Універсальні\u003c/b> — для задач з різних галузей: науки, техніки, виробництва, побуту."}], "f": true}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb>Спеціальні\u003c/b> — для певного кола задач, наприклад економічних."}], "f": true}]}, {"k": "p", "text": "Найпопулярніші мови 2023 , "text": "У кожної — свій алфавіт, словник і правила запису."}], "f": true}]}, {"type": "reveal", "sec": "🔄 Транслятори", "title": "Пригадайте", "img": "a78_tr", "items": [["Що ви робите, коли трапляється незнайоме іноземне слово?", "Шукаємо в словнику або в онлайн-перекладачі."], ["Хто такий синхронний перекладач?", "Людина, що перекладає мову одразу, під час промови."], ["Як ця професія звучить англійською?", "Interpreter — інтерпретатор."]]}, {"type": "text", "sec": "🔄 Транслятори", "title": "Перші мови програмування", "img": "a78_loom", "body": [{"k": "p", "text": "\u003cb>XIX ст.\u003c/b> — «програмовані» ткацькі верстати й піаніно-програвачі."}, {"k": "p", "text": "\u003cb>1940-ві\u003c/b> — перші комп’ютери. Команди — лише числа з 0 і 1:", "f": true}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb class=\"mono\">00 0010 0011 0100\u003c/b>\u003cbr>код операції · адреси двох комірок з даними · адреса комірки з результатом"}], "f": true}]}, {"type": "text", "sec": "🔄 Транслятори", "title": "Мови низького і високого рівня", "body": [{"k": "cols", "items": [{"k": "box", "tone": "pink", "blocks": [{"k": "p", "text": "\u003cb>Низького рівня\u003c/b>: команди — числа. Для кожного процесора свої коди. Писати важко й довго."}], "f": true}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "\u003cb>Високого рівня\u003c/b> (з 1950-х): команди — слова, схожі на людські. Наприклад, \u003cb>Fortran\u003c/b>."}], "f": true}]}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "\u003cb class=\"mono\">read a\u003c/b>\u003cbr>\u003cb class=\"mono\">read b\u003c/b>\u003cbr>\u003cb class=\"mono\">x = a + b\u003c/b>\u003cbr>\u003cb class=\"mono\">write x\u003c/b>"}], "f": true}]}, {"type": "text", "sec": "🔄 Транслятори", "title": "Транслятор — програма-перекладач", "img": "a78_trans", "body": [{"k": "def", "text": "\u003cb>Транслятор\u003c/b> (англ. translate — перекладати) — програма, що перекладає програму мовою високого рівня на мову команд
