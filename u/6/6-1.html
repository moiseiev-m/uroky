": [{"img": "a61_cal", "t": "Штангенциркуль"}, {"img": "a61_dcal", "t": "Цифровий штангенциркуль"}], "n": 2, "h": 210}]}]}, {"type": "text", "sec": "Пристрої", "title": "Цифрові пристрої навколо нас", "bit": "А у вашій кухні є цифрові пристрої?", "body": [{"k": "p", "text": "Цифрові — \u003cb>комп’ютери\u003c/b> різних типів і \u003cb>всі пристрої комп’ютера\u003c/b>. А ще побутові:"}, {"k": "grid", "items": [{"img": "a61_watch", "t": "SMART-годинник"}, {"img": "a61_tv", "t": "SMART-телевізор"}, {"img": "a61_media", "t": "Мультимедійний центр"}, {"img": "a61_cam", "t": "Фотокамера"}, {"img": "a61_robot", "t": "Робот-пилосос"}, {"img": "a61_wash", "t": "Пральна машина"}], "n": 3, "h": 105}]}, {"type": "reveal", "sec": "Процеси", "title": "Поміркуйте", "img": "a61_girl", "items": [["Які пристрої використовує учениця під час дистанційного навчання? Чи цифрові вони?", "Комп’ютер, смартфон, навушники з мікрофоном. Так, цифрові."], ["Які інформаційні процеси відбуваються під час такого уроку?", "Передавання (відеозв’язок), опрацювання (звук і відео), зберігання (завдання, презентації)."]]}, {"type": "text", "sec": "Процеси", "title": "Що є в кожному цифровому пристрої", "body": [{"k": "p", "text": "Цифрові пристрої здійснюють інформаційні процеси, тож мають у складі пристрої для:"}, {"k": "grid", "items": [{"e": "globe", "t": "Передавання даних", "x": "дроти, Wi‑Fi, Bluetooth"}, {"e": "code", "t": "Опрацювання даних", "x": "процесор"}, {"e": "db", "t": "Зберігання даних", "x": "пам’ять"}], "n": 3, "h": 90}]}, {"type": "widget", "sec": "Процеси", "title": "Як працює цифровий термометр", "w": "proc6"}, {"type": "text", "sec": "Процеси", "title": "Передавання: дротом і без дротів", "img": "a61_smtv", "body": [{"k": "list", "items": ["\u003cb>Дротове\u003c/b> з’єднання — кабель локальної мережі.", "\u003cb>Бездротове\u003c/b> — \u003cb>Wi‑Fi\u003c/b> чи \u003cb>Bluetooth\u003c/b>."]}, {"k": "p", "text": "SMART-телевізор отримує фільми з інтернету кабелем або через Wi‑Fi.", "f аги", "title": "Смартфон: багато пристроїв в одному", "w": "smart6"}, {"type": "text", "sec": "Переваги", "title": "Програма «Розумні інструменти»", "body": [{"k": "p", "text": "Додайте програму — і смартфон стане \u003cb>лінійкою\u003c/b>, \u003cb>рівнем\u003c/b>, \u003cb>компасом\u003c/b>, \u003cb>лупою\u003c/b>."}, {"k": "grid", "items": [{"img": "a61_tools", "t": "Набір інструментів"}, {"img": "a61_level", "t": "Рівень"}], "n": 2, "h": 330}]}, {"type": "reveal", "sec": "Класифікація", "title": "Пригадайте", "img": "a61_kids", "items": [["Що таке класифікація?", "Поділ об’єктів на групи за значеннями якоїсь властивості."], ["Як класифікують пристрої комп’ютера?", "За призначенням: введення, виведення, опрацювання, зберігання даних."]]}, {"type": "text", "sec": "Класифікація", "title": "Поміркуйте", "body": [{"k": "p", "text": "За якою властивістю поділено на групи об’єкти?"}, {"k": "grid", "items": [{"img": "a61_grp1", "t": "А"}, {"img": "a61_grp2", "t": "Б"}], "n": 2, "h": 210}, {"k": "box", "tone": "mint", "blocks": [{"k": "p", "text": "А — за \u003cb>кольором\u003c/b>. Б — за \u003cb>призначенням\u003c/b>: приладдя, посуд, їжа, іграшки."}], "f": true}]}, {"type": "tabs", "sec": "Класифікація", "title": "Класифікація за призначенням", "tabs": [{"label": "Передавання", "body": [{"k": "grid", "items": [{"img": "a61_router", "t": "Роутер"}, {"img": "a61_modem", "t": "Модем"}, {"img": "a61_t2", "t": "Приставка Т2"}], "n": 3, "h": 190}]}, {"label": "Опрацювання", "body": [{"k": "grid", "items": [{"img": "a61_pcam", "t": "Фотокамера"}, {"img": "a61_vcam", "t": "Відеокамера"}, {"img": "a61_scan2", "t": "Сканер"}], "n": 3, "h": 190}]}, {"label": "Зберігання", "body": [{"k": "grid", "items": [{"img": "a61_flash", "t": "Флешкарти"}, {"img": "a61_ssd2", "t": "SSD-диски"}, {"img": "a61_server", "t": "Сервер зберігання"}], "n": 3, "h": 190}]}]}, {"type": "widget", "sec": "Класифікація", "title": "Куди віднести пристрій?", "w": "klas6"}, {"type": "text", "sec": "Класифікація
