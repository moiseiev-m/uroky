3c/b>."}, {"k": "def", "text": "\u003cb>Хаб\u003c/b> (англ. hub — центр діяльності) — пристрій, що об’єднує їх у мережу.", "f": true}]}, {"type": "shot", "sec": "Розумний дім", "title": "Пристрої «розумного» будинку", "img": "a62_scheme", "intro": "Один із можливих наборів. Пробіл або клік — далі.", "spots": [{"l": "1. Хаб", "r": [30, 24, 18, 27], "t": "Центр: з’єднує всі пристрої в мережу."}, {"l": "2. Датчик води", "r": [7, 12, 11, 17], "t": "Помічає воду на підлозі — протікання."}, {"l": "3. Датчик диму чи газу", "r": [19, 3, 11, 17], "t": "Подає сигнал, щойно з’явився дим або газ."}, {"l": "4. Датчик руху", "r": [31, 61, 9, 29], "t": "Помічає, що хтось зайшов."}, {"l": "5. Вимикач і лампочки", "r": [46, 3, 27, 21], "t": "Світло — з бездротового вимикача або смартфона."}, {"l": "6. Вебкамера", "r": [73, 11, 9, 22], "t": "Показує на смартфоні, що відбувається вдома."}, {"l": "7. Робот-пилосос", "r": [72, 53, 24, 19], "t": "Прибирає за розкладом."}, {"l": "8. Смартфон", "r": [50, 59, 29, 41], "t": "Програма керування всім будинком."}]}, {"type": "widget", "sec": "Розумний дім", "title": "Як працює «розумний» будинок", "w": "dim6"}, {"type": "text", "sec": "Розумний дім", "title": "Смартфон керує будинком", "img": "a62_shome", "body": [{"k": "p", "text": "За допомогою смартфона можна:"}, {"k": "list", "items": ["отримувати дані про \u003cb>небезпеку\u003c/b> в будинку або зовні;", "керувати \u003cb>побутовими пристроями\u003c/b>;", "керувати \u003cb>освітленням\u003c/b>."]}]}, {"type": "reveal", "sec": "Технології", "title": "Поміркуйте", "img": "a62_apps", "items": [["Які цифрові технології на екранах? Які послуги вони дають?", "Доставка продуктів, документи в «Дії», тренування вдома, квитки на потяг."], ["У чому зручність?", "Не треба нікуди йти й стояти в черзі: усе зі смартфона, будь-коли."]]}, {"type": "text", "sec": "Технології", "title": "Цифрові технології в житті", "img": "a62_serv", "body": [{"k": "p", "text": "Цифрові технології використовують для:"}, {"k ", "body": [{"k": "def", "text": "\u003cb>Цифровий слід\u003c/b> — сукупність відомостей про користувача, які він залишає, користуючись комп’ютерними мережами."}, {"k": "p", "text": "Слід буває \u003cb>пасивний\u003c/b> і \u003cb>активний\u003c/b>.", "f": true}]}, {"type": "widget", "sec": "Цифровий слід", "title": "Один день у мережі", "w": "slid6"}, {"type": "table", "sec": "Цифровий слід", "title": "Пасивний і активний слід", "bit": "Пасивний — збирають, активний — пишете самі!", "head": ["Слід", "Що це", "Приклади"], "rows": [["Пасивний", "дані, які збираються під час будь-якого звертання до інтернету", "відвідані сайти, пошукові запити, адреса комп’ютера"], ["Активний", "дані, які користувач \u003cb>свідомо\u003c/b> вносить у мережні сервіси", "сайти й блоги, облікові записи, повідомлення"]], "frag": true, "leftFirst": true}, {"type": "text", "sec": "Цифровий слід", "title": "Чим небезпечний цифровий слід", "img": "a62_hacker", "body": [{"k": "p", "text": "Дані цифрового сліду зловмисники використовують для:"}, {"k": "list", "items": ["\u003cb>булінгу\u003c/b>;", "крадіжки \u003cb>особистих даних\u003c/b>;", "крадіжки \u003cb>коштів\u003c/b>."]}, {"k": "box", "tone": "pink", "blocks": [{"k": "p", "text": "Слід з особистими даними треба \u003cb>максимально зменшити\u003c/b>."}], "f": true}]}, {"type": "text", "sec": "Цифровий слід", "title": "Як зменшити цифровий слід", "body": [{"k": "list", "items": ["Попросіть дорослих налаштувати \u003cb>конфіденційність\u003c/b> браузера.", "\u003cb>Вебкамеру\u003c/b> й \u003cb>мікрофон\u003c/b> — лише перевіреним сервісам.", "Не додавайте в друзі \u003cb>незнайомих\u003c/b>.", "Не пишіть \u003cb>адресу\u003c/b>, \u003cb>телефон\u003c/b>, \u003cb>плани подорожей\u003c/b>."]}]}, {"type": "text", "sec": "Цифровий слід", "title": "Як зменшити цифровий слід (продовження)", "bit": "Чужий комп’ютер — не зберігайте паролі!", "body": [{"k": "list", "items": ["Видаляйте \u003cb>облікові записи\u003c/b>, якими не користуєтеся.", "Від
