їв'.lower() == 'київ'\u003c/b> — True.", "Так: \u003cb class=\"mono\">lower()\u003c/b> робить усі літери малими."], ["\u003cb class=\"mono\">' ⁠ ⁠кіт ⁠ ⁠'.strip()\u003c/b> дає \u003cb class=\"mono\">'кіт'\u003c/b>.", "Так: без аргументу \u003cb class=\"mono\">strip\u003c/b> прибирає пропуски з країв."], ["\u003cb class=\"mono\">'банан'.replace('ан', 'он')\u003c/b> дає \u003cb class=\"mono\">'бонан'\u003c/b>.", "Ні: замінюються всі входження — \u003cb class=\"mono\">'бонон'\u003c/b>."]]}, {"type": "widget", "sec": "🔄 Новий рядок", "title": "Новий рядок у циклі", "w": "krok", "code": ["a = 'к іт'", "s = ''", "for k in a:", "    if k != ' ': s = s + k", "print(s, a.replace(' ', ''))"], "names": {"a": "рядок", "s": "новий рядок", "k": "символ"}, "steps": [{"line": 1, "k": "Задача", "say": "Прибрати з рядка пропуск. Змінити рядок не можна — \u003cb>створимо новий\u003c/b>.", "vars": {"a": "'к іт'"}}, {"line": 2, "k": "Порожній рядок", "say": "Новий рядок \u003cb>s\u003c/b> — спершу порожній.", "vars": {"a": "'к іт'", "s": "''"}}, {"line": 3, "k": "Передбачте", "ask": true, "say": "Що виведе програма?", "vars": {"a": "'к іт'", "s": "''"}}, {"line": 4, "k": "Перший символ", "say": "\u003cb>k = 'к'\u003c/b> — не пропуск, дописуємо в кінець \u003cb>s\u003c/b>.", "vars": {"a": "'к іт'", "s": "'к'", "k": "'к'"}}, {"line": 4, "k": "Пропуск", "say": "\u003cb>k = ' '\u003c/b> — умова хибна, \u003cb>s\u003c/b> не змінюється.", "vars": {"a": "'к іт'", "s": "'к'", "k": "' '"}}, {"line": 4, "k": "Далі", "say": "\u003cb>k = 'і'\u003c/b> — дописуємо: \u003cb>s = 'кі'\u003c/b>.", "vars": {"a": "'к іт'", "s": "'кі'", "k": "'і'"}}, {"line": 4, "k": "Останній символ", "say": "\u003cb>k = 'т'\u003c/b> — \u003cb>s = 'кіт'\u003c/b>. Символи скінчились.", "vars": {"a": "'к іт'", "s": "'кіт'", "k": "'т'"}}, {"line": 5, "k": "Результат", "say": "Обидва способи дають \u003cb>кіт\u003c/b>: цикл і метод \u003cb>replace\u003c/b>.", "vars": {"a": "'к іт'", "s": "'кіт'", "k": "'т'"}, "out": "кіт кіт"}
