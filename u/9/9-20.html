a[j], a[j+1] = a[j+1], a[j]\u003c/b>"], ["Що змінити, щоб сортувати \u003cb>10\u003c/b> чисел?", "\u003cb class=\"mono\">range(9)\u003c/b> і \u003cb class=\"mono\">range(9-i)\u003c/b>; для будь-якої кількості — \u003cb class=\"mono\">range(len(a)-1)\u003c/b> і \u003cb class=\"mono\">range(len(a)-1-i)\u003c/b>."]]}, {"type": "text", "sec": "📖 Історія", "title": "Цікаві факти з історії", "body": [{"k": "p", "text": "Швидке сортування знадобилося ще на початку ХХ ст. — для перепису населення США. Алгоритми сортування розробляли:"}, {"k": "grid", "items": [{"img": "a920_neumann", "t": "Джон фон Нейман", "x": "1903–1957"}, {"img": "a920_glushkov", "t": "Віктор Глушков", "x": "Інститут кібернетики його імені"}, {"img": "a920_zhaldak", "t": "Мирослав Жалдак", "x": "1937–2021"}, {"img": "a920_trius", "t": "Юрій Тріус", "x": "нар. 1957"}], "n": 4, "h": 200}]}, {"type": "reveal", "sec": "🔍 Пошук", "title": "Пригадайте та поміркуйте", "items": [["Для чого операція \u003cb class=\"mono\">in\u003c/b>?", "Перевіряє, чи є значення у списку: \u003cb class=\"mono\">3 in a\u003c/b> дає True або False."], ["Що дають методи \u003cb class=\"mono\">count\u003c/b> і \u003cb class=\"mono\">index\u003c/b>?", "\u003cb class=\"mono\">a.count(x)\u003c/b> — скільки разів є x; \u003cb class=\"mono\">a.index(x)\u003c/b> — індекс першого x."], ["Від чого залежить швидкість пошуку?", "Від кількості даних і від того, чи їх \u003cb>упорядковано\u003c/b>."], ["Навіщо шукати якнайшвидше? Наведіть приклади.", "Пошук в інтернеті, контакт у телефоні, квиток на потяг — чекати ніхто не хоче."]]}, {"type": "text", "sec": "🔍 Пошук", "title": "Що шукають у списках", "img": "a920_find", "body": [{"k": "p", "text": "Задачі пошуку відповідають на три питання:"}, {"k": "list", "items": ["\u003cb>Чи є\u003c/b> елемент із таким значенням?", "\u003cb>Скільки\u003c/b> таких елементів?", "\u003cb>Де\u003c/b> вони — з якими індексами?"]}, {"k": "box", "tone": "sky", "blocks": [{"k": "p", "text": "Список учнів школи: чи
