актори", "body": [{"k": "p", "text": "\u003cb>Текстові редактори\u003c/b> — прості документи без форматування, малюнків і таблиць. Є в редакторах вебсторінок і середовищах програмування."}, {"k": "grid", "items": [{"img": "a97_notepad", "t": "Блокнот"}, {"img": "a97_py", "t": "Редактор Python"}, {"e": "💻", "t": "Kate (Linux)"}], "n": 3, "h": 110}]}, {"label": "Процесори", "body": [{"k": "p", "text": "\u003cb>Текстові процесори\u003c/b> — документи складної структури: форматування, макетування, малюнки й таблиці."}, {"k": "grid", "items": [{"img": "a97_wordlogo", "t": "Microsoft Word"}, {"img": "a97_writer", "t": "LibreOffice Writer"}, {"img": "a97_gdocs", "t": "Google Документи"}], "n": 3, "h": 110}]}, {"label": "Наукові", "body": [{"k": "p", "text": "\u003cb>Редактори наукових документів\u003c/b> — математичні й хімічні формули, спеціальні символи, складні діаграми."}, {"k": "grid", "items": [{"img": "a97_latex", "t": "LaTeX"}, {"img": "a97_mtype", "t": "MathType"}, {"img": "a97_texmaker", "t": "Texmaker"}], "n": 3, "h": 110}]}, {"label": "Видавничі", "body": [{"k": "p", "text": "\u003cb>Видавничі системи\u003c/b> — макети поліграфічних видань, від рекламних проспектів до книжок, і підготовка до друку."}, {"k": "grid", "items": [{"img": "a97_quark", "t": "QuarkXPress"}, {"img": "a97_scribus", "t": "Scribus"}, {"img": "a97_indd", "t": "Adobe InDesign"}], "n": 3, "h": 110}]}, {"label": "Переклад", "body": [{"k": "p", "text": "\u003cb>Системи машинного перекладу\u003c/b> — автоматичний переклад з однієї мови на іншу, перевірка правопису різними мовами."}, {"k": "grid", "items": [{"img": "a97_gtr", "t": "Google Перекладач"}, {"img": "a97_deepl", "t": "DeepL"}], "n": 2, "h": 110}]}, {"label": "Текст із фото", "body": [{"k": "p", "text": "\u003cb>Системи оптичного розпізнавання\u003c/b> — перетворюють зображення тексту (фото, скан) на текст, який можна редагувати."}, {"k": "grid", "items": [{"img": "a97_gcv", "t": "Google Cloud Vision"}, {"img": "a97_tess", "t": "Tesseract"}], "n": 2, "h": 110}]}, {"label": "Мовлення", "body": [{"k": "p", "text": "\u003cb>Системи розпізнавання мовлення\u003c/b> — перетворюють усне мовлення на текст: голосове введення, транскрибування."}, {"k": "grid", "items": [{"img": "a97_azure", "t": "Microsoft Azure Speech"}, {"img": "a97_transcr", "t": "Amazon Transcribe"}], "n": 2, "h": 110}]}]}, {"type": "cards", "sec": "🖥 Програми", "title": "Локальні й хмарні системи", "bit": "Хто вже редагував документ разом з однокласниками?", "n": 2, "intro": "За типом доступу системи опрацювання текстів бувають:", "cards": [{"img": "a97_wordlogo", "t": "Локальні", "x": "Установлюються на комп’ютер і працюють без інтернету"}, {"img": "a97_m365", "t": "Хмарні", "x": "Доступні онлайн, зручні для спільної роботи: Google Документи, Microsoft 365"}]}, {"type": "text", "sec": "🖥 Програми", "title": "WYSIWYG — що бачиш, те й отримаєш", "img": "a97_wys", "body": [{"k": "p", "text": "\u003cb>W\u003c/b>hat \u003cb>Y\u003c/b>ou \u003cb>S\u003c/b>ee \u003cb>I\u003c/b>s \u003cb>W\u003c/b>hat \u003cb>Y\u003c/b>ou \u003cb>G\u003c/b>et."}, {"k": "def", "text": "\u003cb>WYSIWYG\u003c/b> — технологія, за якої документ на екрані виглядає так само, як буде надрукований або збережений у файлі.", "f": true}, {"k": "p", "text": "Її підтримує більшість систем опрацювання текстів.", "small": true, "f": true}]}, {"type": "reveal", "sec": "🧩 Об’єкти", "title": "Пригадайте", "img": "a97_q2", "items": [["З яких об’єктів складається текстовий документ?", "Символи, слова, речення, абзаци, сторінки, а ще малюнки, таблиці, діаграми."], ["Які операції виконують над об’єктами?", "Створення, редагування, форматування."]]}, {"type": "text", "sec": "🧩 Об’єкти", "title": "Об’єкти текстового документа", "body": [{"k": "p", "text": "Основний об’єкт опрацювання — \u003cb>текстовий документ\u003c/b>. У ньому є інші об’єкти:"}, {"k": "chips", "items": ["символ", "слово", "речення", "абзац", "сторінка"], "f": true}, {"k": "chips", "items": ["малюнок", "таблиця", "
