ії\u003c/b>;", "колір і стиль \u003cb>заливки\u003c/b>."]}]}, {"type": "table", "sec": "🖼 Растрові", "title": "Растрове і векторне: що кодують", "head": ["Ознака", "Растрове", "Векторне"], "rows": [["Складається з", "пікселів", "графічних примітивів"], ["Що кодують", "колір \u003cb>кожного пікселя\u003c/b>", "властивості \u003cb>кожної фігури\u003c/b>"], ["Збільшили в 10 разів", "видно «сходинки» з пікселів", "краї гладкі: фігуру перемальовано за описом"], ["Довжина коду залежить від", "кількості пікселів", "кількості фігур"]], "frag": true, "leftFirst": true}, {"type": "text", "sec": "🎨 Кольори", "title": "Колірна модель", "img": "a83_spectr", "body": [{"k": "p", "text": "Код кольору задають за певним правилом — \u003cb>колірною моделлю\u003c/b>."}, {"k": "def", "text": "\u003cb>Колірна модель\u003c/b> — спосіб кодування різних кольорів спектра впорядкованим набором числових значень певних \u003cb>базових компонентів\u003c/b>.", "f": true}, {"k": "p", "text": "\u003cb>Спектр\u003c/b> — багатоколірна смуга, яка утворюється, коли біле світло проходить крізь призму.", "small": true, "f": true}]}, {"type": "cards", "sec": "🎨 Кольори", "title": "Три найпоширеніші моделі", "bit": "Екран, принтер, художник — у кожного своя модель!", "n": 3, "intro": "У комп’ютерній графіці найчастіше використовують:", "cards": [{"img": "a83_monitor", "t": "RGB", "x": "зображення на екрані"}, {"img": "a83_printer", "t": "CMYK", "x": "друк зображення"}, {"img": "a83_fan", "t": "HSV (HSB)", "x": "коригування кольорів"}]}, {"type": "text", "sec": "🎨 Кольори", "title": "Модель RGB", "img": "a83_rgb", "body": [{"k": "p", "text": "Базові компоненти — три кольори спектра:"}, {"k": "list", "items": ["\u003cb>R\u003c/b> — червоний (Red)", "\u003cb>G\u003c/b> — зелений (Green)", "\u003cb>B\u003c/b> — синій (Blue)"]}, {"k": "p", "text": "Інтенсивність кожного — ціле число від \u003cb>0 до 255\u003c/b>.", "f": true}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "256 · 256 · 256 ≈ \u003cb>16,7 млн\u003c/b> кольорів"}], "f": true}]}, {"type": "widget", "sec": "🎨 Кольори", "title": "Змішуємо світло: модель RGB", "w": "rgb83", "intro": "Повзунки можна рухати. Пробіл або клік — далі."}, {"type": "text", "sec": "🎨 Кольори", "title": "Модель CMYK", "img": "a83_cmyk", "body": [{"k": "p", "text": "Чотири базові компоненти — фарби принтера:"}, {"k": "list", "items": ["\u003cb>C\u003c/b> — блакитний (Cyan)", "\u003cb>M\u003c/b> — пурпурний (Magenta)", "\u003cb>Y\u003c/b> — жовтий (Yellow)", "\u003cb>K\u003c/b> — чорний (blacK)"]}, {"k": "p", "text": "Частка кожного — у відсотках, від \u003cb>0 до 100\u003c/b>.", "f": true}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Теоретично 101⁴ ≈ \u003cb>100 млн\u003c/b> кольорів, на практиці — залежить від чорнил і принтера."}], "f": true}]}, {"type": "table", "sec": "🎨 Кольори", "title": "RGB чи CMYK", "bit": "Світло додається, фарба віднімає!", "head": ["Ознака", "RGB", "CMYK"], "rows": [["Звідки колір", "екран \u003cb>світить\u003c/b> сам", "папір \u003cb>відбиває\u003c/b> світло"], ["Як змішуються", "світло \u003cb>додається\u003c/b>", "фарба \u003cb>поглинає\u003c/b> світло"], ["Усе на максимум", "білий", "чорний"], ["Усе на нулі", "чорний", "білий (чистий папір)"], ["Значення", "від 0 до 255", "від 0 до 100 %"]], "frag": true, "leftFirst": true}, {"type": "text", "sec": "🎨 Кольори", "title": "Модель HSV (HSB)", "img": "a83_hsv", "body": [{"k": "list", "items": ["\u003cb>H\u003c/b> — відтінок (Hue): місце на колі кольорів, від \u003cb>0° до 360°\u003c/b>", "\u003cb>S\u003c/b> — насиченість (Saturation): чистота кольору, від \u003cb>0 до 100 %\u003c/b>", "\u003cb>V (B)\u003c/b> — яскравість (Value, Brightness): від \u003cb>0 до 100 %\u003c/b>"]}, {"k": "p", "text": "Значення можуть бути дробовими, тож теоретично кольорів \u003cb>необмежено\u003c/b>. Схожа модель \u003cb>HSL\u003c/b>: третій компонент — світлість (Lightness), близькість до білого.", "small": true, "f": true}]}, {"type": "widget", "sec": "🎨 Кольори", "title": "Колесо відтінків: модель HSV", "w": "hsv83", "intro": "Повзунки можна рухати. Пробіл або клік — далі."}, {"type": "table", "sec": "🎨 Кольори", "title": "Один колір — три коди", "head": ["Колір", "RGB", "CMYK", "HSV"], "rows": [["Білий", "255, 255, 255", "0, 0, 0, 0", "0°, 0, 100"], ["Чорний", "0, 0, 0", "0, 0, 0, 100", "0°, 0, 0"], ["Сірий", "122, 122, 122", "0, 0, 0, 52", "0°, 0, 48"], ["Жовтий", "255, 255, 0", "0, 0, 100, 0", "60°, 100, 100"], ["Рожевий", "255, 128, 192", "0, 50, 25, 0", "330°, 50, 100"], ["Смарагдовий", "80, 200, 120", "60, 0, 40, 22", "140°, 60, 78"]], "frag": true, "leftFirst": true}, {"type": "shot", "sec": "🎨 Кольори", "title": "Де побачити код кольору", "img": "a83_word", "intro": "Word, Excel: Колір шрифту чи заливки → Інші кольори… Пробіл або клік — далі.", "spots": [{"l": "1. Спектр", "r": [19, 11, 18, 7], "t": "У вікні \u003cb>Кольори\u003c/b> відкриваємо вкладку \u003cb>Спектр\u003c/b>."}, {"l": "2. Вибір кольору", "r": [5, 25, 63, 34], "t": "Клацаємо потрібний колір, праворуч — повзунок \u003cb>яскравості\u003c/b>."}, {"l": "3. Колірна модель", "r": [4, 60, 64, 7], "t": "Список \u003cb>Колірна модель\u003c/b>: \u003cb>RGB\u003c/b> або \u003cb>HSL\u003c/b>."}, {"l": "4. Код кольору", "r": [4, 67, 51, 21], "t": "Три числа моделі RGB: \u003cb>Червоний\u003c/b>, \u003cb>Зелений\u003c/b>, \u003cb>Синій\u003c/b> — від 0 до 255."}, {"l": "5. Новий колір", "r": [77, 70, 16, 22], "t": "Тут видно новий колір поруч із поточним."}]}, {"type": "reveal", "sec": "🎬 Мультимедіа", "title": "Пригадайте", "img": "a83_q2", "items": [["Які дані називають мультимедійними?", "Дані, що поєднують текст, звук, зображення, відео й анімацію."], ["Як утворюються рухомі зображення?", "Окремі кадри швидко змінюють один одного."], ["Що ви знаєте про звук і його властивості?", "Звук — це хвилі. Буває високий і низький, гучний і тихий."]]}, {"type": "text", "sec": "🎬 Мультимедіа", "title": "Кодування відео й анімації", "img": "a83_video", "body": [{"k": "p", "text": "Відео й анімація — це набір окремих \u003cb>кадрів\u003c/b>, які змінюються з певною швидкістю."}, {"k": "list", "items": ["кодують зображення \u003cb>кожного кадру\u003c/b>;", "для плавного руху — \u003cb>24 і більше\u003c/b> кадрів за секунду;", "усі закодовані кадри зберігаються в \u003cb>одному файлі\u003c/b>."]}]}, {"type": "widget", "sec": "🎬 Мультимедіа", "title": "Скільки чисел в 1 секунді відео", "w": "kadr83", "intro": "Пробіл або клік — далі."}, {"type": "text", "sec": "💬 Звук", "title": "Звук і його властивості", "bit": "Писк комара — висока частота!", "body": [{"k": "p", "text": "Звук — це \u003cb>хвилі\u003c/b>, що поширюються в пружному середовищі: газі, рідині, твердому тілі."}, {"k": "cols", "items": [{"k": "p", "text": "\u003cb>Висота тону\u003c/b> — залежить від \u003cb>частоти\u003c/b> коливань: більша частота — вищий звук."}, {"k": "p", "text": "\u003cb>Гучність\u003c/b> — залежить від \u003cb>амплітуди\u003c/b> хвилі: більша амплітуда — гучніший звук."}], "f": true}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Кодування звуку — це кодування \u003cb>числами\u003c/b> значень цих властивостей."}], "f": true}]}, {"type": "widget", "sec": "💬 Звук", "title": "Як звук стає числами", "w": "zvuk83", "intro": "Пробіл або клік — далі."}, {"type": "text", "sec": "💬 Звук", "title": "Частота і крок дискретизації", "body": [{"k": "def", "text": "\u003cb>Частота дискретизації\u003c/b> — кількість вимірювань значень звукового сигналу за одну секунду; \u003cb>крок дискретизації\u003c/b> — інтервал часу між вимірюваннями."}, {"k": "img", "img": "a83_hvylia", "h": 200}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "Голос — \u003cb>8 000\u003c/b> вимірювань за секунду, якісна музика — \u003cb>не менше 44 000\u003c/b>."}], "f": true}]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Обговоріть і зробіть висновки", "items": [["У растровому й векторному редакторах створили однакові зображення світлофора. Код якого довший? Чому?", "Растрового: кодують колір кожного пікселя. У векторному — лише прямокутник і три круги."], ["Як довжина коду звуку залежить від частоти дискретизації?", "Що більша частота дискретизації, то більше вимірювань — і тим довший код."], ["Чому для друку використовують модель CMYK, а не RGB?", "Принтер не світить, а наносить фарби: блакитну, пурпурну, жовту й чорну."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Правда чи міф?", "items": [["У моделі RGB кожну складову задають числом від 0 до 100.", "Міф. Від 0 до 255. Від 0 до 100 % — у CMYK."], ["Якщо R = G = B, колір білий, чорний або сірий.", "Правда."], ["Відтінок у моделі HSV задають у градусах.", "Правда. Від 0° до 360° — місце на колі кольорів."], ["Відео — це один великий малюнок.", "Міф. Це набір кадрів, і кожен закодовано окремо."]]}, {"type": "reveal", "sec": "Обговорюємо", "title": "Дайте відповіді", "items": [["У чому полягає кодування растрового, векторного і рухомого зображення?", "Растрового — код кольору кожного пікселя; векторного — опис властивостей примітивів; рухомого — кодування кожного кадру."], ["Які властивості звуку використовують для його кодування?", "Висоту тону (частоту) і гучність (амплітуду)."]]}, {"type": "quiz", "sec": "Підсумки", "title": "Перевір себе", "qs": [{"q": "Що кодують для кожного пікселя растрового зображення?", "a": ["Колір", "Радіус", "Товщину лінії", "Стиль заливки"], "ok": 0, "exp": "Растрове зображення — це коди кольорів усіх пікселів."}, {"q": "Яку колірну модель використовують для зображень на екрані?", "a": ["CMYK", "RGB", "HSL", "ASCII"], "ok": 1, "exp": "Екран змішує червоне, зелене й синє світло."}, {"q": "Який колір має код RGB (255, 255, 0)?", "a": ["Білий", "Червоний", "Жовтий", "Зелений"], "ok": 2, "exp": "Червоне + зелене світло на максимум дають жовтий."}, {"q": "У якій моделі є окремий компонент для чорного кольору?", "a": ["RGB", "HSV", "HSL", "CMYK"], "ok": 3, "exp": "K — чорний (blacK): у принтері окремий чорний картридж."}, {"q": "Що таке частота дискретизації звуку?", "a": ["Кількість вимірювань звуку за одну секунду", "Гучність звуку", "Кількість кадрів за секунду", "Час між двома звуками"], "ok": 0, "exp": "Голосу досить 8 000 вимірювань за секунду, музиці — не менше 44 000."}]}, {"type": "home", "sec": "Фініш", "items": [["📖 Підручник", "§ 1.2 (с. 14–18)", "Запитання 3–4 на с. 17."], ["✍ Практична і тест", "Кольори в числах", "Excel або телефон."]]}]};
