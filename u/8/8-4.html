ди", "сторони горизонту: 00 — північ, 01 — схід, 10 — південь, 11 — захід"], ["3", "000 … 111 — \u003cb>8\u003c/b> кодів", "номер рядка шахівниці; 8 кольорів"]], "frag": true}, {"type": "widget", "sec": "📏 Біт і байт", "title": "Скільки кодів дають біти", "w": "bitsN", "intro": "Пробіл або клік — додаємо ще один біт."}, {"type": "text", "sec": "📏 Біт і байт", "title": "Байт", "body": [{"k": "img", "img": "a84_bajt", "h": 110}, {"k": "def", "text": "\u003cb>Байт\u003c/b> — послідовність із \u003cb>8 бітів\u003c/b>. Позначають великою літерою \u003cb>Б\u003c/b>.", "f": true}, {"k": "box", "tone": "sun", "blocks": [{"k": "p", "text": "\u003cb>1 Б = 8 б\u003c/b>"}], "f": true}, {"k": "p", "text": "8 бітів дають 2⁸ = \u003cb>256\u003c/b> кодів — досить для українських і англійських літер, цифр і знаків. Стільки кодів у таблицях \u003cb>Windows-1251\u003c/b> і \u003cb>КОІ-8U\u003c/b>.", "f": true}]}, {"type": "reveal", "sec": "📏 Біт і байт", "title": "Поміркуйте", "img": "a84_dumka", "items": [["Для чого вимірювати обсяг даних?", "Щоб знати, чи вміститься файл на флешку чи в повідомлення і скільки часу його передавати."], ["Робота яких пристроїв залежить від обсягу даних?", "Носіїв даних (флешка, диск), мережі, процесора: великий файл довше зберігати, передавати й опрацьовувати."]]}, {"type": "text", "sec": "📏 Біт і байт", "title": "Довжина двійкового коду", "img": "a84_obsiag", "body": [{"k": "def", "text": "\u003cb>Обсяг даних\u003c/b>, або \u003cb>довжина двійкового коду\u003c/b> повідомлення, — кількість бітів у його двійковому коді. Вимірюють також у \u003cb>байтах\u003c/b>."}, {"k": "p", "text": "Знаючи довжину коду, можна розрахувати:", "f": true}, {"k": "list", "items": ["скільки повідомлень уміститься на носії даних;", "який обсяг даних передати мережею;", "скільки часу триватиме опрацювання."]}]}, {"type": "widget", "sec": "📄 Текст", "title": "Кожен символ — один байт", "w": "textenc", "intro": "У таблиці Windows-1251 код символу — число від 0 до 255, тобто один числення\u003c/b>."}, {"type": "steps", "sec": "📐 Числа", "title": "Як прочитати двійкове число", "intro": "Цифри числа показують, скільки в ньому одиниць, двійок, четвірок, вісімок…", "steps": ["Як у десятковій: 5328₁₀ = 5 · 1000 + 3 · 100 + 2 · 10 + 8", "Підпишемо розряди 1011₂ справа наліво: \u003cb>1, 2, 4, 8\u003c/b>", "1011₂ = 1 · 8 + 0 · 4 + 1 · 2 + 1 · 1"], "answer": "1011₂ = 8 + 2 + 1 = \u003cb>11₁₀\u003c/b>"}, {"type": "steps", "sec": "📐 Числа", "title": "Задача: число 13 у двійковій системі", "intro": "Подамо 13 сумою степенів двійки: 8, 4, 2, 1.", "steps": ["Найбільший степінь, що вміщується в 13, — \u003cb>8\u003c/b>. Залишок: 13 − 8 = 5.", "У 5 вміщується \u003cb>4\u003c/b>. Залишок: 5 − 4 = 1.", "\u003cb>2\u003c/b> не вміщується в 1 — цифра 0. Лишається \u003cb>1\u003c/b> — цифра 1."], "answer": "13 = 1 · 8 + 1 · 4 + 0 · 2 + 1 · 1 = \u003cb>1101₂\u003c/b>"}, {"type": "widget", "sec": "📐 Числа", "title": "Число в одному байті", "w": "byte", "intro": "Двійковий запис доповнюють зліва нулями до 8 цифр — виходить байт числа."}, {"type": "cards", "sec": "🖼 Малюнки", "title": "Малюнки, звук і відео — теж двійковий код", "bit": "Фото, пісня і фільм — усе це нулі й одиниці!", "n": 3, "intro": "Для опрацювання комп’ютером їх також кодують двійковими кодами:", "cards": [{"img": "a84_malunok", "t": "Малюнок", "x": "коди кольорів пікселів"}, {"img": "a84_zvuk", "t": "Звук", "x": "числові значення властивостей звуку"}, {"img": "a84_video", "t": "Відео", "x": "кадри-малюнки і звук"}]}, {"type": "text", "sec": "🖼 Малюнки", "title": "Глибина кольору", "body": [{"k": "def", "text": "\u003cb>Глибина кольору\u003c/b> — кількість бітів, вибраних для кодування кольору одного пікселя."}, {"k": "p", "text": "У Paint її вибирають під час збереження у форматі \u003cb>BMP\u003c/b> — у списку \u003cb>Тип файлу\u003c/b>:", "f": true}, {"k": "img", "img": "a84_paint", "h": 230}]}, {"type": "table", "sec": "🖼 Малюнки", "title": "Глибина кольору в Paint", "head": ["Тип файлу BMP",
